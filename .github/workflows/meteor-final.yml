name: Apply clean diagonal shooting star effect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shooting star effect
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css=r""".shoot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #fff,0 0 22px 7px #ffe56a;opacity:0;z-index:18;pointer-events:none}.shoot:before{content:'';position:absolute;right:2px;top:50%;width:150px;height:3px;border-radius:999px;background:linear-gradient(to left,#fff 0%,#fff8c4 25%,#ffe36b66 58%,transparent 100%);transform:translateY(-50%);filter:blur(.35px)}.shoot.long:before{width:210px;height:4px}.shoot.big{width:10px;height:10px;box-shadow:0 0 14px 5px #fff,0 0 28px 9px #ffe56a}.shoot.go{animation:meteorClean 1.35s cubic-bezier(.12,.72,.18,1) forwards}.shoot.slow.go{animation-duration:2s}"""
          s=re.sub(r'\.shoot\{.*?\.comet\.go\{animation:cometAcross 2\.35s cubic-bezier\(\.2,\.65,\.15,1\) forwards\}',css,s,count=1)
          anim=r"""@keyframes meteorClean{0%{opacity:0;left:108%;top:var(--sy);transform:scale(.35) rotate(0)}7%{opacity:1}20%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1.05)}100%{opacity:0;left:-20%;top:calc(var(--sy) + var(--drop));transform:scale(.8)}}"""
          s=re.sub(r'@keyframes meteorRTL\{.*?@keyframes cometAcross\{.*?\}',anim,s,count=1)
          a=s.index('function shootingStars()')
          b=s.index('function firework(',a)
          fn="""function shootingStars(){const count=innerWidth<600?28:44;for(let i=0;i<count;i++)setTimeout(()=>{const s=document.createElement('i');s.className='shoot go '+(Math.random()>.78?'long ':'')+(Math.random()>.88?'big ':'')+(Math.random()>.55?'slow':'');s.style.setProperty('--sy',(6+Math.random()*76)+'vh');s.style.setProperty('--drop',(10+Math.random()*18)+'vh');page2.appendChild(s);setTimeout(()=>s.remove(),2300)},Math.random()*5200+i*170)}
          """
          s=s[:a]+fn+s[b:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make shooting stars clean diagonal streaks' || exit 0
          git push
