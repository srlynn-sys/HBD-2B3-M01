name: Center Burmese Birthday Text
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and translate storyline text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='''<style>.story{top:50%!important;left:50%!important;width:min(900px,88vw)!important;transform:translate(-50%,-50%)!important;font-size:clamp(20px,4vw,38px)!important;line-height:1.5!important;font-weight:700!important;text-align:center!important;padding:18px 24px!important;text-shadow:0 0 12px #fff,0 0 28px #8ec5ff,0 4px 20px #000!important}.story.show{animation:storyCenter 1.1s ease forwards!important}@keyframes storyCenter{from{opacity:0;transform:translate(-50%,-42%) scale(.88);filter:blur(8px)}to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}.title{font-size:clamp(30px,7vw,76px)!important;line-height:1.15!important;text-align:center}.name{font-size:clamp(25px,5vw,56px)!important}.restart{font-size:clamp(14px,3vw,20px)!important;font-weight:700}</style>'''
          s=s.replace(marker,css+marker,1)
          repl={
          '🎂 မီးလေးတစ်ခုခုကို နှိပ်ပါ':'🎂 ဖယောင်းတိုင်လေးကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ',
          '✨ ဒီနေ့ဟာ အထူးနေ့လေးတစ်နေ့ပါ... ✨':'✨ ဒီနေ့ဟာ Zwe Htet Myat ရဲ့ အထူးမွေးနေ့လေးပါ... ✨',
          '🌟 ဆုတောင်းချက်လေးတစ်ခုကို ကြယ်တွေဆီ ပို့လိုက်ကြမယ်...':'🌟 အရမ်းလှတဲ့ ဆုတောင်းချက်လေးတစ်ခုကို ကြယ်တွေဆီ ပို့လိုက်ကြမယ်... ✨',
          '🐦 ပျော်ရွှင်ခြင်းလေးတွေကို ငှက်ကလေးတွေက သယ်လာပြီ...':'🐦 ပျော်ရွှင်ခြင်းနဲ့ အံ့သြဖွယ်လက်ဆောင်လေးတွေကို ငှက်ကလေးတွေက သယ်လာပြီ... 🐦',
          '🌠 ကြယ်ကြွေလေးတွေက ညာဘက်ကနေ ဘယ်ဘက်ကို ဝေ့ဝိုက်ပြီး ကောင်းကင်ကို ဖြတ်သန်းလာပြီ...':'🌠 ကြယ်ကြွေလေးတွေက အလင်းတန်းရှည်ရှည်နဲ့ ကောင်းကင်ကို ဖြတ်သန်းလာပြီ... ဆုတောင်းချက်လေးတစ်ခု တောင်းလိုက်ပါ... ✨',
          '🌙 ကောင်းကင်တစ်ခုလုံး လင်းလက်နေပြီ... ဆုတောင်းချက်တိုင်း ပြည့်စုံပါစေ...':'🌙 ကောင်းကင်တစ်ခုလုံး လင်းလက်နေပြီ... Zwe Htet Myat ရဲ့ ဆုတောင်းချက်တိုင်း ပြည့်စုံပါစေ... 💫',
          'Happy Birthday<span class="name">Zwe Htet Myat ❤️</span>':'ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ<span class="name">Zwe Htet Myat ❤️</span>',
          '>Replay ✨</button>':'>မှော်အတတ်ကို ပြန်စမယ် ✨</button>'
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Center Burmese birthday storyline text"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/burmese-center-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary text update workflow"
          git push
