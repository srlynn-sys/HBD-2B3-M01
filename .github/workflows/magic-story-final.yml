name: Improve Birthday Story
on:
  push:
    paths:
      - '.github/workflows/magic-story-final.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch story and animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Replace storyline text in either English or earlier Burmese form.
          repl={
            'Once upon a time, a special star shined brighter than all the rest...':'တစ်ခါတုန်းက ကြယ်လေးတွေအပြည့်နဲ့ ကောင်းကင်ကြီးထဲမှာ ✨ အားလုံးထက် ပိုတောက်ပတဲ့ ကြယ်လေးတစ်လုံး ရှိခဲ့တယ်... အဲဒီကြယ်လေးက Zwe Htet Myat ပါ။ 💫',
            'Today, all the stars in the sky come together to grant you a super wish!':'ဒီနေ့တော့ 🌟 ကောင်းကင်ပေါ်က ကြယ်လေးတွေအားလုံး စုဝေးလာကြပြီ... Zwe Htet Myat အတွက် အလှပဆုံး ဆုတောင်းချက်တစ်ခုကို ဖြည့်ဆည်းပေးဖို့ပါ။ ✨',
            'Happy Birthday Zwe Htet Myat!':'🎂 ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ Zwe Htet Myat ❤️',
            'May your year be filled with laughter, adventure, and endless happiness! Keep shining big, Zwe Htet Myat!':'🌈 ဒီနှစ်တစ်နှစ်လုံး ရယ်မောခြင်း၊ စွန့်စားခန်းအသစ်တွေ၊ ပျော်ရွှင်ခြင်းတွေနဲ့ ပြည့်နေပါစေ။ ✨ ဘယ်တော့မှ မရပ်ဘဲ အမြဲတောက်ပနေပါစေ Zwe Htet Myat! ❤️',
            '🎂 မီးလေးတစ်ခုခုကို နှိပ်ပါ':'🎂 ဖယောင်းတိုင်လေးကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ',
            '✨ ဒီနေ့ဟာ အထူးနေ့လေးတစ်နေ့ပါ... ✨':'✨ ဒီနေ့ဟာ Zwe Htet Myat ရဲ့ အထူးမွေးနေ့လေးပါ... ✨',
            '🌟 ဆုတောင်းချက်လေးတစ်ခုကို ကြယ်တွေဆီ ပို့လိုက်ကြမယ်...':'🌟 နှလုံးသားထဲက ဆုတောင်းချက်လေးတစ်ခုကို ကြယ်တွေဆီ ပို့လိုက်ကြမယ်... ✨',
            '🐦 ပျော်ရွှင်ခြင်းလေးတွေကို ငှက်ကလေးတွေက သယ်လာပြီ...':'🐦 ပျော်ရွှင်ခြင်းနဲ့ အံ့သြစရာလက်ဆောင်လေးတွေကို ငှက်ကလေးတွေက သယ်လာပြီ... 🎁',
            '🌠 ကြယ်ကြွေလေးတွေက ညာဘက်ကနေ ဘယ်ဘက်ကို ဝေ့ဝိုက်ပြီး ကောင်းကင်ကို ဖြတ်သန်းလာပြီ...':'🌠 ကြယ်ကြွေလေးတွေက အလင်းတန်းရှည်ရှည်နဲ့ ကောင်းကင်ကို ဖြတ်သန်းလာပြီ... ဆုတောင်းချက်လေးတစ်ခု တောင်းလိုက်ပါ... ✨',
            '🌙 ကောင်းကင်တစ်ခုလုံး လင်းလက်နေပြီ... ဆုတောင်းချက်တိုင်း ပြည့်စုံပါစေ...':'🌙 ကောင်းကင်တစ်ခုလုံး လင်းလက်နေပြီ... Zwe Htet Myat ရဲ့ ဆုတောင်းချက်တိုင်း ပြည့်စုံပါစေ... 💫',
            'ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ':'🎂 ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ',
            'မှော်အတတ်ကို ပြန်စမယ် ✨':'မှော်ကမ္ဘာလေးကို ပြန်စမယ် ✨'
          }
          for a,b in repl.items(): s=s.replace(a,b)

          # Add a true centered-story treatment and a gentle cinematic scene transition.
          css='''<style id="magic-story-final">\n.story{top:50%!important;left:50%!important;right:auto!important;bottom:auto!important;width:min(920px,90vw)!important;transform:translate(-50%,-50%)!important;margin:0!important;padding:22px 26px!important;font-family:system-ui,"Noto Sans Myanmar",sans-serif!important;font-size:clamp(21px,4vw,40px)!important;line-height:1.65!important;font-weight:800!important;letter-spacing:0!important;text-align:center!important;color:#fff!important;text-shadow:0 0 8px #fff,0 0 24px #8fc8ff,0 5px 22px #000!important;opacity:0!important}\n.story.show{animation:magicStoryIn 1.5s cubic-bezier(.2,.8,.2,1) forwards!important}\n@keyframes magicStoryIn{0%{opacity:0;transform:translate(-50%,-44%) scale(.9);filter:blur(12px)}55%{opacity:1;transform:translate(-50%,-51%) scale(1.02);filter:blur(0)}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}\n@media(max-width:600px){.story{width:88vw!important;padding:16px 14px!important;font-size:clamp(19px,5.5vw,28px)!important;line-height:1.55!important}}\n</style>'''
          if 'id="magic-story-final"' not in s:
            s=s.replace('</head>',css+'</head>')

          # Make the finale explicitly Burmese even when the original markup uses the English sentence.
          s=s.replace('>Replay ✨</button>','>မှော်ကမ္ဘာလေးကို ပြန်စမယ် ✨</button>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Center Burmese birthday story and improve finale'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/magic-story-final.yml
          git commit -m 'Remove temporary story workflow'
          git push