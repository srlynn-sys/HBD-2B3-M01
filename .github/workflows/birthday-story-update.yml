name: Update birthday storyline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch single-file page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Add candle smoke styling.
          s=s.replace('.flame:after{content:', '.smoke{position:absolute;left:50%;top:-52px;width:7px;height:7px;border-radius:50%;background:#ffffffaa;opacity:0;transform:translateX(-50%);filter:blur(1px);pointer-events:none}.smoke.show{animation:smokeRise 1.2s ease-out forwards}.flame:after{content:')
          s=s.replace('@keyframes flicker{', '@keyframes smokeRise{0%{opacity:.8;transform:translate(-50%,0) scale(.6)}45%{opacity:.5;transform:translate(-35%,-18px) scale(1.6)}100%{opacity:0;transform:translate(-70%,-42px) scale(2.4)}}@keyframes flicker{')
          # Add balloons and a soft static star field behind the story.
          s=s.replace('.page2{position:absolute;', '.page2:before{content:\'\';position:absolute;inset:0;opacity:.65;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#fff8b8 1px,transparent 1.5px);background-size:83px 91px,127px 113px;background-position:10px 20px,55px 35px;animation:staticTwinkle 3s ease-in-out infinite alternate;z-index:1}.balloon{position:absolute;width:clamp(34px,5vw,62px);height:clamp(44px,7vw,78px);border-radius:50% 50% 46% 46%;z-index:14;opacity:0;box-shadow:inset -9px -8px #00000018,0 0 18px #ffffff33}.balloon:after{content:\'\';position:absolute;left:50%;top:98%;width:1px;height:90px;background:#ffffff88}.balloon.show{animation:balloonRise 8s ease-out forwards}@keyframes staticTwinkle{from{opacity:.35}to{opacity:.85}}@keyframes balloonRise{0%{opacity:0;transform:translateY(20vh) rotate(-8deg) scale(.75)}10%{opacity:1}50%{opacity:1;transform:translateY(-10vh) rotate(8deg) scale(1)}100%{opacity:0;transform:translateY(-125vh) rotate(-5deg) scale(.9)}}.page2{position:absolute;')
          # Make the page2 layer above its background but below content.
          s=s.replace('.star{position:absolute;', '.star{z-index:4;position:absolute;')
          # Replace the old 40-second celebrate sequence with a full 60-second sequence.
          start=s.index('function celebrate(){')
          end=s.index('candles.forEach(c=>{c.addEventListener', start)
          new=r'''function balloons(){
            const colors=['#ff5d8f','#ffd34e','#55d8ff','#9b7cff','#68e08b','#ff8a4c','#ff72e7'];
            for(let i=0;i<18;i++) setTimeout(()=>{
              const b=document.createElement('div'); b.className='balloon show';
              b.style.left=(3+Math.random()*94)+'%'; b.style.bottom=(-10-Math.random()*18)+'%';
              b.style.background=colors[i%colors.length]; b.style.animationDuration=(6+Math.random()*4)+'s';
              page2.appendChild(b); setTimeout(()=>b.remove(),11000);
            },i*320);
          }
          function celebrate(){
            if(done)return; done=true; initAudio();
            try{birthdaySong.currentTime=0;birthdaySong.play().catch(()=>{})}catch(e){}
            candles.forEach(c=>{
              c.disabled=true;
              const flame=c.querySelector('.flame');
              flame.style.display='none';
              const smoke=document.createElement('span'); smoke.className='smoke show'; c.appendChild(smoke);
            });
            pop(); cakeWrap.style.transition='1.5s'; cakeWrap.style.transform='scale(.82) translateY(20px)'; hint.classList.add('hide');
            setTimeout(()=>page2.classList.add('show'),500);
            // Phase 1 — 0–10s: starburst + birthday title.
            setTimeout(()=>{text('✨ Happy Birthday Zwe Htet Myat! ✨');stars();pop();},700);
            setTimeout(()=>{message.classList.add('show');},1800);
            setTimeout(()=>{message.classList.remove('show');},8500);
            setTimeout(()=>fireworks(),2500);
            // Phase 2 — 10–30s: dreamy sky + birds + story.
            setTimeout(()=>{sky.classList.add('show');skyStars();text('🌟 Once upon a time, a special star shined brighter than all the rest...');},10000);
            setTimeout(()=>{text('🐦 And today, happy little birds came flying with birthday wishes!');birdies();},14500);
            setTimeout(()=>{text('🎈 Every little smile became a colorful piece of birthday magic...');},21000);
            setTimeout(()=>{text('✨ The whole sky was getting ready for one super special wish!');},26000);
            // Phase 3 — 30–45s: shooting-star wish.
            setTimeout(()=>{text('🌠 Today, all the stars in the sky come together to grant you a super wish!');shootingStars();sparkle();},30000);
            setTimeout(()=>{text('💫 Close your eyes, make a wish, and let the stars carry it across the sky...');},38000);
            // Phase 4 — 45–60s: balloons + sprinkles + warm finale.
            setTimeout(()=>{balloons();fireworks();stars();text('🎈 May your year be filled with laughter, adventure, and endless happiness!');},45000);
            setTimeout(()=>{text('❤️ Keep shining big, Zwe Htet Myat!');finale();message.classList.add('show');},51500);
            setTimeout(()=>{message.classList.remove('show');text('🎂 Happy Birthday, Zwe Htet Myat! ❤️');restart.classList.add('show');},58000);
          }
          '''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Create full 60-second birthday magic storyline"
          git push
