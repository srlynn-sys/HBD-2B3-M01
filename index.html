<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Zwe Htet Myat 🎂</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,serif;background:#030518}.scene{position:relative;width:100%;height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,#fffaf0,#f7dfe5 45%,#e8c6d0)}.photo{position:absolute;top:4%;left:50%;transform:translateX(-50%);width:min(76vw,560px);height:min(76vw,560px);object-fit:cover;border-radius:50%;opacity:.76;filter:saturate(1.08) contrast(1.05);box-shadow:0 0 80px #772d483f}.cake-wrap{z-index:4;position:relative;width:min(520px,92vw);display:flex;justify-content:center;filter:drop-shadow(0 24px 24px #57223438)}.cake{position:relative;width:min(390px,76vw);height:min(250px,47vw);min-height:190px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:27px;border-radius:50%;background:linear-gradient(#fff,#ead6dc)}.tier{position:absolute;border:3px solid #923c4f24}.bottom{left:6%;bottom:22px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(#fff4f0,#f7c8cc 65%,#e8a6b0)}.top{left:14%;bottom:106px;width:72%;height:73px;border-radius:17px 17px 23px 23px;background:linear-gradient(#fff8f2,#f3b9c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:28px;border-radius:18px;background:#fffaf5}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.d1{left:17%}.d2{left:39%;height:38px}.d3{left:67%;height:31px}.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px #ffffff8c}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);cursor:pointer;z-index:8}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%)}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px #ffb43261,0 0 38px 10px #ff7c472e;animation:flicker .13s infinite alternate}.smoke{position:absolute;left:50%;top:-52px;width:7px;height:7px;border-radius:50%;background:#ffffffaa;opacity:0;transform:translateX(-50%);filter:blur(1px);pointer-events:none}.smoke.show{animation:smokeRise 1.2s ease-out forwards}.flame:after{content:'';position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%}.hint{position:absolute;z-index:6;bottom:7%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vw,19px);color:#713448;background:#ffffff9e;padding:10px 18px;border-radius:999px;white-space:nowrap;transition:.5s}.hint.hide{opacity:0}.page2:before{content:'';position:absolute;inset:0;opacity:.65;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#fff8b8 1px,transparent 1.5px);background-size:83px 91px,127px 113px;background-position:10px 20px,55px 35px;animation:staticTwinkle 3s ease-in-out infinite alternate;z-index:1}.balloon{position:absolute;width:clamp(34px,5vw,62px);height:clamp(44px,7vw,78px);border-radius:50% 50% 46% 46%;z-index:14;opacity:0;box-shadow:inset -9px -8px #00000018,0 0 18px #ffffff33}.balloon:after{content:'';position:absolute;left:50%;top:98%;width:1px;height:90px;background:#ffffff88}.balloon.show{animation:balloonRise 8s ease-out forwards}@keyframes staticTwinkle{from{opacity:.35}to{opacity:.85}}@keyframes balloonRise{0%{opacity:0;transform:translateY(20vh) rotate(-8deg) scale(.75)}10%{opacity:1}50%{opacity:1;transform:translateY(-10vh) rotate(8deg) scale(1)}100%{opacity:0;transform:translateY(-125vh) rotate(-5deg) scale(.9)}}.page2{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 55%,#18245e,#070b25 58%,#02030d);opacity:0;visibility:hidden;overflow:hidden}.page2.show{opacity:1;visibility:visible}.star{z-index:4;position:absolute;width:7px;height:7px;background:#fff5b5;border-radius:50%;box-shadow:0 0 15px 5px #ffe87b;opacity:0}.star.go{animation:starOut 3.8s cubic-bezier(.1,.7,.15,1) forwards}.shoot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #fff,0 0 22px 7px #ffe56a;opacity:0;z-index:18;pointer-events:none}.shoot:before{content:'';position:absolute;right:2px;top:50%;width:150px;height:3px;border-radius:999px;background:linear-gradient(to left,#fff 0%,#fff8c4 25%,#ffe36b66 58%,transparent 100%);transform:translateY(-50%);filter:blur(.35px)}.shoot.long:before{width:210px;height:4px}.shoot.big{width:10px;height:10px;box-shadow:0 0 14px 5px #fff,0 0 28px 9px #ffe56a}.shoot.go{animation:meteorClean 1.35s cubic-bezier(.12,.72,.18,1) forwards}.shoot.slow.go{animation-duration:2s}.fw{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;z-index:5}.fw.show{animation:fwPop 2.8s ease-out forwards}.fw i{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px 3px currentColor}.bird{position:absolute;z-index:12;width:108px;height:74px;opacity:0;filter:drop-shadow(0 5px 8px #0004)}.bird .tail{position:absolute;left:4px;top:40px;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:30px solid var(--tail);transform:rotate(-12deg)}.bird .body{position:absolute;left:27px;top:27px;width:58px;height:38px;border-radius:58% 48% 55% 62%;background:linear-gradient(145deg,var(--light),var(--body));box-shadow:inset -8px -7px #00000014,inset 8px 6px #ffffff47}.bird .belly{position:absolute;left:39px;top:40px;width:37px;height:23px;border-radius:50%;background:#fff4df}.bird .head{position:absolute;left:69px;top:14px;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--light),var(--body))}.bird .crest{position:absolute;left:78px;top:5px;width:9px;height:14px;background:var(--accent);border-radius:90% 10% 80% 10%;transform:rotate(-18deg);box-shadow:8px 2px 0 var(--accent),16px 5px 0 var(--accent)}.bird .wing{position:absolute;left:29px;top:21px;width:44px;height:36px;border-radius:80% 20% 65% 35%;background:linear-gradient(145deg,var(--accent),var(--wing));transform-origin:90% 55%;z-index:3}.bird .wing2{position:absolute;left:34px;top:25px;width:34px;height:25px;border-radius:70% 30% 70% 30%;background:var(--wing2);opacity:.8;transform:rotate(18deg)}.bird .eye{position:absolute;left:91px;top:26px;width:8px;height:8px;border-radius:50%;background:#161622;box-shadow:0 0 0 3px #ffffff73;z-index:6}.bird .eye:after{content:'';position:absolute;left:2px;top:1px;width:2px;height:2px;border-radius:50%;background:white}.bird .beak{position:absolute;left:99px;top:36px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:13px solid #ffbd32;z-index:6}.bird .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:white;box-shadow:0 0 8px 3px white;animation:sparkBird .8s infinite alternate}.sky{position:absolute;inset:0;opacity:0;z-index:10}.sky.show{animation:skyIn 3.5s ease forwards}.moon{position:absolute;right:12%;top:15%;width:clamp(52px,9vw,92px);height:clamp(52px,9vw,92px);border-radius:50%;background:#fff9d7;box-shadow:0 0 30px 9px #fff8d955}.moon:after{content:'';position:absolute;right:-13px;top:-5px;width:100%;height:100%;border-radius:50%;background:#0a0f32}.tw{position:absolute;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 12px 4px white;animation:twinkle 1.2s ease-in-out infinite alternate}.message{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0;text-align:center;pointer-events:none}.message.show{animation:messageIn 3.5s ease forwards}.title{margin:0;color:white;font-size:clamp(34px,8vw,92px);line-height:.95;text-shadow:0 0 35px #ffd86a99}.name{display:block;margin-top:16px;color:#ffe7a1;font-size:clamp(25px,5vw,56px)}.story{position:absolute;z-index:25;top:10%;left:50%;transform:translateX(-50%);width:90%;color:#fff9df;font-size:clamp(16px,3vw,26px);letter-spacing:1px;text-align:center;opacity:0;text-shadow:0 0 16px white}.story.show{animation:storyIn 3s ease forwards}.restart{position:absolute;z-index:40;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:#ffffff22;color:white;padding:10px 18px;border-radius:999px;opacity:0}.restart.show{opacity:1}@keyframes smokeRise{0%{opacity:.8;transform:translate(-50%,0) scale(.6)}45%{opacity:.5;transform:translate(-35%,-18px) scale(1.6)}100%{opacity:0;transform:translate(-70%,-42px) scale(2.4)}}@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94)}to{transform:translateX(-50%) rotate(48deg) scale(1.06)}}@keyframes starOut{0%{opacity:0;transform:translate(0,0) scale(.1)}8%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(540deg)}}@keyframes meteorClean{0%{opacity:0;left:108%;top:var(--sy);transform:scale(.35) rotate(0)}7%{opacity:1}20%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1.05)}100%{opacity:0;left:-20%;top:calc(var(--sy) + var(--drop));transform:scale(.8)}}10%{opacity:1}42%{opacity:1;transform:translate(-18vw,24vh) rotate(-8deg) scale(1)}72%{opacity:1;transform:translate(-54vw,52vh) rotate(-8deg) scale(1.1)}100%{opacity:0;transform:translate(-112vw,86vh) rotate(-8deg) scale(.7)}}@keyframes fwPop{0%{opacity:0;transform:scale(.05)}10%{opacity:1;transform:scale(.35)}70%{opacity:1}100%{opacity:0;transform:scale(1.55)}}@keyframes birdFly{0%{opacity:0;transform:translate(-18vw,25vh) scale(.55)}10%{opacity:1}30%{transform:translate(15vw,7vh) scale(.85)}55%{transform:translate(48vw,-5vh) scale(1)}78%{opacity:1;transform:translate(78vw,7vh) scale(.9)}100%{opacity:0;transform:translate(125vw,-17vh) scale(.72)}}@keyframes wingFlap{from{transform:rotate(20deg) scaleY(.72)}to{transform:rotate(-34deg) scaleY(1.08)}}@keyframes wingFlap2{from{transform:rotate(10deg)}to{transform:rotate(35deg)}}@keyframes sparkBird{from{opacity:.15;transform:scale(.5)}to{opacity:1;transform:scale(1.7)}}@keyframes skyIn{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}@keyframes storyIn{from{opacity:0;transform:translate(-50%,15px);filter:blur(8px)}to{opacity:1;transform:translate(-50%,0);filter:blur(0)}}@keyframes messageIn{0%{opacity:0;transform:scale(.45);filter:blur(14px)}70%{opacity:.8;transform:scale(1.04);filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}@media(max-width:600px){.photo{width:86vw;height:86vw}.cake-wrap{transform:scale(.94)}.candle{width:15px;height:61px}.flame{top:-39px;width:19px;height:30px}.bird{transform:scale(.72)}.story{top:7%}}<style>.story{top:50%!important;left:50%!important;width:min(900px,88vw)!important;transform:translate(-50%,-50%)!important;font-size:clamp(20px,4vw,38px)!important;line-height:1.5!important;font-weight:700!important;text-align:center!important;padding:18px 24px!important;text-shadow:0 0 12px #fff,0 0 28px #8ec5ff,0 4px 20px #000!important}.story.show{animation:storyCenter 1.1s ease forwards!important}@keyframes storyCenter{from{opacity:0;transform:translate(-50%,-42%) scale(.88);filter:blur(8px)}to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}.title{font-size:clamp(30px,7vw,76px)!important;line-height:1.15!important;text-align:center}.name{font-size:clamp(25px,5vw,56px)!important}.restart{font-size:clamp(14px,3vw,20px)!important;font-weight:700}</style></style></head><body><main class="scene"><img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'"><div class="cake-wrap" id="cakeWrap"><div class="cake"><div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div><div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div><button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div></div></div><div class="hint" id="hint">🎂 ဖယောင်းတိုင်လေးကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ</div><div class="page2" id="page2"><div class="story" id="story"></div><div class="sky" id="sky"><div class="moon"></div></div></div><div class="message" id="message"><h1 class="title">ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ<span class="name">Zwe Htet Myat ❤️</span></h1></div><button class="restart" id="restart">မှော်အတတ်ကို ပြန်စမယ် ✨</button></main><script>const page2=document.getElementById('page2'),sky=document.getElementById('sky'),message=document.getElementById('message'),story=document.getElementById('story'),hint=document.getElementById('hint'),cakeWrap=document.getElementById('cakeWrap'),candles=[...document.querySelectorAll('.candle')],restart=document.getElementById('restart');let done=false,audioCtx=null;const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function tone(f,d,t='sine',g=.06,delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime+delay);a.gain.setValueAtTime(0,audioCtx.currentTime+delay);a.gain.linearRampToValueAtTime(g,audioCtx.currentTime+delay+.02);a.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+d);o.connect(a).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+d+.03)}function pop(){tone(95,.12,'sine',.11);tone(520,.16,'triangle',.08,.02);tone(920,.1,'sine',.045,.04)}function sparkle(){tone(880,.28);tone(1320,.24,'sine',.025,.08);tone(1760,.2,'sine',.018,.16)}function birdsound(){tone(900,.15,'sine',.025);tone(1250,.14,'sine',.022,.1);tone(1050,.15,'sine',.02,.2)}function finale(){[523,659,784,1047].forEach((f,i)=>tone(f,.65,'sine',.045,i*.16));tone(1319,1,'triangle',.055,.7)}function stars(){for(let i=0;i<(innerWidth<600?190:300);i++){const s=document.createElement('i');s.className='star go';const a=Math.random()*Math.PI*2,d=Math.min(innerWidth,innerHeight)*(.25+Math.random()*1.1);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*1+'s';const z=3+Math.random()*9;s.style.width=z+'px';s.style.height=z+'px';page2.appendChild(s);setTimeout(()=>s.remove(),5200)}}function shootingStars(){const count=innerWidth<600?28:44;for(let i=0;i<count;i++)setTimeout(()=>{const s=document.createElement('i');s.className='shoot go '+(Math.random()>.78?'long ':'')+(Math.random()>.88?'big ':'')+(Math.random()>.55?'slow':'');s.style.setProperty('--sy',(6+Math.random()*76)+'vh');s.style.setProperty('--drop',(10+Math.random()*18)+'vh');page2.appendChild(s);setTimeout(()=>s.remove(),2300)},Math.random()*5200+i*170)}
function firework(x,y,delay,color){setTimeout(()=>{const f=document.createElement('div');f.className='fw show';f.style.left=x+'%';f.style.top=y+'%';f.style.color=color;for(let i=0;i<40;i++){const p=document.createElement('i'),a=i*Math.PI*2/40,r=28+Math.random()*120;p.style.left=Math.cos(a)*r+'px';p.style.top=Math.sin(a)*r+'px';f.appendChild(p)}page2.appendChild(f);pop();setTimeout(()=>f.remove(),3300)},delay)}function fireworks(){const c=['#ff3b6b','#ffd84d','#55e6ff','#9f7cff','#66ff9a','#ff8a3d','#ff6ff0','#fff'],p=[[16,28],[37,20],[62,27],[84,24],[25,48],[50,42],[75,47],[12,66],[39,62],[63,66],[88,63],[50,18]];p.forEach((q,i)=>firework(q[0],q[1],i*650,c[i%c.length]))}const pal=[['#ff7aa2','#ff4f7b','#ffd1dc','#ff9f43'],['#65d9ff','#25a8e0','#c8f5ff','#ffd84d'],['#b98cff','#7447d8','#eadbff','#ff78c8'],['#75e6a0','#29b968','#d7ffe8','#ffe45c'],['#ffbf5b','#ff6a3d','#ffe9b0','#ff4f81']];function makeBird(){const b=document.createElement('div');b.className='bird';const q=pal[Math.floor(Math.random()*pal.length)];b.style.setProperty('--body',q[0]);b.style.setProperty('--light',q[2]);b.style.setProperty('--wing',q[1]);b.style.setProperty('--wing2',q[3]);b.style.setProperty('--tail',q[1]);b.style.setProperty('--accent',q[3]);b.innerHTML='<span class="tail"></span><span class="body"></span><span class="belly"></span><span class="wing"></span><span class="wing2"></span><span class="head"></span><span class="crest"></span><span class="eye"></span><span class="beak"></span><i class="spark" style="left:15px;top:16px"></i>';b.style.top=(25+Math.random()*45)+'%';b.style.animation='birdFly 5.4s ease-in-out forwards';b.querySelector('.wing').style.animation='wingFlap .28s ease-in-out infinite alternate';b.querySelector('.wing2').style.animation='wingFlap2 .4s ease-in-out infinite alternate';page2.appendChild(b);birdsound();setTimeout(()=>b.remove(),5800)}function birdies(){for(let i=0;i<10;i++)setTimeout(makeBird,i*800)}function skyStars(){for(let i=0;i<75;i++){const s=document.createElement('i');s.className='tw';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*78)+'%';s.style.animationDelay=Math.random()*2+'s';sky.appendChild(s)}sparkle()}function text(t){story.textContent=t;story.classList.remove('show');void story.offsetWidth;story.classList.add('show')}function balloons(){
  const colors=['#ff5d8f','#ffd34e','#55d8ff','#9b7cff','#68e08b','#ff8a4c','#ff72e7'];
  for(let i=0;i<18;i++) setTimeout(()=>{
    const b=document.createElement('div'); b.className='balloon show';
    b.style.left=(3+Math.random()*94)+'%'; b.style.bottom=(-10-Math.random()*18)+'%';
    b.style.background=colors[i%colors.length]; b.style.animationDuration=(6+Math.random()*4)+'s';
    page2.appendChild(b); setTimeout(()=>b.remove(),11000);
  },i*320);
}
function celebrate(){
  if(done)return; done=true; initAudio();
  try{birthdaySong.currentTime=0;birthdaySong.play().catch(()=>{})}catch(e){}
  candles.forEach(c=>{
    c.disabled=true;
    const flame=c.querySelector('.flame');
    flame.style.display='none';
    const smoke=document.createElement('span'); smoke.className='smoke show'; c.appendChild(smoke);
  });
  pop(); cakeWrap.style.transition='1.5s'; cakeWrap.style.transform='scale(.82) translateY(20px)'; hint.classList.add('hide');
  setTimeout(()=>page2.classList.add('show'),500);
  // Phase 1 — 0–10s: starburst + birthday title.
  setTimeout(()=>{text('✨ Happy Birthday Zwe Htet Myat! ✨');stars();pop();},700);
  setTimeout(()=>{message.classList.add('show');},1800);
  setTimeout(()=>{message.classList.remove('show');},8500);
  setTimeout(()=>fireworks(),2500);
  // Phase 2 — 10–30s: dreamy sky + birds + story.
  setTimeout(()=>{sky.classList.add('show');skyStars();text('🌟 Once upon a time, a special star shined brighter than all the rest...');},10000);
  setTimeout(()=>{text('🐦 And today, happy little birds came flying with birthday wishes!');birdies();},14500);
  setTimeout(()=>{text('🎈 Every little smile became a colorful piece of birthday magic...');},21000);
  setTimeout(()=>{text('✨ The whole sky was getting ready for one super special wish!');},26000);
  // Phase 3 — 30–45s: shooting-star wish.
  setTimeout(()=>{text('🌠 Today, all the stars in the sky come together to grant you a super wish!');shootingStars();sparkle();},30000);
  setTimeout(()=>{text('💫 Close your eyes, make a wish, and let the stars carry it across the sky...');},38000);
  // Phase 4 — 45–60s: balloons + sprinkles + warm finale.
  setTimeout(()=>{balloons();fireworks();stars();text('🎈 May your year be filled with laughter, adventure, and endless happiness!');},45000);
  setTimeout(()=>{text('❤️ Keep shining big, Zwe Htet Myat!');finale();message.classList.add('show');},51500);
  setTimeout(()=>{message.classList.remove('show');text('🎂 Happy Birthday, Zwe Htet Myat! ❤️');restart.classList.add('show');},58000);
}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.onclick=()=>location.reload();</script></body></html>
