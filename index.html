<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday Zwe Htet Myat 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:#070b25;color:#fff}.scene{position:relative;width:100%;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 20%,#fff9ef 0,#f8e8df 38%,#e9cbd0 100%)}.backdrop{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,235,239,.25));z-index:0}.photo{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:min(76vw,560px);height:min(76vw,560px);max-height:72svh;object-fit:cover;object-position:center;border-radius:50%;opacity:.72;filter:saturate(1.05) contrast(1.06) brightness(1.02);box-shadow:0 0 80px rgba(119,45,72,.25);z-index:1}.cake-wrap{position:relative;z-index:3;width:min(520px,92vw);display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 24px 24px rgba(87,34,52,.22));transition:transform .5s ease}.cake-wrap.lit{animation:cakeGlow 1.7s ease-in-out infinite alternate}.cake{position:relative;width:min(390px,76vw);height:min(250px,47vw);min-height:190px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:27px;border-radius:50%;background:linear-gradient(#fff,#ead6dc);box-shadow:0 7px 0 rgba(100,44,59,.1)}.tier{position:absolute;border:3px solid rgba(146,60,79,.14)}.tier.bottom{left:6%;bottom:22px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(180deg,#fff4f0,#f7c8cc 65%,#e8a6b0)}.tier.top{left:14%;bottom:106px;width:72%;height:73px;border-radius:17px 17px 23px 23px;background:linear-gradient(180deg,#fff8f2,#f3b9c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:28px;border-radius:18px;background:#fffaf5;box-shadow:0 3px 0 rgba(159,76,96,.08)}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.drip.d1{left:17%}.drip.d2{left:39%;height:38px}.drip.d3{left:67%;height:31px}.drip.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px rgba(255,255,255,.55)}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);box-shadow:inset -3px 0 0 rgba(130,40,60,.12);cursor:pointer;z-index:8;touch-action:manipulation}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%);border-radius:2px}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px rgba(255,180,50,.38),0 0 38px 10px rgba(255,124,71,.18);animation:flicker .13s infinite alternate;transform-origin:55% 85%}.flame:after{content:'';position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%;opacity:.9}.hint{position:absolute;z-index:5;bottom:7%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vw,19px);letter-spacing:2px;color:#713448;background:rgba(255,255,255,.58);padding:10px 18px;border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap;transition:opacity .35s}.hint.hidden{opacity:0;pointer-events:none}
.page2{position:absolute;inset:0;z-index:12;background:radial-gradient(circle at 50% 55%,#121b52 0,#070b25 55%,#02030d 100%);opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}.page2.show{opacity:1;visibility:visible}.sparkle{position:absolute;z-index:14;width:7px;height:7px;background:#fff4b8;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 15px 5px rgba(255,238,151,.8);opacity:0}.sparkle.boom{animation:starBoom 2.1s cubic-bezier(.1,.8,.2,1) forwards}.firework{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;z-index:15;box-shadow:0 0 7px 2px currentColor}.firework.show{animation:fireworkBurst 1.8s ease-out forwards}.firework i{position:absolute;width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:0 0 8px 2px currentColor}.bird{position:absolute;z-index:16;font-size:clamp(28px,6vw,60px);opacity:0;filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}.bird.fly{animation:birdFly 2.7s ease-in-out forwards}.bird.b1{top:48%;left:-12%}.bird.b2{top:58%;left:-20%;font-size:clamp(22px,5vw,48px);animation-delay:.25s}.celestial{position:absolute;inset:0;z-index:17;opacity:0}.celestial.show{animation:celestialIn 2.4s ease forwards}.sun{position:absolute;left:12%;top:14%;width:clamp(55px,10vw,100px);height:clamp(55px,10vw,100px);border-radius:50%;background:#ffd85a;box-shadow:0 0 30px 10px rgba(255,215,80,.45),0 0 70px 20px rgba(255,180,50,.22)}.moon{position:absolute;right:14%;top:17%;width:clamp(50px,9vw,88px);height:clamp(50px,9vw,88px);border-radius:50%;background:#fff9d6;box-shadow:0 0 28px 8px rgba(255,255,220,.3)}.moon:after{content:'';position:absolute;right:-12px;top:-4px;width:100%;height:100%;border-radius:50%;background:#090d2b}.tiny-star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.8);animation:twinkle .8s ease-in-out infinite alternate}.message{position:absolute;z-index:30;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}.message.show{animation:messageIn 2.8s cubic-bezier(.2,.8,.2,1) forwards}.title{margin:0;text-align:center;font-size:clamp(34px,8vw,92px);line-height:.95;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 4px 18px rgba(255,255,255,.55),0 0 35px rgba(255,205,100,.45)}.name{display:block;margin-top:16px;font-size:clamp(25px,5vw,56px);letter-spacing:4px;color:#ffe7a1}.restart{position:absolute;z-index:35;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:rgba(255,255,255,.16);color:white;padding:10px 17px;border-radius:999px;font:inherit;cursor:pointer;opacity:0;pointer-events:none;transition:.3s}.restart.show{opacity:1;pointer-events:auto}
@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94,.98)}to{transform:translateX(-50%) rotate(48deg) scale(1.06,1.03)}}@keyframes cakeGlow{from{filter:drop-shadow(0 24px 24px rgba(87,34,52,.22))}to{filter:drop-shadow(0 24px 35px rgba(255,165,82,.4))}}@keyframes starBoom{0%{opacity:0;transform:translate(0,0) rotate(45deg) scale(.1)}8%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(405deg) scale(1.25)}}@keyframes fireworkBurst{0%{opacity:0;transform:scale(.1)}15%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes birdFly{0%{opacity:0;transform:translateX(0) translateY(30px) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translateX(125vw) translateY(-35px) scale(1)}}@keyframes celestialIn{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}@keyframes twinkle{from{opacity:.25;transform:scale(.65)}to{opacity:1;transform:scale(1.5)}}@keyframes messageIn{0%{opacity:0;transform:scale(.55);filter:blur(10px)}45%{opacity:.15;transform:scale(.78);filter:blur(5px)}75%{opacity:.72;transform:scale(1.04);filter:blur(1px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@media(max-width:600px){.scene{padding:12px}.photo{top:5%;width:86vw;height:86vw;opacity:.76}.cake-wrap{transform:scale(.94)}.candle{width:15px;height:61px}.flame{top:-39px;width:19px;height:30px}.hint{bottom:8%;letter-spacing:1px}.title{letter-spacing:1px}.name{letter-spacing:2px}}@media(max-height:620px) and (orientation:landscape){.cake-wrap{transform:scale(.68)}.hint{bottom:2%}.photo{top:3%;height:80vh;width:80vh}}@media(prefers-reduced-motion:reduce){.flame{animation:none}.cake-wrap.lit{animation:none}}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="backdrop"></div>
<img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'"/>
<div class="cake-wrap lit" id="cakeWrap"><div class="cake">
<div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div>
<div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div>
<button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div>
</div></div>
<div class="hint" id="hint">Happy Birthday 🎂 — မီးလေးတစ်ခုခုကို နှိပ်ပါ</div>
<div class="page2" id="page2"><div class="celestial" id="celestial"><div class="sun"></div><div class="moon"></div></div></div>
<div class="message" id="message"><h1 class="title">Happy Birthday<span class="name">Zwe Htet Myat ❤️</span></h1></div>
<button class="restart" id="restart">Replay ✨</button>
</main>
<script>
const candles=[...document.querySelectorAll('.candle')],hint=document.getElementById('hint'),message=document.getElementById('message'),scene=document.getElementById('scene'),cakeWrap=document.getElementById('cakeWrap'),page2=document.getElementById('page2'),celestial=document.getElementById('celestial'),restart=document.getElementById('restart');let finished=false;
const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';birthdaySong.volume=1;
function playBirthdaySong(){try{birthdaySong.currentTime=0;const p=birthdaySong.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function starBurst(){const count=innerWidth<600?115:190;for(let i=0;i<count;i++){const s=document.createElement('span');s.className='sparkle boom';const a=Math.random()*Math.PI*2;const d=Math.min(innerWidth,innerHeight)*(.25+Math.random()*.9);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',`${Math.cos(a)*d}px`);s.style.setProperty('--y',`${Math.sin(a)*d}px`);s.style.animationDelay=`${Math.random()*.18}s`;const size=3+Math.random()*8;s.style.width=size+'px';s.style.height=size+'px';page2.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function fireworks(){for(let n=0;n<5;n++){setTimeout(()=>{const f=document.createElement('div');f.className='firework show';f.style.left=(18+Math.random()*64)+'%';f.style.top=(15+Math.random()*48)+'%';f.style.color=['#ffd85a','#ff7c9c','#8ce7ff','#fff','#c59bff'][n];for(let i=0;i<22;i++){const p=document.createElement('i');const a=i*Math.PI*2/22;const r=45+Math.random()*75;p.style.left=Math.cos(a)*r+'px';p.style.top=Math.sin(a)*r+'px';f.appendChild(p)}page2.appendChild(f);setTimeout(()=>f.remove(),1900)},n*360)}}
function birds(){['🕊️','🕊️'].forEach((v,i)=>{const b=document.createElement('div');b.className='bird b'+(i+1);b.textContent=v;b.style.animationDelay=(i*.3)+'s';page2.appendChild(b);setTimeout(()=>b.remove(),3300)})}
function starsAndSky(){for(let i=0;i<34;i++){const s=document.createElement('span');s.className='tiny-star';s.style.left=(5+Math.random()*90)+'%';s.style.top=(8+Math.random()*75)+'%';s.style.animationDelay=(Math.random()*.8)+'s';celestial.appendChild(s)}}
function celebrate(){if(finished)return;finished=true;playBirthdaySong();candles.forEach(c=>{c.querySelector('.flame').style.display='none';c.disabled=true});cakeWrap.classList.remove('lit');hint.classList.add('hidden');setTimeout(()=>{page2.classList.add('show');starBurst()},300);setTimeout(()=>fireworks(),2400);setTimeout(()=>birds(),4300);setTimeout(()=>{starsAndSky();celestial.classList.add('show')},6900);setTimeout(()=>message.classList.add('show'),9500);setTimeout(()=>restart.classList.add('show'),13000)}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.addEventListener('click',()=>location.reload());
</script>
</body>
</html>
