<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Zwe Htet Myat</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030512}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}</style></head><body><canvas id="c"></canvas><audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio><script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false}),song=document.getElementById('song');let W,H,D,started=0,t0=0,last=0,raf;const TAU=Math.PI*2,photo=new Image();photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';const stars=[],meteors=[],rockets=[],sparks=[],birds=[];const cols=['#ff4f9f','#ffd34e','#59e8ff','#9b7cff','#72f58d','#ff725f','#fff'];
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);stars.length=0;for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.72,r:.4+Math.random()*1.4,p:Math.random()*TAU})}addEventListener('resize',size);size();
let AC;function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}function tone(f,d=.12,g=.025){if(!AC)return;let o=AC.createOscillator(),v=AC.createGain();o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function bg(){let g=X.createRadialGradient(W*.5,H*.42,0,W*.5,H*.5,Math.max(W,H)*.85);g.addColorStop(0,'#243b8e');g.addColorStop(.45,'#10194f');g.addColorStop(1,'#02030c');X.fillStyle=g;X.fillRect(0,0,W,H)}
function starfield(t){for(const s of stars){let a=.35+.45*Math.sin(t*.002+s.p);X.fillStyle='rgba(255,249,220,'+a+')';X.fillRect(s.x,s.y,s.r,s.r)}}
function glow(x,y,r,c,a){let g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace(')',','+a+')').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2)}
function intro(t){X.fillStyle='#fff2f4';X.fillRect(0,0,W,H);let s=Math.min(W*.65,H*.42,460),cx=W/2,py=H*.31;glow(cx,py,s*.8,'rgb(255,160,205)',.35);if(photo.complete){X.save();X.beginPath();X.arc(cx,py,s*.45,0,TAU);X.clip();X.globalAlpha=.86;X.drawImage(photo,cx-s*.45,py-s*.45,s*.9,s*.9);X.restore();X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=6;X.beginPath();X.arc(cx,py,s*.45,0,TAU);X.stroke()}let w=s*.72,y=H*.57;X.fillStyle='#eaa1b8';X.shadowColor='rgba(180,50,100,.3)';X.shadowBlur=20;X.beginPath();X.roundRect(cx-w/2,y,w,s*.22,18);X.fill();X.fillStyle='#fff7f1';X.beginPath();X.roundRect(cx-w*.42,y-s*.11,w*.84,s*.16,16);X.fill();for(let i=0;i<7;i++){let x=cx-w*.37+i*w*.123;X.fillStyle='#ffd06b';X.fillRect(x-5,y-s*.18,10,s*.13);X.fillStyle='#ff9b35';X.beginPath();X.ellipse(x,y-s*.22,7,13,.2,0,TAU);X.fill()}X.shadowBlur=0;X.textAlign='center';X.fillStyle='#7a3150';X.font='600 '+Math.max(17,W*.025)+'px system-ui';X.fillText('🕯️  ဖယောင်းတိုင်တစ်တိုင်ကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ  ✨',cx,H*.91)}
function burst(){for(let i=0;i<120;i++){let a=Math.random()*TAU,v=2+Math.random()*6;sparks.push({x:W/2,y:H*.48,px:W/2,py:H*.48,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:cols[i%cols.length],g:.025})}tone(880,.3,.04)}
function meteor(){let a=.58+Math.random()*.2,m={x:Math.random()*W*.8-W*.1,y:Math.random()*H*.45,vx:Math.cos(a)*(11+Math.random()*5),vy:Math.sin(a)*(11+Math.random()*5),life:1,len:12+Math.random()*7};meteors.push(m);tone(260,.08,.008)}
function firework(){let r={x:W*(.15+Math.random()*.7),y:H+10,ty:H*(.18+Math.random()*.32),vy:-9-Math.random()*2,c:cols[Math.floor(Math.random()*cols.length)],trail:[]};rockets.push(r)}
function explode(r){let n=65+Math.floor(Math.random()*25);for(let i=0;i<n;i++){let a=TAU*i/n,v=2.5+Math.random()*4.5;sparks.push({x:r.x,y:r.ty,px:r.x,py:r.ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:r.c,g:.045})}tone(90,.25,.045)}
function bird(){birds.push({x:-50,y:H*(.28+Math.random()*.3),s:.55+Math.random()*.35,v:2.5+Math.random()*1.2,p:Math.random()*TAU})}
function update(dt){for(let i=meteors.length-1;i>=0;i--){let m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life-=dt*.0015;if(m.life<=0||m.x>W+150||m.y>H+150)meteors.splice(i,1)}for(let i=rockets.length-1;i>=0;i--){let r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>7)r.trail.shift();r.y+=r.vy;r.vy+=.12;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+p.g;p.life-=.018;if(p.life<=0)sparks.splice(i,1)}for(let i=birds.length-1;i>=0;i--){let b=birds[i];b.x+=b.v;b.y+=Math.sin(b.x*.01+b.p)*.18;if(b.x>W+80)birds.splice(i,1)}}
function effects(t){X.save();X.globalCompositeOperation='lighter';for(const m of meteors){let g=X.createLinearGradient(m.x-m.vx*m.len,m.y-m.vy*m.len,m.x,m.y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.7,'rgba(170,225,255,.25)');g.addColorStop(1,'#fff');X.strokeStyle=g;X.lineWidth=3;X.beginPath();X.moveTo(m.x-m.vx*m.len,m.y-m.vy*m.len);X.lineTo(m.x,m.y);X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(m.x,m.y,3,0,TAU);X.fill()}for(const r of rockets){X.strokeStyle='rgba(255,255,255,.35)';X.beginPath();r.trail.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(r.x,r.y,3,0,TAU);X.fill()}for(const p of sparks){X.strokeStyle=p.c;X.globalAlpha=p.life;X.lineWidth=1.5;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke()}X.globalAlpha=1;X.restore();for(const b of birds){let f=Math.sin(t*.012+b.p),x=b.x,y=b.y,s=b.s;X.save();X.translate(x,y);X.scale(s,s);X.fillStyle='#fff';X.shadowColor='#8ee9ff';X.shadowBlur=8;X.beginPath();X.moveTo(0,5);X.quadraticCurveTo(-24,-13-f*15,-42,-3-f*8);X.quadraticCurveTo(-25,10,0,8);X.quadraticCurveTo(25,10,42,-3+f*8);X.quadraticCurveTo(24,-13+f*15,0,5);X.fill();X.restore()}}
function words(a,b){X.textAlign='center';X.shadowColor='#000';X.shadowBlur=18;X.fillStyle='rgba(255,255,250,.95)';X.font='600 '+Math.max(21,Math.min(43,W*.043))+'px "Noto Sans Myanmar",sans-serif';X.fillText(a,W/2,H*.51);if(b){X.font='400 '+Math.max(15,Math.min(23,W*.021))+'px "Noto Sans Myanmar",sans-serif';X.fillStyle='#ffe9b0';X.fillText(b,W/2,H*.60)}}
function finale(t){let a=Math.min(1,Math.max(0,(t-45)/2));X.textAlign='center';X.shadowColor='#ffd45e';X.shadowBlur=30;X.fillStyle='#fff5d0';X.font='700 '+Math.min(86,W*.09)+'px Georgia';X.fillText('Happy Birthday',W/2,H*.39);X.fillStyle='#ffd978';X.font='700 '+Math.min(58,W*.06)+'px Georgia';X.fillText('Zwe Htet Myat ❤️',W/2,H*.50);X.shadowBlur=12;X.fillStyle='rgba(255,250,240,'+a+')';X.font='400 '+Math.max(16,Math.min(24,W*.022))+'px "Noto Sans Myanmar"';X.fillText('မင်းရဲ့နေ့ရက်တိုင်း ပျော်ရွှင်မှုတွေနဲ့ တောက်ပနေပါစေ ✨',W/2,H*.62)}
function loop(now){let dt=Math.min(32,now-last||16);last=now;let t=(now-t0)/1000;bg();if(!started){intro(t);raf=requestAnimationFrame(loop);return}starfield(now);let p=t<5?'burst':t<16?'meteor':t<27?'firework':t<37?'birds':t<45?'moon':'final';if(p==='burst'&&Math.floor(t*2)!==Math.floor((t-dt/1000)*2))burst();if(p==='meteor'&&Math.random()<.045)meteor();if(p==='firework'&&Math.random()<.025)firework();if(p==='birds'&&Math.random()<.012)bird();if(p==='moon'){X.fillStyle='#fff6cf';X.beginPath();X.arc(W*.84,H*.17,Math.min(W,H)*.07,0,TAU);X.fill();X.fillStyle='#0d143d';X.beginPath();X.arc(W*.87,H*.15,Math.min(W,H)*.065,0,TAU);X.fill()}update(dt);effects(now);if(t<5)words('✨ အိပ်မက်လေးတွေ တောက်ပလာဖို့ ✨');else if(t<16)words('🌠 ကြယ်တွေက မင်းအတွက် ဆုတောင်းပေးနေတယ်','ဝှီးခနဲ ဖြတ်သန်းသွားတဲ့ ကြယ်ရောင်လေးတွေ…');else if(t<27)words('🎆 ဒီညဟာ မင်းအတွက်ပဲ','ကောင်းကင်တစ်ခုလုံး အရောင်တွေနဲ့ လင်းလက်နေတယ်');else if(t<37)words('🐦 ပျော်ရွှင်ခြင်းတွေက မင်းဆီ ပျံလာပြီ','အမှတ်တရကောင်းလေးတွေ အမြဲရှိနေပါစေ');else if(t<45)words('🌙 လမင်းလို တောက်ပနေပါစေ','မင်းရဲ့အိပ်မက်တိုင်း အကောင်အထည်ဖော်နိုင်ပါစေ');else finale(t);if(t>58){started=0;clear();}raf=requestAnimationFrame(loop)}
function clear(){meteors.length=rockets.length=sparks.length=birds.length=0}C.addEventListener('click',()=>{if(started)return;audio();started=1;t0=performance.now();last=t0;clear();song.play().catch(()=>{});hintRemove()});function hintRemove(){document.body.classList.add('go')}requestAnimationFrame(loop);
</script></body></html>
