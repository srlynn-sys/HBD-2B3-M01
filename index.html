const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false,desynchronized:true}),song=document.getElementById('song');let W=0,H=0,D=1,started=false,t0=0,last=0,flash=0,shake=0,beat=0;const TAU=Math.PI*2,photo=new Image();photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';photo.decoding='async';const stars=[],sparks=[],rockets=[],meteors=[],birds=[],rings=[],toys=[];const cols=['#ff2f92','#ffd43b','#35e7ff','#9b6cff','#61f27c','#ff5c65','#ffffff','#ff8b35'];let AC=null;
function resize(){D=Math.min(devicePixelRatio||1,1.35);W=innerWidth;H=innerHeight;C.width=Math.floor(W*D);C.height=Math.floor(H*D);X.setTransform(D,0,0,D,0,0);X.imageSmoothingEnabled=true;X.imageSmoothingQuality='high';stars.length=0;const n=W*H<450000?70:125;for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.78,r:.35+Math.random()*1.4,p:Math.random()*TAU})}addEventListener('resize',resize,{passive:true});resize();
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function tone(f,d=.1,g=.018,type='sine'){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}

function intro(t){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fffafd');g.addColorStop(.5,'#fff0f7');g.addColorStop(1,'#ffe3ee');X.fillStyle=g;X.fillRect(0,0,W,H);const cx=W/2,py=H*.29,s=Math.min(W*.72,H*.43,520);for(let i=0;i<18;i++){const a=i*1.9,rr=s*(.52+(i%3)*.12),x=cx+Math.cos(a+t*.12)*rr,y=py+Math.sin(a+t*.12)*rr*.58;X.globalAlpha=.35+.25*Math.sin(t*2+i);X.fillStyle=cols[i%cols.length];X.beginPath();X.arc(x,y,2.2+(i%3),0,TAU);X.fill()}X.globalAlpha=1;const pw=Math.min(W*.42,390),ph=Math.min(H*.34,360),px=cx-pw/2,top=H*.105;X.save();X.shadowColor='rgba(174,72,125,.28)';X.shadowBlur=34;X.fillStyle='rgba(255,255,255,.9)';X.beginPath();X.roundRect(px-9,top-9,pw+18,ph+18,30);X.fill();X.restore();if(photo.complete&&photo.naturalWidth){X.save();X.beginPath();X.roundRect(px,top,pw,ph,24);X.clip();X.globalAlpha=1;X.drawImage(photo,px,top,pw,ph);const shade=X.createLinearGradient(0,top,0,top+ph);shade.addColorStop(0,'rgba(255,255,255,.03)');shade.addColorStop(1,'rgba(90,20,60,.12)');X.fillStyle=shade;X.fillRect(px,top,pw,ph);X.restore();X.strokeStyle='rgba(255,255,255,.98)';X.lineWidth=4;X.beginPath();X.roundRect(px,top,pw,ph,24);X.stroke()}const badgeY=top+ph+24;X.shadowColor='rgba(176,61,116,.25)';X.shadowBlur=18;X.fillStyle='#fff';X.beginPath();X.roundRect(cx-Math.min(W*.25,150),badgeY,Math.min(W*.5,300),42,21);X.fill();X.shadowBlur=0;X.textAlign='center';X.fillStyle='#9b3d69';X.font='700 '+Math.max(16,Math.min(25,W*.026))+'px system-ui';X.fillText('🎂  ZWE HTET MYAT  🎂',cx,badgeY+28);const w=Math.min(W*.58,430),y=H*.67;X.shadowColor='rgba(154,54,94,.22)';X.shadowBlur=22;X.fillStyle='#e99ab8';X.beginPath();X.roundRect(cx-w/2,y,w,Math.min(90,s*.19),20);X.fill();X.shadowBlur=0;X.fillStyle='#fff8f2';X.beginPath();X.roundRect(cx-w*.43,y-13,w*.86,34,16);X.fill();for(let i=0;i<7;i++){const x=cx-w*.36+i*w*.12;X.fillStyle='#ffd36a';X.fillRect(x-4,y-26,8,13);drawFlame(x,y-38,7,t+i*.25)}X.textAlign='center';X.fillStyle='#71304b';X.font='700 '+Math.max(16,Math.min(25,W*.026))+'px "Noto Sans Myanmar",sans-serif';X.fillText('ဖယောင်းတိုင်ကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ',cx,H*.9);X.globalAlpha=.72;X.font='18px system-ui';X.fillText('✨  A magical birthday night  ✨',cx,H*.95);X.globalAlpha=1}
function addSpark(x,y,vx,vy,c,life=1,g=.035,size=1){if(sparks.length>760)return;sparks.push({x,y,px:x,py:y,vx,vy,c,life,g,size})}
function burst(cx=W/2,cy=H*.45,count=95){for(let i=0;i<count;i++){const a=Math.random()*TAU,v=3+Math.random()*7;addSpark(cx,cy,Math.cos(a)*v,Math.sin(a)*v,cols[i%cols.length],1,.04,1.5)}flash=.18;shake=5;beat=1;tone(620,.14,.03);setTimeout(()=>tone(880,.18,.018),55)}
function firework(){if(rockets.length>5)return;const x=W*(.06+Math.random()*.88),ty=H*(.09+Math.random()*.43),c=cols[(Math.random()*cols.length)|0];rockets.push({x,y:H+18,ty,vy:-8.2-Math.random()*2.2,c,trail:[]});tone(170,.11,.01,'sawtooth')}
function addToy(x,y,type,c){if(toys.length>18)return;toys.push({x,y,type,c,a:1,s:.7+Math.random()*.35,rot:(Math.random()-.5)*.18,vy:-.35-Math.random()*.5})}
function explode(r){const n=105+((Math.random()*55)|0);for(let i=0;i<n;i++){const a=TAU*i/n+Math.random()*.16,v=2.8+Math.random()*5.7;addSpark(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,r.c,1.25,.042,1.8)}for(let i=0;i<35;i++){const a=Math.random()*TAU,v=1.4+Math.random()*3.8;addSpark(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,'#fff',.9,.02,2.2)}rings.push({x:r.x,y:r.ty,r:8,a:1,c:r.c});if(Math.random()<.72){const types=['bear','star','heart','cat','balloon'];addToy(r.x,r.ty,types[(Math.random()*types.length)|0],cols[(Math.random()*cols.length)|0])}flash=Math.min(1,flash+.48);shake=Math.min(16,shake+10);beat=1;boom();setTimeout(()=>tone(70,.3,.025,'sine'),90)}
function meteor(){if(meteors.length>3)return;const a=.62+Math.random()*.16;meteors.push({x:Math.random()*W*.8-W*.1,y:Math.random()*H*.35,vx:Math.cos(a)*(11+Math.random()*5),vy:Math.sin(a)*(11+Math.random()*5),life:1,len:8+Math.random()*6})}

function update(dt){const k=dt/16.67;flash*=Math.pow(.78,k);shake*=Math.pow(.78,k);beat*=Math.pow(.88,k);for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>12)r.trail.shift();r.x+=Math.sin(r.y*.012)*.18*k;r.y+=r.vy*k;r.vy+=.095*k;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.px=p.x;p.py=p.y;p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.985,k);p.vy=p.vy*Math.pow(.985,k)+p.g*k;p.life-=.018*k;if(p.life<=0)sparks.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=13*k;q.a-=.028*k;if(q.a<=0)rings.splice(i,1)}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*k;m.y+=m.vy*k;m.life-=.018*k;if(m.life<=0||m.x>W+120||m.y>H+120)meteors.splice(i,1)}for(let i=birds.length-1;i>=0;i--){const b=birds[i];b.x+=b.v*k;b.y+=Math.sin(b.x*.012+b.p)*.2*k;if(b.x>W+100)birds.splice(i,1)}for(let i=toys.length-1;i>=0;i--){const q=toys[i];q.y+=q.vy*k;q.vy+=.012*k;q.a-=.009*k;q.s*=Math.pow(.998,k);if(q.a<=0)toys.splice(i,1)}}
function drawToy(q){const s=42*q.s;X.save();X.translate(q.x,q.y);X.rotate(q.rot);X.globalAlpha=Math.max(0,q.a);X.shadowColor=q.c;X.shadowBlur=14;X.strokeStyle='#fff';X.lineWidth=2.5;X.fillStyle=q.c;if(q.type==='star'){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s:s*.43;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?X.lineTo(x,y):X.moveTo(x,y)}X.closePath();X.fill();X.stroke()}else if(q.type==='heart'){X.beginPath();X.moveTo(0,s*.75);X.bezierCurveTo(-s*1.25,0,-s*.85,-s*.8,0,-s*.3);X.bezierCurveTo(s*.85,-s*.8,s*1.25,0,0,s*.75);X.fill();X.stroke()}else if(q.type==='bear'){X.beginPath();X.arc(-s*.55,-s*.7,s*.38,0,TAU);X.arc(s*.55,-s*.7,s*.38,0,TAU);X.fill();X.beginPath();X.arc(0,0,s*.9,0,TAU);X.fill();X.fillStyle='#fff2dc';X.beginPath();X.arc(0,s*.18,s*.34,0,TAU);X.fill();X.fillStyle='#422';X.beginPath();X.arc(-s*.3,-s*.1,s*.08,0,TAU);X.arc(s*.3,-s*.1,s*.08,0,TAU);X.fill();X.beginPath();X.arc(0,s*.16,s*.08,0,TAU);X.fill()}else if(q.type==='cat'){X.beginPath();X.moveTo(-s*.82,-s*.15);X.lineTo(-s*.72,-s*.92);X.lineTo(-s*.22,-s*.55);X.lineTo(s*.22,-s*.55);X.lineTo(s*.72,-s*.92);X.lineTo(s*.82,-s*.15);X.quadraticCurveTo(s*.85,s*.75,0,s*.82);X.quadraticCurveTo(-s*.85,s*.75,-s*.82,-s*.15);X.fill();X.fillStyle='#422';X.beginPath();X.arc(-s*.3,-s*.05,s*.07,0,TAU);X.arc(s*.3,-s*.05,s*.07,0,TAU);X.fill();X.fillStyle='#ff8fb3';X.beginPath();X.arc(0,s*.15,s*.09,0,TAU);X.fill()}else{X.beginPath();X.arc(0,0,s*.75,0,TAU);X.fill();X.stroke();X.strokeStyle='#fff';X.beginPath();X.moveTo(-s*.25,-s*.05);X.lineTo(-s*.1,-s*.05);X.moveTo(s*.1,-s*.05);X.lineTo(s*.25,-s*.05);X.stroke();X.beginPath();X.arc(0,s*.08,s*.25,0,Math.PI);X.stroke();X.beginPath();X.moveTo(0,-s*.75);X.lineTo(0,-s*1.25);X.stroke()}X.restore();X.globalAlpha=1}
function drawEffects(t){X.save();X.globalCompositeOperation='lighter';for(const m of meteors){X.strokeStyle='rgba(180,230,255,.8)';X.lineWidth=2;X.beginPath();X.moveTo(m.x-m.vx*m.len,m.y-m.vy*m.len);X.lineTo(m.x,m.y);X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(m.x,m.y,3,0,TAU);X.fill()}for(const r of rockets){X.strokeStyle=r.c;X.globalAlpha=.45;X.lineWidth=3;X.beginPath();r.trail.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.globalAlpha=1;X.fillStyle='#fff';X.beginPath();X.arc(r.x,r.y,3.5,0,TAU);X.fill()}for(const q of rings){X.globalAlpha=q.a*.55;X.strokeStyle=q.c;X.lineWidth=2.5;X.beginPath();X.arc(q.x,q.y,q.r,0,TAU);X.stroke()}for(const p of sparks){X.globalAlpha=Math.max(0,p.life);X.strokeStyle=p.c;X.lineWidth=p.size;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size*.8,0,TAU);X.fill()}X.restore();for(const q of toys)drawToy(q);X.globalAlpha=1;for(const b of birds){const f=Math.sin(t*.018+b.p),x=b.x,y=b.y,s=b.s;X.save();X.translate(x,y);X.scale(s,s);X.fillStyle='#fff';X.shadowColor='#74e9ff';X.shadowBlur=7;X.beginPath();X.moveTo(0,5);X.quadraticCurveTo(-24,-13-f*14,-43,-3-f*7);X.quadraticCurveTo(-25,10,0,8);X.quadraticCurveTo(25,10,43,-3+f*7);X.quadraticCurveTo(24,-13+f*14,0,5);X.fill();X.restore()}}

function loop(now){const dt=Math.min(32,last?now-last:16.67);last=now;const t=started?(now-t0)/1000:0;if(!started){intro(now/1000);requestAnimationFrame(loop);return}update(dt);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;X.save();X.translate(sx,sy);bg(now);const phase=t<5?0:t<11?1:t<71?2:t<77?3:4;if(phase===0&&Math.floor(t*1.4)!==Math.floor((t-dt/1000)*1.4))burst(W/2,H*.43,70);if(phase===1&&Math.random()<.045)meteor();if(phase===2&&Math.random()<.045)firework();if(phase===3&&Math.random()<.018)bird();if(phase>=3)moon();drawEffects(now);if(phase===0)text('✨ အိပ်မက်လေးတွေ တောက်ပလာဖို့ ✨');else if(phase===1)text('🌠 ကြယ်တွေက မင်းအတွက် ဆုတောင်းပေးနေတယ်','ကောင်းကင်က တဖြည်းဖြည်း လင်းလာပြီ…');else if(phase===2)text('🎆 ဒီညဟာ မင်းအတွက်ပဲ','ဝုန်းခနဲ ပွင့်လာတဲ့ အရောင်စုံမီးရူးမီးပန်းတွေ');else if(phase===3)text('ပျော်ရွှင်ခြင်းတွေက မင်းဆီ ပျံလာပြီ','အမှတ်တရကောင်းလေးတွေ အမြဲရှိနေပါစေ');else finale(t);X.restore();if(flash>.005){X.fillStyle='rgba(255,255,255,'+Math.min(.55,flash*.7)+')';X.fillRect(0,0,W,H)}if(t>79){started=false;sparks.length=rockets.length=meteors.length=birds.length=rings.length=toys.length=0}requestAnimationFrame(loop)}
