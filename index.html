<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Zwe Htet Myat — A Birthday Memory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030d}body{font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;cursor:pointer}#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17215e 0,#070a25 42%,#02030d 100%);z-index:10;transition:opacity 1.2s,visibility 1.2s}#start.hide{opacity:0;visibility:hidden;pointer-events:none}.startCard{text-align:center;padding:46px 70px;border:1px solid rgba(255,255,255,.18);border-radius:30px;background:rgba(8,10,34,.72);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12);animation:float 4s ease-in-out infinite}.eyebrow{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#ffd9a6;opacity:.85}.startCard h1{font:800 clamp(42px,6vw,82px)/1.05 Georgia,serif;margin:18px 0 12px;background:linear-gradient(90deg,#fff,#ffd5e7,#ffe7a8,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.startCard p{margin:0 0 28px;color:#d7d9ed;font-size:17px}.startBtn{position:relative;z-index:20;display:inline-block;border:0;border-radius:999px;padding:16px 36px;font-weight:800;font-size:16px;color:#251225;background:linear-gradient(135deg,#fff,#ffd0e5 48%,#ffe7a7);box-shadow:0 12px 40px rgba(255,160,210,.28);cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;transition:transform .2s,box-shadow .2s}.startBtn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 55px rgba(255,160,210,.4)}.startBtn:active{transform:scale(.97)}#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3;padding:9px 18px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(4,5,20,.48);backdrop-filter:blur(10px);color:#e7e8f4;font-size:12px;letter-spacing:.3px;opacity:0;transition:opacity .7s;pointer-events:none}@keyframes float{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="startCard"><div class="eyebrow">A little memory, made just for you</div><h1>Zwe Htet Myat</h1><p>ဒီနေ့အတွက် မမေ့နိုင်တဲ့ မွေးနေ့အမှတ်တရလေး စလိုက်ရအောင်။</p><button type="button" class="startBtn" id="begin">Enter the Memory ✦</button></div></div>
<div id="hint">Click anywhere to send another firework ✦</div>
<audio id="song" preload="auto" crossorigin="anonymous" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false}),start=document.getElementById('start'),begin=document.getElementById('begin'),hint=document.getElementById('hint'),song=document.getElementById('song');
const TAU=Math.PI*2;let W,H,dpr,started=false,t0=0,last=0,elapsed=0,shake=0,flash=0,beat=0,AC=null,analyser=null,source=null;
const photo=new Image();photo.decoding='async';photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';
const stars=[],dust=[],rockets=[],particles=[],rings=[],confetti=[];const COLORS=['#ff4fa3','#ffd84d','#43e8ff','#a36cff','#68ef85','#ff6b6b','#ff9b42','#ffffff'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0);stars.length=0;dust.length=0;for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.78,r:.35+Math.random()*1.4,a:Math.random()*TAU});for(let i=0;i<80;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.8,v:.03+Math.random()*.12,a:Math.random()*TAU})}addEventListener('resize',resize);resize();
function audioInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!source){source=AC.createMediaElementSource(song);analyser=AC.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.78;source.connect(analyser);analyser.connect(AC.destination)}}catch(e){}}
function tone(f,d=.12,g=.025,type='sine'){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,n);v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v).connect(AC.destination);o.start(n);o.stop(n+d+.02)}
function boom(power=1){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(96,n);o.frequency.exponentialRampToValueAtTime(28,n+.52);f.type='lowpass';f.frequency.value=500;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.14*power,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.65);o.connect(f).connect(g).connect(AC.destination);o.start(n);o.stop(n+.68)}
function addParticle(x,y,vx,vy,c,life=1,size=2){if(particles.length>950)return;particles.push({x,y,px:x,py:y,vx,vy,c,life,size,drag:.984+Math.random()*.012})}
function launch(x=W*(.12+Math.random()*.76),targetY=H*(.10+Math.random()*.42),color=COLORS[(Math.random()*COLORS.length)|0]){if(rockets.length>8)return;rockets.push({x,y:H+30,targetY,vy:-10.5-Math.random()*2.2,c:color,trail:[]});tone(125,.14,.012,'sawtooth')}
function burst(x,y,color,kind='peony',power=1){let n=kind==='willow'?120:kind==='ring'?100:145;for(let i=0;i<n;i++){const a=TAU*i/n+Math.random()*.08;let v=kind==='willow'?1.3+Math.random()*4.5:2.4+Math.random()*5.5;if(kind==='ring')v=4.2+Math.random()*.8;addParticle(x,y,Math.cos(a)*v,Math.sin(a)*v,color,kind==='willow'?1.8:1.35,1.1+Math.random()*2.3)}for(let i=0;i<30;i++){const a=Math.random()*TAU,v=1+Math.random()*3;addParticle(x,y,Math.cos(a)*v,Math.sin(a)*v,'#fff',.75,1.3)}rings.push({x,y,r:4,life:1,c:color});boom(power);flash=Math.min(1,flash+.22*power);shake=Math.min(18,shake+6*power)}
function explode(r){burst(r.x,r.targetY,r.c,['peony','ring','willow'][(Math.random()*3)|0],1);if(Math.random()<.45)setTimeout(()=>{if(started)burst(r.x+(Math.random()-.5)*120,r.targetY+(Math.random()-.5)*70,COLORS[(Math.random()*COLORS.length)|0],'peony',.72)},110)}
function confettiBurst(x=W/2,y=H*.5,n=150){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=2+Math.random()*7;confetti.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,c:COLORS[i%COLORS.length],life:1,r:2+Math.random()*4,spin:Math.random()*TAU})}}
function drawSky(t){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03051a');g.addColorStop(.45,'#09114a');g.addColorStop(1,'#01020a');X.fillStyle=g;X.fillRect(0,0,W,H);const glow=X.createRadialGradient(W*.5,H*.46,0,W*.5,H*.46,Math.max(W,H)*.6);glow.addColorStop(0,'rgba(80,85,255,.10)');glow.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=glow;X.fillRect(0,0,W,H);for(const s of stars){X.globalAlpha=.18+.55*(.5+.5*Math.sin(t*1.7+s.a));X.fillStyle='#fff9df';X.beginPath();X.arc(s.x,s.y,s.r,0,TAU);X.fill()}for(const p of dust){p.y-=p.v;if(p.y<0)p.y=H*.8;X.globalAlpha=.12+.12*Math.sin(t*1.3+p.a);X.fillStyle='#ffdbea';X.fillRect(p.x,p.y,p.r,p.r)}X.globalAlpha=1}
function drawGround(){const g=X.createLinearGradient(0,H*.72,0,H);g.addColorStop(0,'rgba(2,4,15,0)');g.addColorStop(1,'#010207');X.fillStyle=g;X.fillRect(0,H*.68,W,H*.32)}
function drawPhoto(alpha=1,scale=1){if(!photo.complete||!photo.naturalWidth)return;const pw=Math.min(W*.30,430)*scale,ph=pw*.86,px=W/2-pw/2,py=H*.17-(scale-1)*ph*.35;X.save();X.globalAlpha=alpha;X.shadowColor='rgba(255,180,225,.5)';X.shadowBlur=38;X.fillStyle='#fff';X.beginPath();X.roundRect(px-10,py-10,pw+20,ph+20,28);X.fill();X.shadowBlur=0;X.beginPath();X.roundRect(px,py,pw,ph,22);X.clip();X.drawImage(photo,px,py,pw,ph);X.restore();X.save();X.globalAlpha=alpha;X.strokeStyle='rgba(255,215,235,.9)';X.lineWidth=3;X.beginPath();X.roundRect(px,py,pw,ph,22);X.stroke();X.restore()}
function text(alpha=1){X.save();X.textAlign='center';X.globalAlpha=alpha;X.shadowColor='rgba(0,0,0,.65)';X.shadowBlur=18;X.fillStyle='#fff';X.font='800 '+Math.min(58,W*.052)+'px Georgia,serif';X.fillText('Happy Birthday',W/2,H*.69);X.fillStyle='#ffd6e8';X.font='800 '+Math.min(48,W*.041)+'px Georgia,serif';X.fillText('Zwe Htet Myat',W/2,H*.76);X.shadowBlur=0;X.fillStyle='rgba(255,238,205,.9)';X.font='600 '+Math.min(19,W*.015)+'px "Noto Sans Myanmar"';X.fillText('ဒီအချိန်လေးကို အမှတ်တရအဖြစ် သိမ်းထားပါ ✦',W/2,H*.83);X.restore()}
function candle(x,y,s){X.save();X.translate(x,y);X.shadowColor='#ffb62e';X.shadowBlur=15;X.fillStyle='#ff9b39';X.beginPath();X.moveTo(0,-s*2);X.bezierCurveTo(s*.75,-s*.7,s*.55,s*.55,0,s);X.bezierCurveTo(-s*.55,s*.55,-s*.75,-s*.7,0,-s*2);X.fill();X.restore()}
function cake(alpha=1){const w=Math.min(W*.34,480),x=W/2,y=H*.87;X.save();X.globalAlpha=alpha;X.shadowColor='rgba(255,120,180,.3)';X.shadowBlur=30;X.fillStyle='#d879a4';X.beginPath();X.roundRect(x-w/2,y,w,58,16);X.fill();X.shadowBlur=0;X.fillStyle='#fff4f7';X.beginPath();X.roundRect(x-w*.43,y-13,w*.86,25,12);X.fill();for(let i=0;i<7;i++){const cx=x-w*.36+i*w*.12;X.fillStyle='#ffd15c';X.fillRect(cx-3,y-31,6,18);candle(cx,y-39,7)}X.restore()}
function fireworks(){for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>15)r.trail.shift();r.y+=r.vy;r.vy+=.12;if(r.y<=r.targetY){explode(r);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*.994+.055;p.life-=.018;if(p.life<=0)particles.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=8;q.life-=.025;if(q.life<=0)rings.splice(i,1)}for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.vx*=.995;p.spin+=.18;p.life-=.012;if(p.life<=0)confetti.splice(i,1)}X.save();X.globalCompositeOperation='lighter';for(const r of rockets){X.strokeStyle=r.c;X.lineWidth=3;X.globalAlpha=.55;X.beginPath();r.trail.forEach((p,j)=>j?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke()}for(const p of particles){X.globalAlpha=Math.max(0,p.life);X.strokeStyle=p.c;X.lineWidth=p.size;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size*.8,0,TAU);X.fill()}for(const q of rings){X.globalAlpha=q.life*.6;X.strokeStyle=q.c;X.lineWidth=3;X.beginPath();X.arc(q.x,q.y,q.r,0,TAU);X.stroke()}X.restore();for(const p of confetti){X.save();X.globalAlpha=p.life;X.translate(p.x,p.y);X.rotate(p.spin);X.fillStyle=p.c;X.fillRect(-p.r/2,-p.r,p.r,p.r*2.3);X.restore()}X.globalAlpha=1}
function beatMeter(){if(analyser){const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);let sum=0;for(let i=0;i<a.length;i++)sum+=a[i];beat=Math.min(1,sum/a.length/70)}else beat=.5+.5*Math.sin((song.currentTime||0)*5.7)}
function birds(t){if(elapsed<9)return;for(let i=0;i<3;i++){const x=((W*(.12+i*.34)+t*24*(i+1))%(W+180))-90,y=H*(.18+i*.055)+Math.sin(t*.8+i)*18;X.save();X.globalAlpha=Math.max(0,Math.min(1,(elapsed-9)/2))*(.6-.12*i);X.strokeStyle='#d9e5ff';X.lineWidth=2;X.beginPath();X.moveTo(x,y);X.quadraticCurveTo(x+9,y-8,x+18,y);X.quadraticCurveTo(x+27,y-8,x+36,y);X.stroke();X.restore()}}
function render(now){if(!started){requestAnimationFrame(render);return}last=now;elapsed=(now-t0)/1000;beatMeter();const t=now/1000;shake*=.86;flash*=.82;X.save();if(shake>.2)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawSky(t);drawGround();let a;if(elapsed<3){a=Math.min(1,elapsed/1.2);drawPhoto(a,.94+.03*Math.sin(elapsed*2));text(a);cake(a)}else if(elapsed<6){a=Math.min(1,(elapsed-3)/1.2);drawPhoto(1-a*.15,1+.025*Math.sin(elapsed*2));text(1-a*.1);cake(1)}else if(elapsed<11){a=Math.min(1,(elapsed-6)/1.4);drawPhoto(1-a,1.02+a*.03);text(1-a*.55);cake(1-a*.7);if(Math.random()<.075)launch()}else if(elapsed<18){drawPhoto(.08,1.05);text(.12);if(Math.random()<.14)launch()}else{drawPhoto(.72,1.03+.01*Math.sin(t));text(.95);cake(.72);if(Math.random()<.07)launch()}fireworks();birds(t);const pulse=beat*.13;if(pulse>.01){X.globalAlpha=pulse;X.fillStyle='#fff';X.fillRect(0,0,W,H)}X.globalAlpha=1;if(flash>.01){X.fillStyle='rgba(255,255,255,'+Math.min(.55,flash)+')';X.fillRect(0,0,W,H)}X.restore();requestAnimationFrame(render)}
function startShow(e){if(e){e.preventDefault();e.stopPropagation()}if(started)return;started=true;start.classList.add('hide');hint.classList.add('show');audioInit();try{song.currentTime=0;song.volume=.72;const p=song.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}t0=performance.now();last=t0;setTimeout(()=>hint.classList.remove('show'),7000);setTimeout(()=>{for(let i=0;i<5;i++)setTimeout(()=>launch(W*(.14+i*.18),H*(.18+Math.random()*.25),COLORS[i+1]),i*280)},5600);setTimeout(()=>confettiBurst(),16500);requestAnimationFrame(render)}
['click','pointerup'].forEach(type=>begin.addEventListener(type,startShow,{passive:false}));begin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='Space')startShow(e)});C.addEventListener('click',e=>{if(!started)return;const rect=C.getBoundingClientRect();const x=e.clientX-rect.left;const y=Math.max(80,e.clientY-rect.top);launch(x,y,COLORS[(Math.random()*COLORS.length)|0]);if(Math.random()<.35)burst(x,y,COLORS[(Math.random()*COLORS.length)|0],'ring',.65)});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!started)startShow(e);else launch()}});
requestAnimationFrame(render);
</script>
</body>
</html>
