<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Zwe Htet Myat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030c}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}</style></head><body><canvas id="c"></canvas><audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio><script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false,desynchronized:true}),song=document.getElementById('song');let W=0,H=0,D=1,started=false,t0=0,last=0;const TAU=Math.PI*2,photo=new Image();photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';const stars=[],sparks=[],rockets=[],meteors=[],birds=[];const cols=['#ff3cac','#ffcf33','#39e7ff','#9b6cff','#61f27c','#ff695d','#ffffff'];let AC=null;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;C.width=Math.floor(W*D);C.height=Math.floor(H*D);X.setTransform(D,0,0,D,0,0);stars.length=0;const n=W*H<450000?70:105;for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.72,r:.35+Math.random()*1.3,p:Math.random()*TAU})}addEventListener('resize',resize,{passive:true});resize();
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}function tone(f,d=.1,g=.018){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function bg(t){const g=X.createRadialGradient(W*.5,H*.38,0,W*.5,H*.5,Math.max(W,H)*.9);g.addColorStop(0,'#273b91');g.addColorStop(.48,'#11194d');g.addColorStop(1,'#01020a');X.fillStyle=g;X.fillRect(0,0,W,H);for(const s of stars){X.globalAlpha=.3+.45*Math.sin(t*.002+s.p);X.fillStyle='#fff8dc';X.fillRect(s.x,s.y,s.r,s.r)}X.globalAlpha=1}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');X.globalAlpha=a;X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);X.globalAlpha=1}
function intro(){X.fillStyle='#fff2f6';X.fillRect(0,0,W,H);const s=Math.min(W*.64,H*.4,430),cx=W/2,py=H*.29;glow(cx,py,s*.75,'rgba(255,120,190,.28)',1);if(photo.complete){X.save();X.beginPath();X.arc(cx,py,s*.44,0,TAU);X.clip();X.globalAlpha=.9;X.drawImage(photo,cx-s*.44,py-s*.44,s*.88,s*.88);X.restore();X.globalAlpha=1;X.strokeStyle='rgba(255,255,255,.9)';X.lineWidth=5;X.beginPath();X.arc(cx,py,s*.44,0,TAU);X.stroke()}const w=s*.72,y=H*.56;X.fillStyle='#e79ab5';X.beginPath();X.roundRect(cx-w/2,y,w,s*.2,18);X.fill();X.fillStyle='#fff9f4';X.beginPath();X.roundRect(cx-w*.42,y-s*.1,w*.84,s*.15,15);X.fill();for(let i=0;i<7;i++){const x=cx-w*.37+i*w*.123;X.fillStyle='#ffd46b';X.fillRect(x-4,y-s*.17,8,s*.12);X.fillStyle='#ff9a3d';X.beginPath();X.ellipse(x,y-s*.22,6,12,.2,0,TAU);X.fill()}X.textAlign='center';X.fillStyle='#71304b';X.font='600 '+Math.max(16,W*.024)+'px system-ui';X.fillText('ဖယောင်းတိုင်ကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ',cx,H*.9);X.font='22px system-ui';X.fillText('✨',cx,H*.95)}
function addSpark(x,y,vx,vy,c,life=1,g=.035){if(sparks.length>700)return;sparks.push({x,y,px:x,py:y,vx,vy,c,life,g})}
function burst(cx=W/2,cy=H*.45,count=95){for(let i=0;i<count;i++){const a=Math.random()*TAU,v=3+Math.random()*7;addSpark(cx,cy,Math.cos(a)*v,Math.sin(a)*v,cols[i%cols.length],1,.04)}tone(620,.14,.03);setTimeout(()=>tone(880,.18,.018),55)}
function firework(){if(rockets.length>7)return;const x=W*(.12+Math.random()*.76),ty=H*(.15+Math.random()*.34);rockets.push({x,y:H+15,ty,vy:-11-Math.random()*3,c:cols[(Math.random()*cols.length)|0],trail:[]});tone(230,.07,.006)}
function explode(r){const n=70+((Math.random()*35)|0);for(let i=0;i<n;i++){const a=TAU*i/n+Math.random()*.08,v=2.8+Math.random()*5;addSpark(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,r.c,1,.045)}tone(75,.22,.035)}
function meteor(){if(meteors.length>4)return;const a=.62+Math.random()*.16;meteors.push({x:Math.random()*W*.8-W*.1,y:Math.random()*H*.35,vx:Math.cos(a)*(14+Math.random()*6),vy:Math.sin(a)*(14+Math.random()*6),life:1,len:9+Math.random()*7});tone(300,.06,.006)}
function bird(){if(birds.length>5)return;birds.push({x:-60,y:H*(.27+Math.random()*.3),s:.45+Math.random()*.4,v:3.4+Math.random()*1.8,p:Math.random()*TAU})}
function update(dt){const k=dt/16.67;for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>6)r.trail.shift();r.x+=0;r.y+=r.vy*k;r.vy+=.12*k;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.px=p.x;p.py=p.y;p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.985,k);p.vy=p.vy*Math.pow(.985,k)+p.g*k;p.life-=.022*k;if(p.life<=0)sparks.splice(i,1)}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*k;m.y+=m.vy*k;m.life-=.018*k;if(m.life<=0||m.x>W+120||m.y>H+120)meteors.splice(i,1)}for(let i=birds.length-1;i>=0;i--){const b=birds[i];b.x+=b.v*k;b.y+=Math.sin(b.x*.012+b.p)*.25*k;if(b.x>W+100)birds.splice(i,1)}}
function drawEffects(t){X.save();X.globalCompositeOperation='lighter';for(const m of meteors){const g=X.createLinearGradient(m.x-m.vx*m.len,m.y-m.vy*m.len,m.x,m.y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.75,'rgba(130,220,255,.25)');g.addColorStop(1,'#fff');X.strokeStyle=g;X.lineWidth=2.5;X.beginPath();X.moveTo(m.x-m.vx*m.len,m.y-m.vy*m.len);X.lineTo(m.x,m.y);X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(m.x,m.y,3,0,TAU);X.fill()}for(const r of rockets){X.strokeStyle='rgba(255,255,255,.35)';X.beginPath();r.trail.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(r.x,r.y,3,0,TAU);X.fill()}for(const p of sparks){X.globalAlpha=Math.max(0,p.life);X.strokeStyle=p.c;X.lineWidth=1.5;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke()}X.restore();X.globalAlpha=1;for(const b of birds){const f=Math.sin(t*.018+b.p),x=b.x,y=b.y,s=b.s;X.save();X.translate(x,y);X.scale(s,s);X.fillStyle='#fff';X.shadowColor='#74e9ff';X.shadowBlur=7;X.beginPath();X.moveTo(0,5);X.quadraticCurveTo(-24,-13-f*14,-43,-3-f*7);X.quadraticCurveTo(-25,10,0,8);X.quadraticCurveTo(25,10,43,-3+f*7);X.quadraticCurveTo(24,-13+f*14,0,5);X.fill();X.restore()}}
function text(a,b,alpha=1){X.textAlign='center';X.shadowColor='rgba(0,0,0,.7)';X.shadowBlur=16;X.globalAlpha=alpha;X.fillStyle='#fff';X.font='700 '+Math.max(20,Math.min(42,W*.043))+'px "Noto Sans Myanmar",sans-serif';X.fillText(a,W/2,H*.53);if(b){X.font='400 '+Math.max(14,Math.min(22,W*.021))+'px "Noto Sans Myanmar",sans-serif';X.fillStyle='#ffe8a6';X.fillText(b,W/2,H*.61)}X.globalAlpha=1}
function moon(){X.fillStyle='#fff4c9';X.shadowColor='#fff0a0';X.shadowBlur=25;X.beginPath();X.arc(W*.84,H*.17,Math.min(W,H)*.065,0,TAU);X.fill();X.shadowBlur=0;X.fillStyle='#101746';X.beginPath();X.arc(W*.87,H*.15,Math.min(W,H)*.058,0,TAU);X.fill()}
function finale(t){const a=Math.min(1,(t-34)/1.5);X.textAlign='center';X.shadowColor='#ffd45e';X.shadowBlur=28;X.fillStyle='#fff6d5';X.font='700 '+Math.min(78,W*.09)+'px Georgia';X.fillText('Happy Birthday',W/2,H*.38);X.fillStyle='#ffd978';X.font='700 '+Math.min(54,W*.06)+'px Georgia';X.fillText('Zwe Htet Myat ❤️',W/2,H*.49);X.shadowBlur=10;X.globalAlpha=a;X.fillStyle='#fffaf0';X.font='400 '+Math.max(15,Math.min(23,W*.022))+'px "Noto Sans Myanmar"';X.fillText('မင်းရဲ့နေ့ရက်တိုင်း ပျော်ရွှင်မှုတွေနဲ့ တောက်ပနေပါစေ ✨',W/2,H*.61);X.globalAlpha=1}
function loop(now){const dt=Math.min(32,last?now-last:16.67);last=now;const t=started?(now-t0)/1000:0;if(!started){intro();requestAnimationFrame(loop);return}bg(now);const phase=t<3.5?0:t<7.5?1:t<18?2:t<26?3:4;if(phase===0&&Math.floor(t*2)!==Math.floor((t-dt/1000)*2))burst(W/2,H*.43,80);if(phase===1&&Math.random()<.08)meteor();if(phase===2&&Math.random()<.045)firework();if(phase===3&&Math.random()<.025)bird();if(phase===4)moon();update(dt);drawEffects(now);if(phase===0)text('✨ အိပ်မက်လေးတွေ တောက်ပလာဖို့ ✨');else if(phase===1)text('🌠 ကြယ်တွေက မင်းအတွက် ဆုတောင်းပေးနေတယ်','ကြယ်ရောင်လေးတွေ မြန်မြန်ဖြတ်သန်းသွားတယ်…');else if(phase===2)text('🎆 ဒီညဟာ မင်းအတွက်ပဲ','ကောင်းကင်တစ်ခုလုံး အရောင်စုံလင်းလက်နေတယ်');else if(phase===3)text('ပျော်ရွှင်ခြင်းတွေက မင်းဆီ ပျံလာပြီ','အမှတ်တရကောင်းလေးတွေ အမြဲရှိနေပါစေ');else finale(t);if(t>40){started=false;sparks.length=rockets.length=meteors.length=birds.length=0}requestAnimationFrame(loop)}
C.addEventListener('pointerdown',()=>{if(started)return;audio();started=true;t0=performance.now();last=t0;sparks.length=rockets.length=meteors.length=birds.length=0;song.currentTime=0;song.play().catch(()=>{});burst(W/2,H*.43,110)});requestAnimationFrame(loop);
</script></body></html>
