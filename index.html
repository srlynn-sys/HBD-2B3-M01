<!doctype html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Zwe Htet Myat 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050714}body{font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif}canvas{display:block;width:100vw;height:100svh;touch-action:manipulation;cursor:pointer}audio{display:none}
</style>
</head>
<body>
<canvas id="birthday"></canvas>
<audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
'use strict';
const C=document.getElementById('birthday'),X=C.getContext('2d'),A=document.getElementById('song');
const PHOTO='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';
const img=new Image();img.crossOrigin='anonymous';img.src=PHOTO;
let W=0,H=0,D=1,state='intro',started=false,t0=0,last=0,raf=0;
let stars=[],meteors=[],bursts=[],birds=[],sparks=[];
const TAU=Math.PI*2;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function R(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
let ac;
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,d=.15,type='sine',g=.035,delay=0){if(!ac)return;let o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+.025);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v).connect(ac.destination);o.start(n);o.stop(n+d+.04)}
function chime(){tone(784,.25,'sine',.05);tone(988,.3,'sine',.045,.12);tone(1319,.55,'sine',.05,.25)}
function whoosh(){tone(220,.5,'sawtooth',.018);tone(440,.45,'triangle',.018,.12)}
function boom(){tone(70,.5,'sine',.08);tone(130,.35,'triangle',.045,.03)}
function text(t,a,size,sub=''){X.save();X.textAlign='center';X.textBaseline='middle';X.globalAlpha=a;X.shadowColor='rgba(255,245,210,.8)';X.shadowBlur=28;X.fillStyle='#fff9e9';X.font=`600 ${size}px "Noto Sans Myanmar","Myanmar Text",sans-serif`;X.fillText(t,W/2,H/2);if(sub){X.shadowBlur=20;X.font=`500 ${Math.max(17,size*.48)}px "Noto Sans Myanmar","Myanmar Text",sans-serif`;X.fillStyle='#ffe9a8';X.fillText(sub,W/2,H/2+size*.85)}X.restore()}
function roundRect(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function drawPhoto(){if(!img.complete||!img.naturalWidth)return;let size=Math.min(W*.64,520);if(W<600)size=W*.74;let y=W<600?H*.075:H*.035;X.save();X.globalAlpha=state==='intro'?0.9:0.16;X.shadowColor='rgba(255,225,160,.5)';X.shadowBlur=60;X.beginPath();X.arc(W/2,y+size/2,size/2+5,0,TAU);X.clip();let iw=img.naturalWidth,ih=img.naturalHeight,s=Math.max(size/iw,size/ih),dw=iw*s,dh=ih*s;X.drawImage(img,W/2-dw/2,y+size/2-dh/2,dw,dh);X.restore();X.save();X.strokeStyle='rgba(255,240,210,.35)';X.lineWidth=4;X.beginPath();X.arc(W/2,y+size/2,size/2+7,0,TAU);X.stroke();X.restore()}
function cake(){let s=Math.min(1,W/900),cw=360*s,ch=220*s,cx=W/2,base=H*.66;X.save();X.translate(cx,base);
X.fillStyle='rgba(0,0,0,.22)';X.beginPath();X.ellipse(0,18*s,220*s,28*s,0,0,TAU);X.fill();
X.fillStyle='#f3e6ed';X.beginPath();X.ellipse(0,5*s,205*s,24*s,0,0,TAU);X.fill();
X.fillStyle='#e99aaa';roundRect(-170*s,-90*s,340*s,100*s,20*s);X.fill();X.fillStyle='#f7c5ce';roundRect(-140*s,-155*s,280*s,75*s,18*s);X.fill();
X.fillStyle='#fff9f4';roundRect(-170*s,-96*s,340*s,27*s,13*s);X.fill();roundRect(-140*s,-160*s,280*s,25*s,12*s);X.fill();
for(let i=0;i<5;i++){X.fillStyle=i%2?'#a84461':'#fff';X.beginPath();X.arc((-115+i*58)*s,(-55+(i%2)*25)*s,6*s,0,TAU);X.fill()}
for(let i=0;i<7;i++){let px=(-108+i*36)*s,py=-165*s;X.fillStyle='#f4a7ba';roundRect(px-7*s,py,14*s,60*s,5*s);X.fill();X.strokeStyle='rgba(255,255,255,.7)';X.lineWidth=2*s;X.beginPath();X.moveTo(px-7*s,py+12*s);X.lineTo(px+7*s,py+24*s);X.stroke();
let on=state==='intro';if(on){let flick=.5+.5*Math.sin(performance.now()/90+i);X.save();X.translate(px,py-14*s);X.rotate(Math.PI/4);X.fillStyle='#ffb52d';X.shadowColor='#ff9d32';X.shadowBlur=25*s;X.beginPath();X.ellipse(0,0,10*s,(15+flick*4)*s,0,0,TAU);X.fill();X.restore()}}
X.restore()}
function makeStars(n){stars=[];for(let i=0;i<n;i++)stars.push({a:R(0,TAU),r:R(20,80),speed:R(1.2,3.4),size:R(1,3),life:1,tw:R(0,TAU)})}
function starExplosion(){for(let i=0;i<180;i++){let a=Math.random()*TAU,s=Math.pow(Math.random(),.42)*R(3,12);sparks.push({x:W/2,y:H*.52,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:R(1,3),color:['#fff','#ffe36a','#ff9dc4','#9feaff','#d9b4ff'][i%5]})}boom()}
function meteor(){meteors.push({x:R(W*.9,W*1.2),y:R(-H*.1,H*.42),vx:-R(11,18),vy:R(5,9),life:1,len:R(120,250),size:R(2,4),glow:R(.8,1.4)});whoosh()}
function firework(x,y){let q={x,y,t:0,done:false};bursts.push(q);for(let i=0;i<100;i++){let a=Math.random()*TAU,s=Math.pow(Math.random(),.35)*R(2,8);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:R(1,3.2),color:['#ffdc62','#ff7cab','#72e5ff','#bda1ff','#fff'][i%5],gravity:.055})}boom()}
function bird(x,y,s){birds.push({x,y,s,phase:R(0,TAU),life:0})}
function reset(){state='intro';started=false;t0=0;stars=[];meteors=[];bursts=[];birds=[];sparks=[];}
function start(){if(started)return;started=true;state='story';t0=performance.now();last=t0;audio();chime();try{A.currentTime=0;A.play().catch(()=>{})}catch(e){}starExplosion();makeStars(90);requestAnimationFrame(loop)}
function update(dt,now){let t=(now-t0)/1000;
if(t>1.2&&t<1.3)state='sky';
// phase 1: star shower
if(t>2&&t<7&&Math.random()<.12)meteor();
// phase 2: clean meteor climax
if(t>7&&t<14&&Math.random()<.18)meteor();
// birds only after meteors finish
if(t>14&&t<15.2&&birds.length===0){bird(-100,H*.56,1);bird(-220,H*.66,.78);bird(-160,H*.43,.62);whoosh()}
// fireworks only after birds have crossed
if(t>20&&t<26&&Math.random()<.045)firework(R(W*.18,W*.82),R(H*.2,H*.55));
if(t>27&&t<27.1){firework(W*.28,H*.35);firework(W*.72,H*.32);firework(W*.5,H*.52);chime()}
if(t>31&&state!=='final'){state='final';chime()}
for(let p of sparks){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=(p.gravity??.025)*dt*60;p.vx*=.992;p.vy*=.992;p.life-=dt*(p.gravity?0.65:0.9)}sparks=sparks.filter(p=>p.life>0);
for(let m of meteors){m.x+=m.vx*dt*60;m.y+=m.vy*dt*60;m.life-=dt*.65}meteors=meteors.filter(m=>m.life>0&&m.x>-300);
for(let b of birds){b.x+=dt*60*(W>900?4.4:3.3)*b.s;b.phase+=dt*7;b.life+=dt}birds=birds.filter(b=>b.x<W+180);
}
function drawSparks(){for(let p of sparks){X.save();X.globalAlpha=clamp(p.life,0,1);X.fillStyle=p.color;X.shadowColor=p.color;X.shadowBlur=12;X.beginPath();X.arc(p.x,p.y,p.size,0,TAU);X.fill();X.restore()}}
function drawMeteors(){for(let m of meteors){X.save();X.globalAlpha=clamp(m.life,0,1);let tx=m.x-m.vx*m.len/10,ty=m.y-m.vy*m.len/10;let g=X.createLinearGradient(m.x,m.y,tx,ty);g.addColorStop(0,'#fff');g.addColorStop(.12,'#fffde0');g.addColorStop(.38,'#ffe875aa');g.addColorStop(1,'transparent');X.strokeStyle=g;X.lineWidth=m.size;X.lineCap='round';X.shadowColor='#ffe46b';X.shadowBlur=18;X.beginPath();X.moveTo(m.x,m.y);X.lineTo(tx,ty);X.stroke();X.fillStyle='#fff';X.shadowBlur=30;X.beginPath();X.arc(m.x,m.y,m.size*2,0,TAU);X.fill();X.restore()}}
function drawBirds(){for(let b of birds){let flap=Math.sin(b.phase)*.45;X.save();X.translate(b.x,b.y+Math.sin(b.phase*.37)*9);X.scale(b.s,b.s);X.globalAlpha=clamp(b.life*2,0,1);X.fillStyle='#fff6e6';X.shadowColor='#fff';X.shadowBlur=9;X.beginPath();X.ellipse(0,0,28,14,0,0,TAU);X.fill();X.beginPath();X.moveTo(-6,0);X.quadraticCurveTo(-37,-25-25*flap,-56,-4);X.quadraticCurveTo(-35,-5,-9,9);X.fill();X.beginPath();X.moveTo(7,-2);X.quadraticCurveTo(32,-26+25*flap,48,-4);X.quadraticCurveTo(30,-5,7,10);X.fill();X.fillStyle='#ffd36c';X.shadowBlur=0;X.beginPath();X.moveTo(27,-2);X.lineTo(45,4);X.lineTo(27,8);X.fill();X.restore()}}
function background(t){let night=state!=='intro';let g=X.createLinearGradient(0,0,0,H);if(!night){g.addColorStop(0,'#fff8f1');g.addColorStop(.55,'#f5d7e0');g.addColorStop(1,'#c98fa4')}else{g.addColorStop(0,'#02030d');g.addColorStop(.55,'#0b1540');g.addColorStop(1,'#1b2b67')}X.fillStyle=g;X.fillRect(0,0,W,H);
if(night){for(let i=0;i<stars.length;i++){let s=stars[i],alpha=.3+.7*(.5+.5*Math.sin(t*2+s.tw));let x=W/2+Math.cos(s.a)*s.r,y=H*.36+Math.sin(s.a)*s.r;X.globalAlpha=alpha;X.fillStyle='#fff';X.shadowColor='#fff';X.shadowBlur=10;X.beginPath();X.arc(x,y,s.size,0,TAU);X.fill()}X.globalAlpha=1;
let mx=W*.82,my=H*.16,ms=Math.min(W,H)*.07;X.save();X.fillStyle='#fff8d0';X.shadowColor='#fff2a4';X.shadowBlur=35;X.beginPath();X.arc(mx,my,ms,0,TAU);X.fill();X.fillStyle='#081134';X.shadowBlur=0;X.beginPath();X.arc(mx+ms*.35,my-ms*.12,ms,0,TAU);X.fill();X.restore()}}
function overlayStory(t){let a=0;if(t<2)a=ease(t/2);else if(t<7)a=1;else if(t<8)a=1-ease((t-7)/1);if(a>0)text('🎂 ဖယောင်းတိုင်လေးကို မှုတ်ပြီး ဆုတောင်းလိုက်တဲ့အချိန်မှာ...',a,Math.min(34,W*.038));
if(t>=8&&t<14){let q=t<9?ease(t-8):t>13?1-ease(t-13):1;text('✨ ဆုတောင်းချက်လေးဟာ ကြယ်မှုန်လေးတစ်စင်းအဖြစ် ကောင်းကင်ပေါ်ကို ပျံတက်သွားတယ်...',q,Math.min(33,W*.037))}
if(t>=14&&t<20){let q=t<15?ease(t-14):t>19?1-ease(t-19):1;text('🐦 ပျော်ရွှင်မှုနဲ့ လက်ဆောင်လေးတွေကို ငှက်ကလေးတွေက Zwe Htet Myat အတွက် သယ်လာပြီ...',q,Math.min(32,W*.036))}
if(t>=20&&t<28){let q=t<21?ease(t-20):t>27?1-ease(t-27):1;text('🌠 ဒီနေ့တော့ ကောင်းကင်ပေါ်က ကြယ်လေးတွေအားလုံးက မင်းရဲ့ဆုတောင်းချက်ကို ကြားနေကြပြီ... ✨',q,Math.min(33,W*.037))}
if(t>=28&&t<31){let q=t<29?ease(t-28):t>30?1-ease(t-30):1;text('🌙 လမင်းနဲ့ ကြယ်တွေက မင်းအတွက်ပဲ လင်းလက်နေကြတာပါ... မင်းရဲ့အိပ်မက်တွေ အမြဲတောက်ပပါစေ။',q,Math.min(31,W*.035))}}
function finalScreen(t){if(state!=='final')return;let q=clamp((t-31)/3,0,1),a=ease(q);X.save();X.textAlign='center';X.globalAlpha=a;X.shadowColor='#ffd85d';X.shadowBlur=35;X.fillStyle='#fff';X.font=`700 ${Math.min(92,W*.09)}px Georgia,serif`;X.fillText('Happy Birthday',W/2,H*.42);X.shadowBlur=25;X.fillStyle='#ffe9a8';X.font=`700 ${Math.min(58,W*.055)}px Georgia,serif`;X.fillText('Zwe Htet Myat ❤️',W/2,H*.53);X.shadowBlur=18;X.fillStyle='#fff9e9';X.font=`500 ${Math.min(25,W*.022)}px "Noto Sans Myanmar","Myanmar Text",sans-serif`;X.fillText('🌈 မင်းရဲ့နေ့ရက်တိုင်း ရယ်မောခြင်း၊ စွန့်စားခန်းအသစ်တွေနဲ့ ပျော်ရွှင်ခြင်းတွေနဲ့ ပြည့်နေပါစေ။',W/2,H*.64);X.fillText('✨ မင်းရဲ့အိပ်မက်လေးတွေ အမြဲတမ်း တောက်ပနေပါစေ။',W/2,H*.70);X.restore()}
function introOverlay(){let a=state==='intro'?1:0;if(a){X.save();X.globalAlpha=.9;X.fillStyle='rgba(88,22,49,.78)';X.textAlign='center';X.font=`600 ${Math.min(22,W*.022)}px "Noto Sans Myanmar","Myanmar Text",sans-serif`;X.fillText('🕯️ ဖယောင်းတိုင်လေးတစ်တိုင်ကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ ✨',W/2,H*.92);X.restore()}}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(started)update(dt,now);let t=started?(now-t0)/1000:0;background(t);if(state==='intro'){drawPhoto();cake();introOverlay()}else{X.fillStyle='rgba(2,3,12,.08)';X.fillRect(0,0,W,H);drawMeteors();drawBirds();drawSparks();overlayStory(t);finalScreen(t)}raf=requestAnimationFrame(loop)}
requestAnimationFrame(loop);
C.addEventListener('pointerdown',e=>{if(!started&&state==='intro')start();else if(state==='final'&&(performance.now()-t0)/1000>35)location.reload()});
</script>
</body>
</html>
