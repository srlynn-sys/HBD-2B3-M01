<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday Zwe Htet Myat 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 50% 20%,#fff9ef 0,#f8e8df 38%,#e9cbd0 100%);color:#5b2434}.scene{position:relative;width:100%;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:24px}.backdrop{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,235,239,.25));z-index:0}.photo{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:min(76vw,560px);height:min(76vw,560px);max-height:72svh;object-fit:cover;object-position:center;border-radius:50%;opacity:.72;filter:saturate(1.05) contrast(1.06) brightness(1.02);box-shadow:0 0 80px rgba(119,45,72,.25);z-index:1}.cake-wrap{position:relative;z-index:3;width:min(520px,92vw);display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 24px 24px rgba(87,34,52,.22));transition:transform .5s ease}.cake-wrap.lit{animation:cakeGlow 1.7s ease-in-out infinite alternate}.cake{position:relative;width:min(390px,76vw);height:min(250px,47vw);min-height:190px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:27px;border-radius:50%;background:linear-gradient(#fff,#ead6dc);box-shadow:0 7px 0 rgba(100,44,59,.1)}.tier{position:absolute;border:3px solid rgba(146,60,79,.14)}.tier.bottom{left:6%;bottom:22px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(180deg,#fff4f0,#f7c8cc 65%,#e8a6b0)}.tier.top{left:14%;bottom:106px;width:72%;height:73px;border-radius:17px 17px 23px 23px;background:linear-gradient(180deg,#fff8f2,#f3b9c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:28px;border-radius:18px;background:#fffaf5;box-shadow:0 3px 0 rgba(159,76,96,.08)}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.drip.d1{left:17%}.drip.d2{left:39%;height:38px}.drip.d3{left:67%;height:31px}.drip.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px rgba(255,255,255,.55)}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}
.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);box-shadow:inset -3px 0 0 rgba(130,40,60,.12);cursor:pointer;z-index:8;touch-action:manipulation}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%);border-radius:2px}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px rgba(255,180,50,.38),0 0 38px 10px rgba(255,124,71,.18);animation:flicker .13s infinite alternate;transform-origin:55% 85%}.flame:after{content:'';position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%;opacity:.9}.hint{position:absolute;z-index:5;bottom:7%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vw,19px);letter-spacing:2px;color:#713448;background:rgba(255,255,255,.58);padding:10px 18px;border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap;transition:opacity .35s}.hint.hidden{opacity:0;pointer-events:none}
.page2{position:absolute;inset:0;z-index:12;background:radial-gradient(circle at center,#fffdf7 0,#f7dfe4 48%,#dcaab7 100%);display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s ease}.page2.show{opacity:1;visibility:visible}.page2-title{font-size:clamp(18px,4vw,32px);letter-spacing:5px;color:#8a3a52;opacity:0;transform:translateY(20px);transition:opacity 1s ease,transform 1s ease}.page2.show .page2-title{opacity:.9;transform:none;transition-delay:3.1s}.message{position:absolute;z-index:20;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}.message.show{animation:messageIn 2.8s cubic-bezier(.2,.8,.2,1) forwards}.title{margin:0;text-align:center;font-size:clamp(34px,8vw,92px);line-height:.95;font-weight:700;letter-spacing:3px;color:#7c2945;text-shadow:0 4px 18px rgba(255,255,255,.9)}.name{display:block;margin-top:16px;font-size:clamp(25px,5vw,56px);letter-spacing:4px;color:#b34b66}.sparkle{position:absolute;z-index:18;width:8px;height:8px;background:#fff4b8;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 15px 5px rgba(255,238,151,.8);opacity:0}.sparkle.boom{animation:boom 2.2s cubic-bezier(.1,.8,.2,1) forwards}.restart{position:absolute;z-index:25;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:rgba(124,41,69,.9);color:white;padding:10px 17px;border-radius:999px;font:inherit;cursor:pointer;opacity:0;pointer-events:none;transition:.3s}.restart.show{opacity:1;pointer-events:auto}
@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94,.98)}to{transform:translateX(-50%) rotate(48deg) scale(1.06,1.03)}}@keyframes cakeGlow{from{filter:drop-shadow(0 24px 24px rgba(87,34,52,.22))}to{filter:drop-shadow(0 24px 35px rgba(255,165,82,.4))}}@keyframes messageIn{0%{opacity:0;transform:scale(.55);filter:blur(10px)}45%{opacity:.15;transform:scale(.78);filter:blur(5px)}75%{opacity:.72;transform:scale(1.04);filter:blur(1px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes boom{0%{opacity:0;transform:translate(0,0) rotate(45deg) scale(.1)}8%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(405deg) scale(1.25)}}
@media(max-width:600px){.scene{padding:12px}.photo{top:5%;width:86vw;height:86vw;opacity:.76}.cake-wrap{transform:scale(.94)}.candle{width:15px;height:61px}.flame{top:-39px;width:19px;height:30px}.hint{bottom:8%;letter-spacing:1px}.title{letter-spacing:1px}.name{letter-spacing:2px}}@media(max-height:620px) and (orientation:landscape){.cake-wrap{transform:scale(.68)}.hint{bottom:2%}.photo{top:3%;height:80vh;width:80vh}}@media(prefers-reduced-motion:reduce){.flame{animation:none}.cake-wrap.lit{animation:none}}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="backdrop"></div>
<img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'"/>
<div class="cake-wrap lit" id="cakeWrap"><div class="cake">
<div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div>
<div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div>
<button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div>
</div></div>
<div class="hint" id="hint">Happy Birthday 🎂 — မီးလေးတစ်ခုခုကို နှိပ်ပါ</div>
<div class="page2" id="page2"><div class="page2-title">A LITTLE BIRTHDAY SURPRISE ✨</div></div>
<div class="message" id="message"><h1 class="title">Happy Birthday<span class="name">Zwe Htet Myat ❤️</span></h1></div>
<button class="restart" id="restart">Replay ✨</button>
</main>
<script>
const candles=[...document.querySelectorAll('.candle')],hint=document.getElementById('hint'),message=document.getElementById('message'),scene=document.getElementById('scene'),cakeWrap=document.getElementById('cakeWrap'),page2=document.getElementById('page2'),restart=document.getElementById('restart');let finished=false;
const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';birthdaySong.volume=1;
function playBirthdaySong(){try{birthdaySong.currentTime=0;const p=birthdaySong.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function starBurst(){const count=innerWidth<600?80:130;for(let i=0;i<count;i++){const s=document.createElement('span');s.className='sparkle boom';const a=Math.random()*Math.PI*2;const d=Math.min(innerWidth,innerHeight)*(.22+Math.random()*.72);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',`${Math.cos(a)*d}px`);s.style.setProperty('--y',`${Math.sin(a)*d}px`);s.style.animationDelay=`${Math.random()*.25}s`;const size=3+Math.random()*8;s.style.width=size+'px';s.style.height=size+'px';scene.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function celebrate(){if(finished)return;finished=true;playBirthdaySong();candles.forEach(c=>{c.querySelector('.flame').style.display='none';c.disabled=true});cakeWrap.classList.remove('lit');hint.classList.add('hidden');setTimeout(()=>{page2.classList.add('show');starBurst()},300);setTimeout(()=>message.classList.add('show'),1800);setTimeout(()=>restart.classList.add('show'),5000)}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.addEventListener('click',()=>location.reload());
</script>
</body>
</html>
