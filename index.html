<body>

<script>

function whoosh(){tone(180,.6,'sine',.08);tone(700,.5,'triangle',.035,.15)}function pop(){tone(95,.12,'sine',.11);tone(520,.16,'triangle',.08,.02);tone(920,.1,'sine',.045,.04)}function sparkleSound(){tone(880,.28,'sine',.035);tone(1320,.24,'sine',.025,.08);tone(1760,.2,'sine',.018,.16)}function birdSound(){tone(900,.15,'sine',.025);tone(1250,.14,'sine',.022,.1);tone(1050,.15,'sine',.02,.2)}function finaleSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.65,'sine',.045,i*.16));tone(1319,1,'triangle',.055,.7)}function playSong(){try{birthdaySong.currentTime=0;const p=birthdaySong.play();if(p)p.catch(()=>{})}catch(e){}}
