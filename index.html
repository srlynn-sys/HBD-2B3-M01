<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:#070b25}.scene{position:relative;width:100%;height:100svh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff9ef,#f7dfe4 45%,#e9cbd0)}.photo{position:absolute;z-index:1;top:5%;left:50%;transform:translateX(-50%);width:min(76vw,560px);height:min(76vw,560px);object-fit:cover;border-radius:50%;opacity:.74;filter:saturate(1.05) contrast(1.05);box-shadow:0 0 80px rgba(119,45,72,.25)}.cake-wrap{z-index:4;position:relative;width:min(520px,92vw);display:flex;justify-content:center;filter:drop-shadow(0 24px 24px rgba(87,34,52,.22))}.cake{position:relative;width:min(390px,76vw);height:min(250px,47vw);min-height:190px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:27px;border-radius:50%;background:linear-gradient(#fff,#ead6dc)}.tier{position:absolute;border:3px solid rgba(146,60,79,.14)}.bottom{left:6%;bottom:22px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(#fff4f0,#f7c8cc 65%,#e8a6b0)}.top{left:14%;bottom:106px;width:72%;height:73px;border-radius:17px 17px 23px 23px;background:linear-gradient(#fff8f2,#f3b9c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:28px;border-radius:18px;background:#fffaf5}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.d1{left:17%}.d2{left:39%;height:38px}.d3{left:67%;height:31px}.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px rgba(255,255,255,.55)}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);cursor:pointer;z-index:8}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%)}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px rgba(255,180,50,.38),0 0 38px 10px rgba(255,124,71,.18);animation:flicker .13s infinite alternate}.flame:after{content:'';position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%}.hint{position:absolute;z-index:6;bottom:7%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vw,19px);color:#713448;background:rgba(255,255,255,.62);padding:10px 18px;border-radius:999px;white-space:nowrap;transition:.5s}.hint.hide{opacity:0}.page2{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 55%,#18245e 0,#070b25 58%,#02030d 100%);opacity:0;visibility:hidden;overflow:hidden}.page2.show{opacity:1;visibility:visible}.star{position:absolute;width:7px;height:7px;background:#fff5b5;border-radius:50%;box-shadow:0 0 15px 5px #ffe87b;opacity:0}.star.go{animation:starOut 3.8s cubic-bezier(.1,.7,.15,1) forwards}.fw{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;z-index:5}.fw.show{animation:fwPop 2.8s ease-out forwards}.fw i{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px 3px currentColor}.fw i::after{content:'';position:absolute;width:2px;height:18px;left:1px;top:-20px;background:currentColor;opacity:.65;border-radius:2px;transform:rotate(25deg)}.bird{position:absolute;z-index:8;width:70px;height:38px;opacity:0;filter:drop-shadow(0 0 7px rgba(255,255,255,.45))}.bird .wing{position:absolute;width:31px;height:17px;border:4px solid #f4e9d7;border-top-color:#fff;border-left-color:transparent;border-radius:80% 20% 70% 30%;top:8px}.bird .left{left:3px;transform-origin:100% 50%;animation:wingLeft .28s ease-in-out infinite alternate}.bird .right{right:3px;transform:scaleX(-1);transform-origin:100% 50%;animation:wingRight .28s ease-in-out infinite alternate}.bird .body{position:absolute;left:27px;top:12px;width:18px;height:12px;background:#fff4df;border-radius:60% 50% 50% 60%;box-shadow:0 2px 0 rgba(0,0,0,.12)}.bird .beak{position:absolute;left:44px;top:15px;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:9px solid #ffd35a}.bird .eye{position:absolute;left:38px;top:14px;width:3px;height:3px;background:#222;border-radius:50%}.bird.fly{animation:birdFly 4.8s ease-in-out forwards}.sky{position:absolute;inset:0;opacity:0;z-index:10}.sky.show{animation:skyIn 3.5s ease forwards}.sun{position:absolute;left:10%;top:12%;width:clamp(58px,10vw,105px);height:clamp(58px,10vw,105px);border-radius:50%;background:#ffd84d;box-shadow:0 0 35px 12px #ffd45a66,0 0 80px 20px #ffb32e33;animation:sunFloat 3s ease-in-out infinite alternate}.moon{position:absolute;right:12%;top:15%;width:clamp(52px,9vw,92px);height:clamp(52px,9vw,92px);border-radius:50%;background:#fff9d7;box-shadow:0 0 30px 9px #fff8d955}.moon:after{content:'';position:absolute;right:-13px;top:-5px;width:100%;height:100%;border-radius:50%;background:#0a0f32}.tw{position:absolute;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 12px 4px white;animation:twinkle 1.2s ease-in-out infinite alternate}.message{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;text-align:center}.message.show{animation:messageIn 3.5s cubic-bezier(.2,.8,.2,1) forwards}.title{margin:0;color:white;font-size:clamp(34px,8vw,92px);line-height:.95;letter-spacing:2px;text-shadow:0 0 35px #ffd86a99}.name{display:block;margin-top:16px;color:#ffe7a1;font-size:clamp(25px,5vw,56px);letter-spacing:3px}.restart{position:absolute;z-index:40;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:#ffffff22;color:white;padding:10px 18px;border-radius:999px;opacity:0}.restart.show{opacity:1}
@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94)}to{transform:translateX(-50%) rotate(48deg) scale(1.06)}}@keyframes starOut{0%{opacity:0;transform:translate(0,0) scale(.1) rotate(0)}8%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(540deg)}}@keyframes fwPop{0%{opacity:0;transform:scale(.05)}10%{opacity:1;transform:scale(.35)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}@keyframes birdFly{0%{opacity:0;transform:translate(-12vw,20vh) scale(.55)}12%{opacity:1}50%{transform:translate(45vw,-5vh) scale(1)}100%{opacity:0;transform:translate(120vw,-18vh) scale(.9)}}@keyframes wingLeft{from{transform:rotate(12deg) scaleY(.65)}to{transform:rotate(-32deg) scaleY(1.15)}}@keyframes wingRight{from{transform:rotate(12deg) scaleY(.65)}to{transform:rotate(-32deg) scaleY(1.15)}}@keyframes skyIn{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}@keyframes sunFloat{from{transform:translateY(0)}to{transform:translateY(12px)}}@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}@keyframes messageIn{0%{opacity:0;transform:scale(.45);filter:blur(14px)}35%{opacity:.18;transform:scale(.68);filter:blur(8px)}70%{opacity:.7;transform:scale(1.04);filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@media(max-width:600px){.photo{width:86vw;height:86vw}.cake-wrap{transform:scale(.94)}.candle{width:15px;height:61px}.flame{top:-39px;width:19px;height:30px}.hint{bottom:8%}.bird{transform:scale(.8)}}
</style>
</head>
<body>
<main class="scene" id="scene">
<img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'">
<div class="cake-wrap" id="cakeWrap"><div class="cake">
<div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div>
<div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div>
<button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div></div></div>
<div class="hint" id="hint">🎂 မီးလေးတစ်ခုခုကို နှိပ်ပါ</div>
<div class="page2" id="page2"><div class="sky" id="sky"><div class="sun"></div><div class="moon"></div></div></div>
<div class="message" id="message"><h1 class="title">Happy Birthday<span class="name">Zwe Htet Myat ❤️</span></h1></div>
<button class="restart" id="restart">Replay ✨</button>
</main>
<script>
const scene=document.getElementById('scene'),page2=document.getElementById('page2'),sky=document.getElementById('sky'),message=document.getElementById('message'),hint=document.getElementById('hint'),cakeWrap=document.getElementById('cakeWrap'),candles=[...document.querySelectorAll('.candle')],restart=document.getElementById('restart');let done=false,audioCtx=null;
const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';birthdaySong.volume=1;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur,type='sine',gain=.06,delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(0,audioCtx.currentTime+delay);g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}
function whoosh(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(180,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+.55);g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.65);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.7)}
function pop(){tone(95,.12,'sine',.11);tone(520,.16,'triangle',.08,.02);tone(920,.1,'sine',.045,.04)}
function sparkleSound(){tone(880,.28,'sine',.035);tone(1320,.24,'sine',.025,.08);tone(1760,.2,'sine',.018,.16)}
function birdSound(){tone(900,.18,'sine',.025);tone(1250,.16,'sine',.022,.12);tone(1050,.16,'sine',.02,.24)}
function finaleSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.65,'sine',.045,i*.16));tone(1319,1,'triangle',.055,.7)}
function playSong(){try{birthdaySong.currentTime=0;let p=birthdaySong.play();if(p)p.catch(()=>{})}catch(e){}}
function stars(){let count=innerWidth<600?170:260;for(let i=0;i<count;i++){let s=document.createElement('i');s.className='star go';let a=Math.random()*Math.PI*2,d=Math.min(innerWidth,innerHeight)*(.25+Math.random()*1.1);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*.9+'s';let z=3+Math.random()*8;s.style.width=z+'px';s.style.height=z+'px';page2.appendChild(s);setTimeout(()=>s.remove(),5000)}whoosh()}
function firework(x,y,delay,color){setTimeout(()=>{let f=document.createElement('div');f.className='fw show';f.style.left=x+'%';f.style.top=y+'%';f.style.color=color;for(let i=0;i<36;i++){let p=document.createElement('i'),a=i*Math.PI*2/36,r=28+Math.random()*115;p.style.left=Math.cos(a)*r+'px';p.style.top=Math.sin(a)*r+'px';p.style.transform='scale('+(0.7+Math.random()*.8)+')';f.appendChild(p)}page2.appendChild(f);pop();setTimeout(()=>f.remove(),3300)},delay)}
function fireworks(){const colors=['#ff3b6b','#ffd84d','#55e6ff','#9f7cff','#66ff9a','#ff8a3d','#ff6ff0','#ffffff'];const spots=[[16,28],[37,20],[62,27],[84,24],[25,48],[50,42],[75,47],[12,66],[39,62],[63,66],[88,63],[50,18]];spots.forEach((p,i)=>firework(p[0],p[1],i*900,colors[i%colors.length]))}
function makeBird(){let b=document.createElement('div');b.className='bird fly';b.innerHTML='<span class="wing left"></span><span class="wing right"></span><span class="body"></span><span class="beak"></span><span class="eye"></span>';b.style.top=(28+Math.random()*42)+'%';b.style.animationDelay=(Math.random()*.3)+'s';page2.appendChild(b);birdSound();setTimeout(()=>b.remove(),5200)}
function birds(){for(let i=0;i<7;i++)setTimeout(makeBird,i*1150)}
function skyStars(){for(let i=0;i<48;i++){let s=document.createElement('i');s.className='tw';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*78)+'%';s.style.animationDelay=Math.random()*2+'s';sky.appendChild(s)}sparkleSound()}
function celebrate(){if(done)return;done=true;initAudio();playSong();tone(330,.3,'sine',.05);candles.forEach(c=>{c.disabled=true;c.querySelector('.flame').style.display='none'});cakeWrap.style.transition='1.5s';cakeWrap.style.transform='scale(.82) translateY(20px)';hint.classList.add('hide');setTimeout(()=>{page2.classList.add('show');stars()},700);setTimeout(fireworks,3200);setTimeout(birds,14500);setTimeout(()=>{skyStars();sky.classList.add('show')},23500);setTimeout(()=>{finaleSound();message.classList.add('show')},29500);setTimeout(()=>restart.classList.add('show'),35500)}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.onclick=()=>location.reload();
</script>
</body>
</html>
