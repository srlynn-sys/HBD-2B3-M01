%;top:15%;width:clamp(52px,9vw,92px);height:clamp(52px,9vw,92px);border-radius:50%;background:#fff9d7;box-shadow:0 0 30px 9px #fff8d955}.moon:after{content:'';position:absolute;right:-13px;top:-5px;width:100%;height:100%;border-radius:50%;background:#0a0f32}.tw{position:absolute;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 12px 4px white;animation:twinkle 1.2s ease-in-out infinite alternate}.shoot{position:absolute;width:4px;height:70px;border-radius:99px;background:linear-gradient(transparent,#fff,#ffe27a);opacity:0;transform:rotate(45deg);animation:shoot 1.5s ease forwards}.firefly{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe875;box-shadow:0 0 16px 7px #ffe875;opacity:0;animation:floaty 5s ease-in-out infinite alternate}.wish{position:absolute;z-index:22;left:50%;bottom:14%;transform:translateX(-50%);color:#fff4bd;font-size:clamp(17px,3.5vw,34px);letter-spacing:2px;opacity:0;text-shadow:0 0 25px #ffd65a}.wish.show{animation:wishIn 2.8s ease forwards}.message{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;text-align:center}.message.show{animation:messageIn 3.5s cubic-bezier(.2,.8,.2,1) forwards}.title{margin:0;color:white;font-size:clamp(34px,8vw,92px);line-height:.95;letter-spacing:2px;text-shadow:0 0 35px #ffd86a99}.name{display:block;margin-top:16px;color:#ffe7a1;font-size:clamp(25px,5vw,56px);letter-spacing:3px}.heart{position:absolute;z-index:28;width:18px;height:18px;background:#ff4d75;transform:rotate(45deg);opacity:0;box-shadow:0 0 22px 8px #ff4d7566}.heart:before,.heart:after{content:'';position:absolute;width:18px;height:18px;background:#ff4d75;border-radius:50%}.heart:before{left:-9px}.heart:after{top:-9px}.heart.fly{animation:heartFly 3s ease forwards}.restart{position:absolute;z-index:40;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:#ffffff22;color:white;padding:10px 18px;border-radius:999px;opacity:0}.restart.show{opacity:1}@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94)}to{transform:translateX(-50%) rotate(48deg) scale(1.06)}}@keyframes starOut{0%{opacity:0;transform:translate(0,0) scale(.1) rotate(0)}8%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(540deg)}}@keyframes fwPop{0%{opacity:0;transform:scale(.05)}10%{opacity:1;transform:scale(.35)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}@keyframes birdFly{0%{opacity:0;transform:translate(-12vw,20vh) scale(.55)}12%{opacity:1}50%{transform:translate(45vw,-5vh) scale(1)}100%{opacity:0;transform:translate(120vw,-18vh) scale(.9)}}@keyframes wingLeft{from{transform:rotate(12deg) scaleY(.65)}to{transform:rotate(-32deg) scaleY(1.15)}}@keyframes wingRight{from{transform:rotate(12deg) scaleY(.65)}to{transform:rotate(-32deg) scaleY(1.15)}}@keyframes skyIn{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}@keyframes sunFloat{from{transform:translateY(0)}to{transform:translateY(12px)}}@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}@keyframes messageIn{0%{opacity:0;transform:scale(.45);filter:blur(14px)}35%{opacity:.18;transform:scale(.68);filter:blur(8px)}70%{opacity:.7;transform:scale(1.04);filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes flash{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}@keyframes storyIn{0%{opacity:0;transform:scale(.7);filter:blur(12px)}35%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}@keyframes cloudMove{0%{left:-220px;opacity:0}10%{opacity:.7}90%{opacity:.45}100%{left:110vw;opacity:0}}@keyframes shoot{0%{opacity:0;transform:translate(-20vw,-10vh) rotate(45deg)}15%{opacity:1}100%{opacity:0;transform:translate(50vw,50vh) rotate(45deg)}}@keyframes floaty{from{transform:translate(0,0)}to{transform:translate(35px,-45px)}}@keyframes wishIn{0%{opacity:0;tran <body>
<main class="scene" id="scene">
<img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'">
<div class="cake-wrap" id="cakeWrap"><div class="cake"><div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div><div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div><button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div></div></div>

<div class="page2" id="page2"><div class="veil" id="veil"></div><div class="sky" id="sky"><div class="sun"></div><div class="moon"></div></div></div>

<div class="wish" id="wish"></div><div class="message" id="message"><h1 class="title">Happy Birthday<span class="name">Zwe Htet Myat ❤️</span></h1></div><button class="restart" id="restart">Replay ✨</button>
</main>
<script>
const scene=document.getElementById('scene'),page2=document.getElementById('page2'),sky=document.getElementById('sky'),message=document.getElementById('message'),hint=document.getElementById('hint'),cakeWrap=document.getElementById('cakeWrap'),candles=[...document.querySelectorAll('.candle')],restart=document.getElementById('restart'),story=document.getElementById('story'),storyText=document.getElementById('storyText'),storySub=document.getElementById('storySub'),wish=document.getElementById('wish'),veil=document.getElementById('veil');let done=false,audioCtx=null;
const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';birthdaySong.volume=1;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur,type='sine',gain=.06,delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(0,audioCtx.currentTime+delay);g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}
function whoosh(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(180,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+.55);g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.65);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.7)}
function pop(){tone(95,.12,'sine',.11);tone(520,.16,'triangle',.08,.02);tone(920,.1,'sine',.045,.04)}
function sparkleSound(){tone(880,.28,'sine',.035);tone(1320,.24,'sine',.025,.08);tone(1760,.2,'sine',.018,.16)}
function birdSound(){tone(900,.18,'sine',.025);tone(1250,.16,'sine',.022,.12);tone(1050,.16,'sine',.02,.24)}
function finaleSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.65,'sine',.045,i*.16));tone(1319,1,'triangle',.055,.7)}
function playSong(){try{birthdaySong.currentTime=0;let p=birthdaySong.play();if(p)p.catch(()=>{})}catch(e){}}
function stars(){let count=innerWidth<600?170:260;for(let i=0;i<count;i++){let s=document.createElement('i');s.className='star go';let a=Math.random()*Math.PI*2,d=Math.min(innerWidth,innerHeight)*(.25+Math.random()*1.1);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*.9+'s';let z=3+Math.random()*8;s.style.width=z+'px';s.style.height=z+'px';page2.appendChild(s);setTimeout(()=>s.remove(),5000)}whoosh()}
function firework(x,y,delay,color,big=false){setTimeout(()=>{let f=document.createElement('div');f.className='fw show'+(big?' big':'');f.style.left=x+'%';f.style.top=y+'%';f.style.color=color;for(let i=0;i<(big?52:36);i++){let p=document.createElement('i'),a=i*Math.PI*2/(big?52:36),r=(big?38:28)+Math.random()*(big?150:115);p.style.left=Math.cos(a)*r+'px';p.style.top=Math.sin(a)*r+'px';p.style.transform='scale('+(0.7+Math.random()*.8)+')';f.appendChild(p)}page2.appendChild(f);pop();setTimeout(()=>f.remove(),3300)},delay)}
function fireworks(){const colors=['#ff3b6b','#ffd84d','#55e6ff','#9f7cff','#66ff9a','#ff8a3d','#ff6ff0','#ffffff'];const spots=[[16,28],[37,20],[62,27],[84,24],[25,48],[50,42],[75,47],[12,66],[39,62],[63,66],[88,63],[50,18]];spots.forEach((p,i)=>firework(p[0],p[1],i*900,colors[i%colors.length],i===5||i===10))}
function makeBird(){let b=document.createElement('div');b.className='bird fly';b.innerHTML='<span class="wing left"></span><span class="wing right"></span><span class="body"></span><span class="beak"></span><span class="eye"></span>';b.style.top=(28+Math.random()*42)+'%';b.style.animationDelay=(Math.random()*.3)+'s';page2.appendChild(b);birdSound();setTimeout(()=>b.remove(),5200)}
function birds(){for(let i=0;i<7;i++)setTimeout(makeBird,i*1150)}
function clouds(){for(let i=0;i<4;i++){let c=document.createElement('div');c.className='cloud fly';c.style.top=(12+i*14)+'%';c.style.animationDelay=(i*1.7)+'s';c.style.transform='scale('+(0.7+Math.random()*.6)+')';page2.appendChild(c);setTimeout(()=>c.remove(),19000)}}
function skyStars(){for(let i=0;i<48;i++){let s=document.createElement('i');s.className='tw';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*78)+'%';s.style.animationDelay=Math.random()*2+'s';sky.appendChild(s)}for(let i=0;i<4;i++){let q=document.createElement('i');q.className='shoot';q.style.left=(5+Math.random()*80)+'%';q.style.top=(3+Math.random()*45)+'%';q.style.animationDelay=(i*1.8)+'s';sky.appendChild(q)}for(let i=0;i<18;i++){let f=document.createElement('i');f.className='firefly';f.style.left=(5+Math.random()*90)+'%';f.style.top=(45+Math.random()*45)+'%';f.style.animationDelay=Math.random()*3+'s';sky.appendChild(f)}sparkleSound()}
function showStory(text,sub,dur=3000){storyText.textContent=text;storySub.textContent=sub||'';story.classList.remove('show');void story.offsetWidth;story.classList.add('show');setTimeout(()=>story.classList.remove('show'),dur)}
function heartBurst(){for(let i=0;i<34;i++){let h=document.createElement('i');h.className='heart fly';h.style.left='50%';h.style.top='50%';let a=Math.random()*Math.PI*2,d=70+Math.random()*innerWidth*.42;h.style.setProperty('--hx',Math.cos(a)*d+'px');h.style.setProperty('--hy',Math.sin(a)*d+'px');h.style.animationDelay=Math.random()*.7+'s';page2.appendChild(h);setTimeout(()=>h.remove(),4000)}}
function celebrate(){if(done)return;done=true;initAudio();playSong();tone(330,.3,'sine',.05);candles.forEach(c=>{c.disabled=true;c.querySelector('.flame').style.display='none'});cakeWrap.style.transition='1.5s';cakeWrap.style.transform='scale(.82) translateY(20px)';hint.classList.add('hide');setTimeout(()=>{page2.classList.add('show');veil.classList.add('flash');stars();showStory('✨ A little wish is about to begin...','Make a wish, Zwe Htet Myat 💫',2600)},700);setTimeout(()=>{fireworks();clouds();showStory('🌈 Tonight, the sky is celebrating too!','Look up... something magical is coming ✨',2800)},4200);setTimeout(()=>{birds();showStory('🐦 Wishes are flying across the sky','Every little sparkle carries a happy wish ❤️',2800)},14500);setTimeout(()=>{skyStars();sky.classList.add('show');showStory('🌙 Day becomes night...','And the brightest star is waiting for you',3000)},23500);setTimeout(()=>{wish.textContent='May every new day bring you more smiles ✨';wish.classList.add('show');sparkleSound()},27000);setTimeout(()=>{wish.classList.remove('show');heartBurst();finaleSound();message.classList.add('show')},30500);setTimeout(()=>restart.classList.add('show'),37000)}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.onclick=()=>location.reload();
</script>
</body>
