*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,"Noto Sans Myanmar",sans-serif;background:#050817;color:#fff}.screen{position:fixed;inset:0;overflow:hidden}.intro{display:grid;place-items:center;background:radial-gradient(circle at 50% 12%,#fff9ef 0,#f7d8e1 38%,#c98da5 100%);transition:opacity 1s,transform 1.2s}.intro.hide{opacity:0;transform:scale(1.08);pointer-events:none}.photo{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);width:min(49vw,500px);height:min(49vw,500px);border-radius:50%;object-fit:cover;object-position:center 38%;filter:saturate(1.12)contrast(1.06);box-shadow:0 0 0 10px #fff5,0 0 70px #ffb8d577,0 30px 90px #5b173544}.photo:after{content:"";position:absolute}.cakeWrap{position:relative;z-index:5;width:min(560px,88vw);transform:translateY(10vh)}.cake{position:relative;width:min(410px,74vw);height:250px;margin:auto;filter:drop-shadow(0 25px 25px #5a173833)}.plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:112%;height:28px;border-radius:50%;background:linear-gradient(#fff,#e4c8d0);box-shadow:0 5px 12px #56172c33}.tier{position:absolute;border:2px solid #8d3d5125}.bottom{left:5%;bottom:22px;width:90%;height:105px;border-radius:20px 20px 30px 30px;background:linear-gradient(#fff7f1,#f7c5ce 65%,#e6a0ad)}.top{left:14%;bottom:105px;width:72%;height:75px;border-radius:18px 18px 24px 24px;background:linear-gradient(#fffaf4,#f2b4bf)}.icing{position:absolute;inset:-5px 0 auto;height:28px;border-radius:18px;background:#fffaf5}.drip{position:absolute;top:12px;width:19px;height:30px;border-radius:0 0 13px 13px;background:#fffaf5}.d1{left:17%}.d2{left:39%;height:39px}.d3{left:67%;height:31px}.d4{left:84%;height:23px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#a13c5a;box-shadow:0 0 0 4px #fff9}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}.candle{position:absolute;bottom:1 ff,0 0 48px #ffd35a,0 12px 45px #000;animation:finalName 2.2s cubic-bezier(.15,.8,.2,1) forwards}.ring{position:absolute;width:min(62vw,720px);height:min(62vw,720px);border:2px solid #ffe58a66;border-radius:50%;box-shadow:0 0 45px #ffd85c55;animation:ring 3s ease-out forwards}.replay{position:absolute;z-index:60;bottom:4%;left:50%;transform:translateX(-50%);border:1px solid #fff5;border-radius:999px;background:#ffffff1d;color:#fff;padding:12px 22px;font:700 15px system-ui,"Noto Sans Myanmar",sans-serif;opacity:0;cursor:pointer;backdrop-filter:blur(10px)}.replay.show{opacity:1;transition:.8s}.fx{position:absolute;inset:0;pointer-events:none;z-index:35}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 14px 5px #fff}.spark.go{animation:spark 2.4s ease-out forwards}.gift{position:absolute;font-size:clamp(28px,4vw,52px);z-index:28;animation:gift 5s ease-out forwards;filter:drop-shadow(0 6px 12px #0006)}@keyframes flicker{from{transform:translateX(-50%)rotate(43deg)scale(.94)}to{transform:translateX(-50%)rotate(48deg)scale(1.06)}}@keyframes smoke{0%{opacity:.8;transform:translate(-50%,0)scale(.6)}45%{opacity:.45;transform:translate(-30%,-20px)scale(1.6)}100%{opacity:0;transform:translate(-70%,-48px)scale(2.5)}}@keyframes twinkle{from{opacity:.38}to{opacity:.95}}@keyframes fly{0%{opacity:0;transform:translate(-15vw,12vh)scale(.55)}8%{opacity:1}50%{transform:translate(55vw,-6vh)scale(1)}92%{opacity:1}100%{opacity:0;transform:translate(120vw,5vh)scale(.85)}}@keyframes meteor{0%{opacity:0;left:108%;top:var(--y);transform:scale(.3)}7%{opacity:1}70%{opacity:1}100%{opacity:0;left:-22%;top:calc(var(--y) + var(--d));transform:scale(.8)}}@keyframes balloon{0%{opacity:0;transform:translateY(25vh)rotate(-8deg)scale(.7)}10%{opacity:1}55%{opacity:1;transform:translateY(-25vh)rotate(8deg)}100%{opacity:0;transform:translateY(-125vh)rotate(-6deg)}}@keyframes spark{0%{opacity:0;transform:translate(0,0)scale(.2)}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y))scale(1.4)}}@keyframes gift{0%{opacity:0;transform:translate(-10vw,25vh)rotate(-15deg)scale(.5)}12%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(115vw,-30vh)rotate(25deg)scale(.8)}}@keyframes finalName{0%{opacity:0;transform:scale(.55);filter:blur(14px)}55%{opacity:1;transform:scale(1.08);filter:none}100%{opacity:1;transform:scale(1)}}@keyframes ring{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(1.3)}}@media(min-width:900px){.photo{top:1.5%}.cakeWrap{transform:translateY(9vh)scale(1.08)}.intro:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff6 0 1px,transparent 1px) 0 0/90px 90px;opacity:.08}.story{max-width:1050px}}@media(max-width:600px){.photo{top:3%;width:70vw;height:70vw}.cakeWrap{transform:translateY(5vh)scale(.9)}.story{width:90vw;padding:18px 15px;border-radius:20px;font-size:clamp(19px,5.2vw,29px);line-height:1.58}.moon{right:8%;top:10%}.hint{bottom:4%;max-width:90vw;text-align:center;white-space:normal}.finalName{white-space:normal;width:92vw}.shoot:before{width:125px}}
</style></head><body>
<section class="screen intro" id="intro"><img class="photo" src="https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" onerror="this.src='https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'" alt="Zwe Htet Myat"><div class="cakeWrap"><div class="cake"><div class="plate"></div><div class="tier bottom"><div class="icing"></div><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i><i class="drip d4"></i><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div><div class="tier top"><div class="icing"></div><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i><i class="berry b4"></i><i class="berry b5"></i></div><button class="candle c1"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span><span class="smoke"></span></button></div></div><div class="hint" id="hint">🎂 ဖယောင်းတိုင်လေးတစ်ချောင်းကို နှိပ်ပြီး မှော်ခရီးလေးကို စလိုက်ပါ ✨</div></section>
<section class="screen sky" id="sky"><div class="stars"></div><div class="moon"></div><div class="fx" id="fx"></div><div class="bird bA"></div><div class="bird bB"></div><div class="bird bC"></div><div class="story" id="story"></div><div class="final" id="final"><div class="ring"></div><div class="finalName">Zwe Htet Myat ❤️</div></div><button class="replay" id="replay">မှော်ကမ္ဘာလေးကို ပြန်စမယ် ✨</button></section>
<audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
const intro=document.getElementById('intro'),sky=document.getElementById('sky'),hint=document.getElementById('hint'),story=document.getElementById('story'),fx=document.getElementById('fx'),finale=document.getElementById('final'),replay=document.getElementById('replay'),song=document.getElementById('song');let started=false,ctx;
function audioOn(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function tone(f,d=.2,g=.035,type='sine',delay=0){if(!ctx)return;const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.0001,ctx.currentTime+delay);a.gain.exponentialRampToValueAtTime(g,ctx.currentTime+delay+.025);a.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+d);o.connect(a).connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+d+.03)}
function chime(){audioOn();[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.55,.045,'sine',i*.08))}function whoosh(){audioOn();tone(170,.55,.022,'triangle');tone(80,.65,.014,'sine',.08)}function fanfare(){audioOn();[392,523,659,783,1046,1318].forEach((f,i)=>tone(f,.6,.035,'sine',i*.07))}
function text(t,hold=0){setTimeout(()=>{story.classList.remove('show');story.textContent=t;void story.offsetWidth;story.classList.add('show')},hold)}
function sparks(n=38){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='spark';e.style.left='50%';e.style.top='52%';e.style.setProperty('--x',((Math.random()-.5)*90)+'vw');e.style.setProperty('--y',((Math.random()-.5)*85)+'vh');e.style.animationDelay=(Math.random()*.7)+'s';fx.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function meteors(n=18){for(let i=0;i<n;i++)setTimeout(()=>{const e=document.createElement('i');e.className='shoot go';e.style.setProperty('--y',(8+Math.random()*72)+'vh');e.style.setProperty('--d',(8+Math.random()*18)+'vh');sky.appendChild(e);setTimeout(()=>e.remove(),1700)},i*260+Math.random()*350)}
function balloons(){for(let i=0;i<12;i++)setTimeout(()=>{const e=document.createElement('i');e.className='balloon go';e.style.left=(3+Math.random()*92)+'vw';e.style.bottom='-10vh';e.style.background=['#ff6f91','#ffd45c','#6fd3ff','#9b8cff','#7ee6a2'][i%5];sky.appendChild(e);setTimeout(()=>e.remove(),8500)},i*180)}
function gifts(){['🎁','🎈','🧸','🎀','⭐','💝'].forEach((x,i)=>setTimeout(()=>{const e=document.createElement('span');e.className='gift';e.textContent=x;e.style.left=(-8+i*8)+'vw';e.style.top=(48+Math.random()*25)+'vh';sky.appendChild(e);setTimeout(()=>e.remove(),5500)},i*180))}
function birds(){document.querySelectorAll('.bird').forEach((b,i)=>{b.classList.remove('show');void b.offsetWidth;b.style.animationDelay=(i*.7)+'s';b.classList.add('show')})}
function start(){if(started)return;started=true;audioOn();document.querySelectorAll('.flame').forEach(f=>f.style.display='none');document.querySelectorAll('.smoke').forEach(s=>s.classList.add('show'));hint.classList.add('hide');chime();sparks(55);setTimeout(()=>{intro.classList.add('hide');sky.classList.add('show')},850);text('🎂 ဖယောင်းတိုင်လေးကို မှုတ်ပြီး ဆုတောင်းလိုက်တဲ့အချိန်မှာ...');setTimeout(()=>{text('✨ ဆုတောင်းချက်လေးဟာ ကြယ်မှုန်လေးတစ်စင်းအဖြစ် ကောင်းကင်ပေါ်ကို ပျံတက်သွားတယ်...');whoosh();sparks(34)},6500);setTimeout(()=>{text('🐦 ပျော်ရွှင်မှုနဲ့ လက်ဆောင်လေးတွေကို ငှက်ကလေးတွေက Zwe Htet Myat အတွက် သယ်လာပြီ...');chime();birds();gifts()},14500);setTimeout(()=>{text('🌠 ဒီနေ့တော့ ကောင်းကင်ပေါ်က ကြယ်လေးတွေအားလုံးက မင်းရဲ့ဆုတောင်းချက်ကို ကြားနေကြပြီ... ✨');whoosh();meteors(24)},27500);setTimeout(()=>{text('🌙 လမင်းနဲ့ ကြယ်တွေက မင်းအတွက်ပဲ လင်းလက်နေကြတာပါ... မင်းရဲ့အိပ်မက်တွေ အမြဲတောက်ပပါစေ။');chime()},40000);setTimeout(()=>{story.classList.remove('show');finale.classList.add('show');fanfare();sparks(70);balloons();gifts()},48500);setTimeout(()=>{text('🎂 ပျော်ရွှင်ဖွယ် မွေးနေ့ပါ Zwe Htet Myat ❤️\n🌈 မင်းရဲ့နေ့ရက်တိုင်း ရယ်မောခြင်း၊ စွန့်စားခန်းအသစ်တွေနဲ့ ပျော်ရွှင်ခြင်းတွေနဲ့ ပြည့်နေပါစေ။ ✨',0);chime()},51500);setTimeout(()=>replay.classList.add('show'),57000);try{song.currentTime=0;song.volume=.22;song.play().catch(()=>{})}catch(e){}}
