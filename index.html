<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Zwe Htet Myat 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:#070b25}.scene{position:relative;width:100%;height:100svh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff9ef,#f7dfe4 45%,#e9cbd0)}.photo{position:absolute;z-index:1;top:5%;left:50%;transform:translateX(-50%);width:min(76vw,560px);height:min(76vw,560px);object-fit:cover;border-radius:50%;opacity:.74;filter:saturate(1.05) contrast(1.05);box-shadow:0 0 80px rgba(119,45,72,.25)}.cake-wrap{z-index:4;position:relative;width:min(520px,92vw);display:flex;justify-content:center;filter:drop-shadow(0 24px 24px rgba(87,34,52,.22))}.cake{position:relative;width:min(390px,76vw);height:min(250px,47vw);min-height:190px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:27px;border-radius:50%;background:linear-gradient(#fff,#ead6dc)}.tier{position:absolute;border:3px solid rgba(146,60,79,.14)}.bottom{left:6%;bottom:22px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(#fff4f0,#f7c8cc 65%,#e8a6b0)}.top{left:14%;bottom:106px;width:72%;height:73px;border-radius:17px 17px 23px 23px;background:linear-gradient(#fff8f2,#f3b9c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:28px;border-radius:18px;background:#fffaf5}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.d1{left:17%}.d2{left:39%;height:38px}.d3{left:67%;height:31px}.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px rgba(255,255,255,.55)}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);cursor:pointer;z-index:8}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%)}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px rgba(255,180,50,.38),0 0 38px 10px rgba(255,124,71,.18);animation:flicker .13s infinite alternate}.flame:after{content:'';position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%}.hint{position:absolute;z-index:6;bottom:7%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vw,19px);color:#713448;background:rgba(255,255,255,.62);padding:10px 18px;border-radius:999px;white-space:nowrap;transition:.5s}.hint.hide{opacity:0}.page2{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 55%,#18245e 0,#070b25 58%,#02030d 100%);opacity:0;visibility:hidden;overflow:hidden}.page2.show{opacity:1;visibility:visible}.star{position:absolute;width:7px;height:7px;background:#fff5b5;border-radius:50%;box-shadow:0 0 15px 5px #ffe87b;opacity:0}.star.go{animation:starOut 3.2s cubic-bezier(.1,.7,.15,1) forwards}.fw{position:absolute;width:4px;height:4px;border-radius:50%;opacity:0}.fw.show{animation:fwPop 2.5s ease-out forwards}.fw i{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px 3px currentColor}.bird{position:absolute;z-index:8;font-size:clamp(28px,6vw,58px);opacity:0}.bird.fly{animation:birdFly 4.5s ease-in-out forwards}.sky{position:absolute;inset:0;opacity:0;z-index:10}.sky.show{animation:skyIn 3.5s ease forwards}.sun{position:absolute;left:10%;top:12%;width:clamp(58px,10vw,105px);height:clamp(58px,10vw,105px);border-radius:50%;background:#ffd84d;box-shadow:0 0 35px 12px #ffd45a66,0 0 80px 20px #ffb32e33;animation:sunFloat 3s ease-in-out infinite alternate}.moon{position:absolute;right:12%;top:15%;width:clamp(52px,9vw,92px);height:clamp(52px,9vw,92px);border-radius:50%;background:#fff9d7;box-shadow:0 0 30px 9px #fff8d955}.moon:after{content:'';position:absolute;right:-13px;top:-5px;width:100%;height:100%;border-radius:50%;background:#0a0f32}.tw{position:absolute;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 12px 4px white;animation:twinkle 1.2s ease-in-out infinite alternate}.message{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;text-align:center}.message.show{animation:messageIn 3.5s cubic-bezier(.2,.8,.2,1) forwards}.title{margin:0;color:white;font-size:clamp(34px,8vw,92px);line-height:.95;letter-spacing:2px;text-shadow:0 0 35px #ffd86a99}.name{display:block;margin-top:16px;color:#ffe7a1;font-size:clamp(25px,5vw,56px);letter-spacing:3px}.restart{position:absolute;z-index:40;bottom:4%;left:50%;transform:translateX(-50%);border:0;background:#ffffff22;color:white;padding:10px 18px;border-radius:999px;opacity:0}.restart.show{opacity:1}
@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94)}to{transform:translateX(-50%) rotate(48deg) scale(1.06)}}@keyframes starOut{0%{opacity:0;transform:translate(0,0) scale(.1) rotate(0)}8%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(540deg)}}@keyframes fwPop{0%{opacity:0;transform:scale(.1)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:scale(1.4)}}@keyframes birdFly{0%{opacity:0;transform:translate(-10vw,20vh) scale(.6)}12%{opacity:1}50%{transform:translate(45vw,-5vh) scale(1)}100%{opacity:0;transform:translate(120vw,-18vh) scale(.9)}}@keyframes skyIn{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}@keyframes sunFloat{from{transform:translateY(0)}to{transform:translateY(12px)}}@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}@keyframes messageIn{0%{opacity:0;transform:scale(.45);filter:blur(14px)}35%{opacity:.18;transform:scale(.68);filter:blur(8px)}70%{opacity:.7;transform:scale(1.04);filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@media(max-width:600px){.photo{width:86vw;height:86vw}.cake-wrap{transform:scale(.94)}.candle{width:15px;height:61px}.flame{top:-39px;width:19px;height:30px}.hint{bottom:8%}}
</style>
</head>
<body>
<main class="scene" id="scene">
<img class="photo" src="https://drive.google.com/uc?export=view&id=1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Birthday memory" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ'">
<div class="cake-wrap" id="cakeWrap"><div class="cake">
<div class="tier bottom"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div>
<div class="tier top"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><i class="berry b4"></i><i class="berry b5"></i></div>
<button class="candle c1"><span class="wick"></span><span class="flame"></span></button><button class="candle c2"><span class="wick"></span><span class="flame"></span></button><button class="candle c3"><span class="wick"></span><span class="flame"></span></button><button class="candle c4"><span class="wick"></span><span class="flame"></span></button><button class="candle c5"><span class="wick"></span><span class="flame"></span></button><button class="candle c6"><span class="wick"></span><span class="flame"></span></button><button class="candle c7"><span class="wick"></span><span class="flame"></span></button><div class="plate"></div></div></div>
<div class="hint" id="hint">🎂 မီးလေးတစ်ခုခုကို နှိပ်ပါ</div>
<div class="page2" id="page2"><div class="sky" id="sky"><div class="sun"></div><div class="moon"></div></div></div>
<div class="message" id="message"><h1 class="title">Happy Birthday<span class="name">Zwe Htet Myat ❤️</span></h1></div>
<button class="restart" id="restart">Replay ✨</button>
</main>
<script>
const scene=document.getElementById('scene'),page2=document.getElementById('page2'),sky=document.getElementById('sky'),message=document.getElementById('message'),hint=document.getElementById('hint'),cakeWrap=document.getElementById('cakeWrap'),candles=[...document.querySelectorAll('.candle')],restart=document.getElementById('restart');let done=false;
const birthdaySong=new Audio('https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8');birthdaySong.preload='auto';birthdaySong.volume=1;
function playSong(){try{birthdaySong.currentTime=0;let p=birthdaySong.play();if(p)p.catch(()=>{})}catch(e){}}
function stars(){let count=innerWidth<600?145:230;for(let i=0;i<count;i++){let s=document.createElement('i');s.className='star go';let a=Math.random()*Math.PI*2,d=Math.min(innerWidth,innerHeight)*(.25+Math.random()*1.05);s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*.7+'s';let z=3+Math.random()*8;s.style.width=z+'px';s.style.height=z+'px';page2.appendChild(s);setTimeout(()=>s.remove(),4300)}}
function firework(x,y,delay){setTimeout(()=>{let f=document.createElement('div');f.className='fw show';f.style.left=x+'%';f.style.top=y+'%';f.style.color=['#ffd84d','#ff7198','#70e6ff','#b997ff','#fff'][Math.floor(Math.random()*5)];for(let i=0;i<28;i++){let p=document.createElement('i'),a=i*Math.PI*2/28,r=25+Math.random()*95;p.style.left=Math.cos(a)*r+'px';p.style.top=Math.sin(a)*r+'px';f.appendChild(p)}page2.appendChild(f);setTimeout(()=>f.remove(),3000)},delay)}
function fireworks(){firework(22,28,0);firework(73,25,900);firework(50,48,1800);firework(30,55,2900);firework(78,55,4000);firework(50,20,5100)}
function birds(){for(let i=0;i<4;i++)setTimeout(()=>{let b=document.createElement('div');b.className='bird fly';b.textContent=i%2?'🕊️':'🐦';b.style.top=(35+Math.random()*35)+'%';b.style.animationDelay=(Math.random()*.5)+'s';page2.appendChild(b);setTimeout(()=>b.remove(),5500)},i*1100)}
function skyStars(){for(let i=0;i<34;i++){let s=document.createElement('i');s.className='tw';s.style.left=(5+Math.random()*90)+'%';s.style.top=(5+Math.random()*75)+'%';s.style.animationDelay=Math.random()*2+'s';sky.appendChild(s)}}
function celebrate(){if(done)return;done=true;playSong();candles.forEach(c=>{c.disabled=true;c.querySelector('.flame').style.display='none'});cakeWrap.style.transition='1.5s';cakeWrap.style.transform='scale(.82) translateY(20px)';hint.classList.add('hide');setTimeout(()=>{page2.classList.add('show');stars()},700);setTimeout(fireworks,2800);setTimeout(birds,8000);setTimeout(()=>{skyStars();sky.classList.add('show')},14500);setTimeout(()=>message.classList.add('show'),19500);setTimeout(()=>restart.classList.add('show'),24000)}
candles.forEach(c=>{c.addEventListener('click',celebrate);c.addEventListener('touchend',e=>{e.preventDefault();celebrate()},{passive:false})});restart.onclick=()=>location.reload();
</script>
</body>
</html>
