<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Zwe Htet Myat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030513}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}</style></head><body><canvas id="c"></canvas><audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio><script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false,desynchronized:true}),song=document.getElementById('song');const TAU=Math.PI*2;let W=0,H=0,started=false,t0=0,last=0,D=1,quality=1,avg=16,flash=0,shake=0,beat=0,AC=null,music=null;const photo=new Image();photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';const stars=[],dust=[],sparks=[],rockets=[],meteors=[],birds=[],rings=[],petals=[];const cols=['#ff3cac','#ffd34e','#39e7ff','#9b6cff','#62f57a','#ff6b72','#ffffff'];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.25);C.width=Math.floor(W*D);C.height=Math.floor(H*D);X.setTransform(D,0,0,D,0,0);stars.length=0;dust.length=0;const n=W*H<450000?55:85;for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.75,r:.35+Math.random()*1.15,p:Math.random()*TAU});for(let i=0;i<35;i++)dust.push({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.4,a:Math.random()*TAU})}addEventListener('resize',resize,{passive:true});resize();
function startAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();if(!music)makeMusic()}catch(e){}}function tone(f,d=.16,g=.025,type='sine'){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}function makeMusic(){if(!AC)return;const gain=AC.createGain();gain.gain.value=.018;gain.connect(AC.destination);music={gain,next:0};const seq=[261.63,329.63,392,523.25,392,329.63,293.66,349.23];music.timer=setInterval(()=>{if(!started||!AC)return;const f=seq[(Math.floor(performance.now()/900))%seq.length];const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.0001,AC.currentTime);v.gain.exponentialRampToValueAtTime(.035,AC.currentTime+.05);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.75);o.connect(v).connect(gain);o.start();o.stop(AC.currentTime+.8)},900)}
function bg(t,night=true){X.fillStyle=night?'#050819':'#fff1f7';X.fillRect(0,0,W,H);if(night){const g=X.createRadialGradient(W*.5,H*.35,0,W*.5,H*.55,Math.max(W,H)*.9);g.addColorStop(0,'#263b8d');g.addColorStop(.45,'#11194c');g.addColorStop(1,'#01020a');X.fillStyle=g;X.fillRect(0,0,W,H);for(const s of stars){X.globalAlpha=.25+.55*(.5+.5*Math.sin(t*.0015+s.p));X.fillStyle='#fff6d5';X.fillRect(s.x,s.y,s.r,s.r)}X.globalAlpha=1;for(const d of dust){d.y-=d.v;if(d.y<-5)d.y=H+5;X.globalAlpha=.12;X.fillStyle='#fff';X.fillRect(d.x,d.y,1,1)}X.globalAlpha=1}}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');X.globalAlpha=a;X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);X.globalAlpha=1}
function addSpark(x,y,vx,vy,c,life=1,g=.035,size=1){if(sparks.length>Math.floor(520*quality))return;sparks.push({x,y,px:x,py:y,vx,vy,c,life,g,size})}
function burst(x=W/2,y=H*.45,n=70){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=2.5+Math.random()*6;addSpark(x,y,Math.cos(a)*v,Math.sin(a)*v,cols[i%cols.length],1,.035,1.3)}flash=.12;shake=3;beat=1;tone(620,.12,.02);setTimeout(()=>tone(880,.14,.014),70)}
function firework(){if(rockets.length>=5)return;const x=W*(.12+Math.random()*.76),ty=H*(.12+Math.random()*.38),c=cols[(Math.random()*cols.length)|0];rockets.push({x,y:H+20,ty,vy:-9.5-Math.random()*2.5,c,trail:[]});tone(240,.08,.008)}
function explode(r){const n=quality>.7?65+((Math.random()*30)|0):45;for(let i=0;i<n;i++){const a=TAU*i/n+Math.random()*.1,v=2.8+Math.random()*5;addSpark(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,r.c,1,.04,1.6)}for(let i=0;i<12;i++){const a=Math.random()*TAU,v=1.5+Math.random()*2.5;addSpark(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,'#fff',.8,.02,2)}rings.push({x:r.x,y:r.ty,r:7,a:1,c:r.c});flash=Math.min(1,flash+.32);shake=Math.min(10,shake+5);beat=1;tone(72,.22,.035);setTimeout(()=>tone(110,.13,.018),65)}
function meteor(){if(meteors.length>3)return;const a=.62+Math.random()*.16;meteors.push({x:Math.random()*W*.8-W*.1,y:Math.random()*H*.35,vx:Math.cos(a)*(10+Math.random()*5),vy:Math.sin(a)*(10+Math.random()*5),life:1,len:8+Math.random()*5})}
function bird(){if(birds.length>4)return;birds.push({x:-60,y:H*(.25+Math.random()*.34),s:.42+Math.random()*.35,v:2.1+Math.random()*1.4,p:Math.random()*TAU})}
function petal(){if(petals.length>35)return;petals.push({x:Math.random()*W,y:-20,s:4+Math.random()*7,v:1+Math.random()*1.2,r:Math.random()*TAU,vr:-.02+Math.random()*.04,a:Math.random()*TAU})}
function update(dt){const k=dt/16.67;flash*=Math.pow(.8,k);shake*=Math.pow(.8,k);beat*=Math.pow(.9,k);for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>6)r.trail.shift();r.y+=r.vy*k;r.vy+=.09*k;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.px=p.x;p.py=p.y;p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.987,k);p.vy=p.vy*Math.pow(.987,k)+p.g*k;p.life-=.021*k;if(p.life<=0)sparks.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=10*k;q.a-=.035*k;if(q.a<=0)rings.splice(i,1)}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*k;m.y+=m.vy*k;m.life-=.015*k;if(m.life<=0||m.x>W+100||m.y>H+100)meteors.splice(i,1)}for(let i=birds.length-1;i>=0;i--){const b=birds[i];b.x+=b.v*k;b.y+=Math.sin(b.x*.01+b.p)*.2*k;if(b.x>W+100)birds.splice(i,1)}for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.y+=p.v*k;p.x+=Math.sin(p.y*.018+p.a)*.5*k;p.r+=p.vr*k;if(p.y>H+30)petals.splice(i,1)}}
function drawEffects(t){X.save();X.globalCompositeOperation='lighter';for(const m of meteors){X.strokeStyle='rgba(190,230,255,.8)';X.lineWidth=2;X.beginPath();X.moveTo(m.x-m.vx*m.len,m.y-m.vy*m.len);X.lineTo(m.x,m.y);X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(m.x,m.y,2.5,0,TAU);X.fill()}for(const r of rockets){X.strokeStyle=r.c;X.globalAlpha=.35;X.lineWidth=2.5;X.beginPath();r.trail.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.globalAlpha=1;X.fillStyle='#fff';X.beginPath();X.arc(r.x,r.y,3,0,TAU);X.fill()}for(const q of rings){X.globalAlpha=q.a*.5;X.strokeStyle=q.c;X.lineWidth=2;X.beginPath();X.arc(q.x,q.y,q.r,0,TAU);X.stroke()}for(const p of sparks){X.globalAlpha=p.life;X.strokeStyle=p.c;X.lineWidth=p.size;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size*.7,0,TAU);X.fill()}X.restore();X.globalAlpha=1;for(const b of birds){const f=Math.sin(t*.012+b.p),x=b.x,y=b.y,s=b.s;X.save();X.translate(x,y);X.scale(s,s);X.fillStyle='#fff';X.shadowColor='#73e7ff';X.shadowBlur=5;X.beginPath();X.moveTo(0,5);X.quadraticCurveTo(-24,-13-f*11,-43,-3-f*6);X.quadraticCurveTo(-24,10,0,8);X.quadraticCurveTo(24,10,43,-3+f*6);X.quadraticCurveTo(24,-13+f*11,0,5);X.fill();X.restore()}for(const p of petals){X.save();X.translate(p.x,p.y);X.rotate(p.r);X.globalAlpha=.7;X.fillStyle=['#ff8fc7','#ffd2e8','#fff0a0'][Math.floor(p.a*3)%3];X.beginPath();X.ellipse(0,0,p.s*.45,p.s,0,0,TAU);X.fill();X.restore()}X.globalAlpha=1}
function candleCake(t){const cx=W/2,baseY=H*.68,cw=Math.min(W*.62,440),ch=Math.min(H*.15,90);X.save();X.shadowColor='rgba(255,110,170,.25)';X.shadowBlur=30;X.fillStyle='#e89ab8';X.beginPath();X.roundRect(cx-cw/2,baseY,cw,ch,22);X.fill();X.shadowBlur=0;X.fillStyle='#fff8f1';X.beginPath();X.roundRect(cx-cw*.43,baseY-ch*.18,cw*.86,ch*.3,18);X.fill();for(let i=0;i<7;i++){const x=cx-cw*.36+i*cw*.12;X.fillStyle=i%2?'#ff8cb7':'#ffd86a';X.beginPath();X.roundRect(x-4,baseY-ch*.48,8,ch*.32,4);X.fill();const sway=Math.sin(t*7+i)*3,fy=baseY-ch*.63;glow(x+sway,fy,18,'rgba(255,170,55,.22)',1);X.fillStyle='#ff9b35';X.beginPath();X.ellipse(x+sway,fy,5,10+Math.sin(t*9+i)*2,0,0,TAU);X.fill();X.fillStyle='#fff8a8';X.beginPath();X.ellipse(x+sway,fy+2,2.3,5,0,0,TAU);X.fill()}X.restore()}
function intro(t){X.fillStyle='#fff4f8';X.fillRect(0,0,W,H);const cx=W/2,s=Math.min(W*.58,H*.34,390),py=H*.27;glow(cx,py,s*.8,'rgba(255,120,190,.22)',1);if(photo.complete){X.save();X.beginPath();X.arc(cx,py,s*.42,0,TAU);X.clip();X.drawImage(photo,cx-s*.42,py-s*.42,s*.84,s*.84);X.restore();X.strokeStyle='#fff';X.lineWidth=6;X.beginPath();X.arc(cx,py,s*.42,0,TAU);X.stroke()}candleCake(t);X.textAlign='center';X.fillStyle='#6c2d4d';X.font='700 '+Math.max(22,Math.min(38,W*.045))+'px "Noto Sans Myanmar",sans-serif';X.fillText('Happy Birthday',cx,H*.12);X.fillStyle='#b14d78';X.font='500 '+Math.max(17,Math.min(26,W*.026))+'px "Noto Sans Myanmar",sans-serif';X.fillText('Zwe Htet Myat',cx,H*.19);X.globalAlpha=.8+.2*Math.sin(t*4);X.fillStyle='#71304b';X.font='600 '+Math.max(15,Math.min(21,W*.022))+'px "Noto Sans Myanmar",sans-serif';X.fillText('🕯️ ဖယောင်းတိုင်ကို နှိပ်ပြီး စတင်လိုက်ပါ',cx,H*.91);X.globalAlpha=1}
function title(a,b,y=.52){X.textAlign='center';X.shadowColor='rgba(0,0,0,.65)';X.shadowBlur=12;X.globalAlpha=.98;X.fillStyle='#fff';X.font='700 '+Math.max(20,Math.min(40,W*.042))+'px "Noto Sans Myanmar",sans-serif';X.fillText(a,W/2,H*y);if(b){X.fillStyle='#ffe9a5';X.font='400 '+Math.max(14,Math.min(21,W*.021))+'px "Noto Sans Myanmar",sans-serif';X.fillText(b,W/2,H*(y+.08))}X.shadowBlur=0;X.globalAlpha=1}
function moon(t){const r=Math.min(W,H)*.075,x=W*.82,y=H*.2;glow(x,y,r*2.4,'rgba(255,239,150,.15)',1);X.fillStyle='#fff3c5';X.beginPath();X.arc(x,y,r,0,TAU);X.fill();X.fillStyle='#111847';X.beginPath();X.arc(x+r*.42,y-r*.2,r*.9,0,TAU);X.fill();for(let i=0;i<4;i++){X.globalAlpha=.5;X.fillStyle='#fff0a0';X.beginPath();X.arc(x-r*.3+i*r*.18,y+r*.15+Math.sin(t+i)*3,r*.04,0,TAU);X.fill()}X.globalAlpha=1}
function finale(t){const a=Math.min(1,(t-78)/3);X.textAlign='center';X.shadowColor='#ffd45e';X.shadowBlur=22;X.fillStyle='#fff6d5';X.font='700 '+Math.min(76,W*.085)+'px Georgia';X.fillText('Happy Birthday',W/2,H*.38);X.fillStyle='#ffd978';X.font='700 '+Math.min(52,W*.058)+'px Georgia';X.fillText('Zwe Htet Myat ❤️',W/2,H*.49);X.globalAlpha=a;X.shadowBlur=8;X.fillStyle='#fffaf0';X.font='400 '+Math.max(15,Math.min(23,W*.022))+'px "Noto Sans Myanmar"';X.fillText('မင်းရဲ့နေ့ရက်တိုင်း ပျော်ရွှင်မှုတွေနဲ့ တောက်ပနေပါစေ ✨',W/2,H*.61);X.globalAlpha=1}
function loop(now){const raw=last?now-last:16.67,dt=Math.min(32,raw);last=now;avg=avg*.95+raw*.05;if(avg>25)quality=Math.max(.5,quality-.01);else if(avg<18)quality=Math.min(1,quality+.004);const t=started?(now-t0)/1000:0;if(!started){intro(0);requestAnimationFrame(loop);return}update(dt);const sx=(Math.random()-.5)*shake*quality,sy=(Math.random()-.5)*shake*quality;X.save();X.translate(sx,sy);const phase=t<8?0:t<16?1:t<26?2:t<36?3:t<46?4:t<62?5:t<74?6:7;if(phase===0){intro(t);if(t>3)for(let i=0;i<2;i++)petal()}else{bg(now,true);if(phase===1){candleCake(t);title('🕯️ ဆုတောင်းလေးတစ်ခု ပြုပါ','ဖယောင်းတိုင်မီးလေးတွေ မင်းအတွက် တောက်ပနေတယ်',.42);if(Math.random()<.03)burst(W/2,H*.5,35)}else if(phase===2){title('✨ ကြယ်တွေက စတင်လင်းလာပြီ','မင်းရဲ့ဆုတောင်းတွေ ကောင်းကင်ထဲ ပျံ့နှံ့နေတယ်',.55);if(Math.random()<.035*quality)petal()}else if(phase===3){moon(t);title('🌙 လရောင်အောက်က အမှတ်တရ','ဒီညက အေးချမ်းပြီး လှပနေတယ်',.62)}else if(phase===4){title('🌠 ဆုတောင်းတွေ ကောင်းကင်ကို ဖြတ်သန်းလာပြီ','ကြယ်ကြွေတွေ တစ်စင်းပြီးတစ်စင်း…',.55);if(Math.random()<.055*quality)meteor()}else if(phase===5){title('🎆 ဒီကောင်းကင်တစ်ခုလုံး မင်းအတွက်','အရောင်စုံမီးရူးမီးပန်းတွေ စတင်ပေါက်ကွဲလာပြီ',.55);if(Math.random()<.032*quality)firework();if(Math.random()<.012)petal()}else if(phase===6){title('🕊️ ပျော်ရွှင်ခြင်းတွေ မင်းဆီ ပျံလာပြီ','ကောင်းမွန်တဲ့နေ့ရက်တွေ အမြဲရှိနေပါစေ',.54);if(Math.random()<.022*quality)bird();if(Math.random()<.012)petal()}else{moon(t);finale(t);if(Math.random()<.04*quality)firework()}drawEffects(now)}X.restore();if(flash>.005){X.fillStyle='rgba(255,255,255,'+Math.min(.42,flash*.55)+')';X.fillRect(0,0,W,H)}if(t>88){started=false;sparks.length=rockets.length=meteors.length=birds.length=rings.length=petals.length=0}requestAnimationFrame(loop)}
C.addEventListener('pointerdown',()=>{if(started)return;startAudio();started=true;t0=performance.now();last=t0;sparks.length=rockets.length=meteors.length=birds.length=rings.length=petals.length=0;song.currentTime=0;const p=song.play();if(p&&p.catch)p.catch(()=>{});tone(523,.2,.04);setTimeout(()=>tone(659,.2,.03),180);setTimeout(()=>tone(784,.35,.025),360);burst(W/2,H*.5,90)});song.addEventListener('error',()=>{startAudio()});requestAnimationFrame(loop);
