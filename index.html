<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Zwe Htet Myat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030516}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;cursor:pointer}#hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 22px;border-radius:30px;background:rgba(255,255,255,.9);color:#7c3157;font-weight:700;letter-spacing:.2px;box-shadow:0 8px 30px rgba(0,0,0,.15);pointer-events:none;transition:opacity .5s}@media(max-width:899px){#hint:after{content:'  ဒီ version က PC အတွက် အထူးပြုလုပ်ထားပါတယ်';font-size:12px}}</style></head><body><canvas id="c"></canvas><div id="hint">🖱️ နှိပ်ပြီး မွေးနေ့ပွဲ စလိုက်ရအောင်!</div><audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio><script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false}),song=document.getElementById('song'),hint=document.getElementById('hint');const TAU=Math.PI*2;let W=0,H=0,D=1,started=false,t0=0,last=0,shake=0,flash=0,AC=null;const photo=new Image();photo.decoding='async';photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';const stars=[],balloons=[],particles=[],rockets=[],toys=[],confetti=[];const COLORS=['#ff4fa3','#ffd84d','#43e8ff','#a36cff','#68ef85','#ff6b6b','#ffffff','#ff9b42'];
function resize(){D=1;W=innerWidth;H=innerHeight;C.width=W;C.height=H;X.setTransform(1,0,0,1,0,0);stars.length=0;for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.72,r:.5+Math.random()*1.2,a:Math.random()*TAU})};addEventListener('resize',resize);resize();
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d=.12,g=.025,type='sine'){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,n);v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v).connect(AC.destination);o.start(n);o.stop(n+d+.02)}
function boom(power=1){if(!AC)return;const n=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(92,n);o.frequency.exponentialRampToValueAtTime(30,n+.5);f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16*power,n+.025);g.gain.exponentialRampToValueAtTime(.0001,n+.62);o.connect(f).connect(g).connect(AC.destination);o.start(n);o.stop(n+.65);tone(520,.07,.025,'triangle')}
function popSound(){tone(180,.08,.018,'triangle');setTimeout(()=>tone(760,.12,.018),35)}
function musicStart(){try{song.currentTime=0;song.volume=.8;const p=song.play();if(p)p.catch(()=>{})}catch(e){}}
function makeBalloons(){balloons.length=0;for(let i=0;i<10;i++)balloons.push({x:W*(.04+i*.102),y:H+60+Math.random()*160,s:.72+Math.random()*.3,c:COLORS[i%COLORS.length],v:.18+Math.random()*.16,phase:Math.random()*TAU})}
function addParticle(x,y,vx,vy,c,life=1,size=2){if(particles.length>520)return;particles.push({x,y,px:x,py:y,vx,vy,c,life,size})}
function confettiBurst(n=90){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=2+Math.random()*5;confetti.push({x:W/2,y:H*.46,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,c:COLORS[i%COLORS.length],life:1,r:3+Math.random()*3})}}
function drawBackground(t){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101a58');g.addColorStop(.5,'#152b73');g.addColorStop(1,'#030516');X.fillStyle=g;X.fillRect(0,0,W,H);for(const s of stars){X.globalAlpha=.22+.45*(.5+.5*Math.sin(t*1.5+s.a));X.fillStyle='#fff9df';X.fillRect(s.x,s.y,s.r,s.r)}X.globalAlpha=1}
function flame(x,y,s,t){const lean=Math.sin(t*7+x*.01)*2.5,p=1+.12*Math.sin(t*11+x);X.save();X.translate(x+lean,y);X.scale(p,.95+.08*Math.sin(t*15+x));X.shadowColor='#ff9f28';X.shadowBlur=10;X.fillStyle='#ff8a24';X.beginPath();X.moveTo(0,-s*1.8);X.bezierCurveTo(s*.9,-s*.6,s*.75,s*.55,0,s);X.bezierCurveTo(-s*.75,s*.55,-s*.8,-s*.6,0,-s*1.8);X.fill();X.shadowBlur=0;X.fillStyle='#fff6a5';X.beginPath();X.ellipse(0,s*.22,s*.25,s*.55,0,0,TAU);X.fill();X.restore()}
function drawBalloon(b,t){b.y-=b.v;const x=b.x+Math.sin(t*.7+b.phase)*12;X.save();X.translate(x,b.y);X.fillStyle=b.c;X.beginPath();X.ellipse(0,0,25*b.s,33*b.s,0,0,TAU);X.fill();X.fillStyle='rgba(255,255,255,.55)';X.beginPath();X.ellipse(-8*b.s,-11*b.s,5*b.s,9*b.s,0,0,TAU);X.fill();X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=1;X.beginPath();X.moveTo(0,31*b.s);X.lineTo(0,105*b.s);X.stroke();X.restore();if(b.y<-130){b.y=H+70;b.x=Math.random()*W}}
function drawPhoto(t){const pw=Math.min(W*.31,430),ph=pw*.86,px=W/2-pw/2,py=H*.12;X.save();X.shadowColor='rgba(255,190,220,.4)';X.shadowBlur=28;X.fillStyle='#fff';X.beginPath();X.roundRect(px-9,py-9,pw+18,ph+18,28);X.fill();X.shadowBlur=0;if(photo.complete&&photo.naturalWidth){X.save();X.beginPath();X.roundRect(px,py,pw,ph,22);X.clip();X.drawImage(photo,px,py,pw,ph);X.restore()}X.strokeStyle='#ffd0e2';X.lineWidth=4;X.beginPath();X.roundRect(px,py,pw,ph,22);X.stroke();X.restore();return{cx:W/2,py,ph}}
function drawCake(t){const w=Math.min(W*.38,500),y=H*.72,x=W/2;X.fillStyle='#e994b6';X.beginPath();X.roundRect(x-w/2,y,w,82,20);X.fill();X.fillStyle='#fff7ef';X.beginPath();X.roundRect(x-w*.43,y-13,w*.86,31,15);X.fill();for(let i=0;i<7;i++){const cx=x-w*.36+i*w*.12;X.fillStyle='#ffd45b';X.fillRect(cx-4,y-27,8,14);flame(cx,y-39,7,t+i*.23)}}
function intro(t){X.fillStyle='#fff4f9';X.fillRect(0,0,W,H);for(const b of balloons)drawBalloon(b,t);const p=drawPhoto(t);X.textAlign='center';X.fillStyle='#8b315f';X.font='800 '+Math.min(52,W*.043)+'px Georgia';X.fillText('Happy Birthday!',W/2,H*.58);X.fillStyle='#d34d87';X.font='800 '+Math.min(40,W*.033)+'px Georgia';X.fillText('Zwe Htet Myat',W/2,H*.65);drawCake(t);X.fillStyle='#71304b';X.font='700 22px "Noto Sans Myanmar"';X.fillText('ပျော်ရွှင်စရာ မွေးနေ့ပွဲလေး စလိုက်ရအောင် 🎉',W/2,H*.91)}
function launch(){if(rockets.length>=4)return;const x=W*(.06+Math.random()*.88),ty=H*(.09+Math.random()*.42);rockets.push({x,y:H+25,ty,vy:-8.8-Math.random()*1.8,c:COLORS[(Math.random()*COLORS.length)|0],trail:[]});tone(150,.12,.012,'sawtooth')}
function explode(r){const n=70+((Math.random()*30)|0);for(let i=0;i<n;i++){const a=TAU*i/n+Math.random()*.12,v=2.8+Math.random()*4.8;addParticle(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,r.c,1.25,1.5+Math.random()*1.4)}for(let i=0;i<18;i++){const a=Math.random()*TAU,v=1.2+Math.random()*2.4;addParticle(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,'#fff',.8,2)}const type=['bear','star','heart','cat','balloon'][(Math.random()*5)|0];toys.push({x:r.x,y:r.ty,type,c:r.c,age:0,scale:.05,rot:(Math.random()-.5)*.08,life:1});boom(Math.random()>.65?1.2:1);flash=.28;shake=Math.min(10,shake+7)}
function drawToy(q){const s=48,appear=Math.min(1,q.age/.45),fade=q.age<1.7?1:Math.max(0,1-(q.age-1.7)/.8);X.save();X.translate(q.x,q.y);X.rotate(q.rot);X.scale(appear,appear);X.globalAlpha=fade;X.shadowColor=q.c;X.shadowBlur=16;X.fillStyle=q.c;X.strokeStyle='#fff';X.lineWidth=2.5;if(q.type==='star'){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s:s*.42,xx=Math.cos(a)*r,yy=Math.sin(a)*r;i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.closePath();X.fill();X.stroke()}else if(q.type==='heart'){X.beginPath();X.moveTo(0,s*.78);X.bezierCurveTo(-s*1.25,0,-s*.9,-s*.9,0,-s*.3);X.bezierCurveTo(s*.9,-s*.9,s*1.25,0,0,s*.78);X.fill();X.stroke()}else if(q.type==='bear'){X.beginPath();X.arc(-s*.5,-s*.65,s*.35,0,TAU);X.arc(s*.5,-s*.65,s*.35,0,TAU);X.fill();X.beginPath();X.arc(0,0,s*.8,0,TAU);X.fill();X.fillStyle='#fff0d8';X.beginPath();X.arc(0,s*.18,s*.3,0,TAU);X.fill();X.fillStyle='#42243a';X.beginPath();X.arc(-s*.27,-s*.08,s*.06,0,TAU);X.arc(s*.27,-s*.08,s*.06,0,TAU);X.arc(0,s*.13,s*.07,0,TAU);X.fill()}else if(q.type==='cat'){X.beginPath();X.moveTo(-s*.8,-s*.1);X.lineTo(-s*.7,-s*.88);X.lineTo(-s*.18,-s*.52);X.lineTo(s*.18,-s*.52);X.lineTo(s*.7,-s*.88);X.lineTo(s*.8,-s*.1);X.quadraticCurveTo(s*.85,s*.7,0,s*.78);X.quadraticCurveTo(-s*.85,s*.7,-s*.8,-s*.1);X.fill();X.fillStyle='#42243a';X.beginPath();X.arc(-s*.28,0,s*.06,0,TAU);X.arc(s*.28,0,s*.06,0,TAU);X.fill()}else{X.beginPath();X.arc(0,0,s*.68,0,TAU);X.fill();X.stroke();X.strokeStyle='#fff';X.beginPath();X.moveTo(0,-s*.68);X.lineTo(0,-s*1.08);X.stroke()}X.restore();X.globalAlpha=1}
function update(dt){const k=dt/16.67;shake*=Math.pow(.72,k);flash*=Math.pow(.78,k);for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>9)r.trail.shift();r.y+=r.vy*k;r.vy+=.095*k;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.986,k);p.vy+=.045*k;p.life-=.022*k;if(p.life<=0)particles.splice(i,1)}for(let i=toys.length-1;i>=0;i--){const q=toys[i];q.age+=dt/1000;q.y-=.18*k;q.rot+=Math.sin(q.age*5)*.001;if(q.age>2.6)toys.splice(i,1)}for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.08*k;p.life-=.015*k;if(p.life<=0)confetti.splice(i,1)}}
function effects(){X.save();X.globalCompositeOperation='lighter';for(const r of rockets){X.strokeStyle=r.c;X.globalAlpha=.55;X.lineWidth=3;X.beginPath();for(let i=0;i<r.trail.length;i++){const p=r.trail[i];i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1])}X.stroke()}for(const p of particles){X.globalAlpha=p.life;X.strokeStyle=p.c;X.lineWidth=p.size;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size,0,TAU);X.fill()}X.restore();for(const q of toys)drawToy(q);for(const p of confetti){X.globalAlpha=p.life;X.fillStyle=p.c;X.fillRect(p.x,p.y,p.r,p.r*2)}X.globalAlpha=1}
function message(main,sub){X.textAlign='center';X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=10;X.fillStyle='#fff';X.font='800 '+Math.min(46,W*.038)+'px "Noto Sans Myanmar"';X.fillText(main,W/2,H*.55);if(sub){X.fillStyle='#ffe7a0';X.font='600 '+Math.min(24,W*.02)+'px "Noto Sans Myanmar"';X.fillText(sub,W/2,H*.61)}X.shadowBlur=0}
function finalScene(t){X.textAlign='center';X.shadowColor='#ffd75c';X.shadowBlur=30;X.fillStyle='#fff8d8';X.font='800 '+Math.min(88,W*.075)+'px Georgia';X.fillText('Happy Birthday',W/2,H*.38);X.fillStyle='#ffd66d';X.font='800 '+Math.min(60,W*.052)+'px Georgia';X.fillText('Zwe Htet Myat',W/2,H*.5);X.shadowBlur=0;X.fillStyle='#fff';X.font='700 25px "Noto Sans Myanmar"';X.fillText('ပျော်ရွှင်ခြင်းတွေနဲ့ ပြည့်နေတဲ့ မွေးနေ့ဖြစ်ပါစေ 🎂',W/2,H*.61)}
function loop(now){const dt=Math.min(25,last?now-last:16.67);last=now;const t=started?(now-t0)/1000:0;if(!started){intro(now/1000);requestAnimationFrame(loop);return}update(dt);const phase=t<7?0:t<15?1:t<22?2:t<82?3:4;X.save();if(shake>.1)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBackground(now/1000);if(phase===0){message('ကြယ်လေးတွေ လင်းလာပြီ ✨','မွေးနေ့ပွဲလေး စတော့မယ်');if(Math.random()<.018)confettiBurst(25)}else if(phase===1){if(Math.random()<.035)launch();message('ပူဖောင်းလေးတွေ ပျံတက်လာပြီ 🎈','အရောင်စုံလေးတွေနဲ့ ပျော်ပွဲစကြမယ်')}else if(phase===2){if(Math.random()<.05)launch();message('မီးရူးမီးပန်းတွေ စတော့မယ် 🎆','ကောင်းကင်ကြီးကို အရောင်စုံလင်းစို့')}else if(phase===3){if(Math.random()<.075)launch()}else finalScene(t);effects();X.restore();if(flash>.01){X.fillStyle='rgba(255,255,255,'+Math.min(.35,flash)+')';X.fillRect(0,0,W,H)}if(t>88){started=false;particles.length=rockets.length=toys.length=confetti.length=0;hint.style.opacity='1'}requestAnimationFrame(loop)}
C.addEventListener('pointerdown',()=>{if(started)return;audio();musicStart();started=true;t0=performance.now();last=t0;hint.style.opacity='0';makeBalloons();popSound();confettiBurst(55);shake=2});
photo.addEventListener('load',()=>{if(!started)intro(performance.now()/1000)});requestAnimationFrame(loop);
</script></body></html>
