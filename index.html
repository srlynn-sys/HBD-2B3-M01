<!doctype html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Zwe Htet Myat 🎂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif;background:#050817;color:#fff}
button{font:inherit}.scene{position:relative;width:100%;height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 20%,#fff9ef 0,#f8dfe7 38%,#dcaab9 100%);display:grid;place-items:center}.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#1906113b 100%);pointer-events:none}
.photo{position:absolute;top:4%;left:50%;transform:translateX(-50%);width:min(72vw,560px);height:min(72vw,560px);object-fit:cover;border-radius:50%;opacity:.78;filter:saturate(1.08) contrast(1.06);box-shadow:0 0 90px #7b2b4c55,0 0 0 9px #ffffff28;transition:.8s}.intro{position:absolute;inset:0;display:grid;place-items:center;transition:opacity 1.1s,transform 1.1s;z-index:5}.intro.hide{opacity:0;transform:scale(1.08);pointer-events:none}.cake-wrap{position:relative;width:min(560px,94vw);height:min(390px,62vh);z-index:4;filter:drop-shadow(0 30px 35px #4b172f44)}
.cake{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(390px,72vw);height:250px}.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:112%;height:28px;border-radius:50%;background:linear-gradient(#fff,#e8d7df);box-shadow:0 7px 18px #6b29402d}.tier{position:absolute;border:3px solid #923c4f18}.bottom{left:6%;bottom:23px;width:88%;height:105px;border-radius:18px 18px 30px 30px;background:linear-gradient(#fff5f0,#f5c3ca 62%,#e7a1ad)}.top{left:14%;bottom:106px;width:72%;height:74px;border-radius:17px 17px 23px 23px;background:linear-gradient(#fff8f2,#f2b7c2)}.icing{position:absolute;left:0;right:0;top:-5px;height:29px;border-radius:18px;background:#fffaf5}.drip{position:absolute;top:13px;width:18px;height:28px;border-radius:0 0 12px 12px;background:#fffaf5}.d1{left:17%}.d2{left:39%;height:38px}.d3{left:67%;height:31px}.d4{left:84%;height:22px}.berry{position:absolute;width:13px;height:13px;border-radius:50%;background:#9d3c58;box-shadow:0 0 0 4px #ffffff8c}.b1{left:21%;top:44%}.b2{left:72%;top:62%}.b3{left:47%;top:70%}.b4{left:31%;top:18%}.b5{left:60%;top:30%}
.candle{position:absolute;bottom:172px;transform:translateX(-50%);width:18px;height:70px;border:0;border-radius:6px 6px 4px 4px;background:repeating-linear-gradient(135deg,#fff 0 7px,#eaa6b3 7px 14px);cursor:pointer;z-index:8}.c1{left:25%}.c2{left:33.3%}.c3{left:41.7%}.c4{left:50%}.c5{left:58.3%}.c6{left:66.7%}.c7{left:75%}.wick{position:absolute;left:50%;top:-11px;width:3px;height:12px;background:#4c3030;transform:translateX(-50%)}.flame{position:absolute;left:50%;top:-44px;width:22px;height:34px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff4a8,#ffb12b 58%,#ff6a3d);border-radius:50% 50% 50% 5%;box-shadow:0 0 18px 7px #ffb43261,0 0 38px 10px #ff7c472e;animation:flicker .13s infinite alternate}.flame::after{content:"";position:absolute;inset:7px;background:#fff8cf;border-radius:50% 50% 50% 8%}.smoke{position:absolute;left:50%;top:-52px;width:8px;height:8px;border-radius:50%;background:#fff9;opacity:0;transform:translateX(-50%);filter:blur(1px)}.smoke.show{animation:smokeRise 1.4s ease-out forwards}.hint{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);color:#713448;background:#ffffffb8;padding:11px 20px;border-radius:999px;white-space:nowrap;font-size:clamp(13px,1.6vw,18px);box-shadow:0 8px 30px #5c173326;z-index:9;transition:.5s}.hint.hide{opacity:0;transform:translate(-50%,10px)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,#17286e 0,#080d2b 48%,#02030d 100%);opacity:0;visibility:hidden;z-index:10;transition:opacity 1.6s}.sky.show{opacity:1;visibility:visible}.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2px) 0 0/83px 91px,radial-gradient(circle at 70% 35%,#fff8bd 0 1px,transparent 2px) 30px 20px/127px 113px;opacity:.65}.moon{position:absolute;right:10%;top:10%;width:clamp(62px,8vw,110px);height:clamp(62px,8vw,110px);border-radius:50%;background:#fff9d7;box-shadow:0 0 35px 10px #fff7b866;opacity:0;transform:scale(.5);transition:1.8s}.moon.show{opacity:1;transform:scale(1)}.moon::after{content:"";position:absolute;right:-14%;top:-5%;width:100%;height:100%;border-radius:50%;background:#080d2b}.story{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1050px,88vw);padding:22px;text-align:center;color:#fffdf2;font-size:clamp(20px,2.7vw,42px);line-height:1.65;letter-spacing:.2px;text-shadow:0 3px 25px #000,0 0 28px #fff7;opacity:0;filter:blur(8px);transition:opacity 1.2s,filter 1.2s}.story.show{opacity:1;filter:blur(0)}.final{position:absolute;z-index:50;inset:0;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.8s}.final.show{opacity:1}.final .inner{transform:translateY(25px) scale(.9);transition:1.8s}.final.show .inner{transform:none}.final h1{margin:0;font-family:Georgia,serif;font-size:clamp(42px,8vw,100px);line-height:1;color:#fff;text-shadow:0 0 22px #ffd76e,0 0 55px #ffb94d}.final .name{margin-top:20px;font-family:Georgia,serif;font-size:clamp(28px,5vw,62px);color:#ffe9a8;text-shadow:0 0 25px #fff}.final p{margin:20px auto 0;max-width:900px;padding:0 20px;font-size:clamp(16px,2vw,25px);line-height:1.8;color:#fffaf0}.replay{margin-top:28px;border:1px solid #ffffff55;background:#ffffff14;color:#fff;padding:12px 24px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);opacity:0;transition:.5s}.final.show .replay{opacity:1}.replay:hover{background:#ffffff28;transform:translateY(-2px)}
@keyframes flicker{from{transform:translateX(-50%) rotate(43deg) scale(.94)}to{transform:translateX(-50%) rotate(48deg) scale(1.06)}}@keyframes smokeRise{0%{opacity:.8;transform:translate(-50%,0) scale(.6)}45%{opacity:.5;transform:translate(-30%,-25px) scale(1.7)}100%{opacity:0;transform:translate(-80%,-60px) scale(2.8)}}
@media(min-width:1000px){.photo{width:430px;height:430px;top:3%}.cake-wrap{transform:translateY(5vh) scale(1.08)}.hint{bottom:4%}.story{width:min(1120px,78vw)}}
@media(max-width:600px){.photo{top:7%;width:78vw;height:78vw}.cake-wrap{height:350px}.cake{bottom:20px}.hint{max-width:92vw;text-align:center;white-space:normal}.story{font-size:19px;line-height:1.75;width:92vw;padding:12px}.moon{right:7%;top:8%}.final p{line-height:1.65}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <section class="intro" id="intro">
    <img class="photo" src="https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt="Zwe Htet Myat">
    <div class="cake-wrap">
      <div class="cake">
        <div class="plate"></div><div class="tier bottom"><div class="icing"><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i><i class="drip d4"></i></div><i class="berry b1"></i><i class="berry b2"></i><i class="berry b3"></i></div>
        <div class="tier top"><div class="icing"></div><i class="berry b4"></i><i class="berry b5"></i></div>
        <button class="candle c1" aria-label="candle 1"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c2" aria-label="candle 2"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c3" aria-label="candle 3"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c4" aria-label="candle 4"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c5" aria-label="candle 5"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c6" aria-label="candle 6"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button><button class="candle c7" aria-label="candle 7"><i class="wick"></i><i class="flame"></i><i class="smoke"></i></button>
      </div>
    </div>
    <div class="hint">🕯️ ဖယောင်းတိုင်လေးတစ်တိုင်ကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ ✨</div>
  </section>
  <section class="sky" id="sky"><div class="moon" id="moon"></div><div class="story" id="story"></div><div class="final" id="final"><div class="inner"><h1>Happy Birthday</h1><div class="name">Zwe Htet Myat ❤️</div><p>🌈 မင်းရဲ့နေ့ရက်တိုင်း ရယ်မောခြင်း၊ စွန့်စားခန်းအသစ်တွေနဲ့ ပျော်ရွှင်ခြင်းတွေနဲ့ ပြည့်နေပါစေ။<br>✨ မင်းရဲ့အိပ်မက်လေးတွေ အမြဲတမ်း တောက်ပနေပါစေ။</p><button class="replay" id="replay">↻ Replay</button></div></div></section>
  <canvas id="fx"></canvas>
</div>
<audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,running=false,startTime=0,raf=0,particles=[],meteors=[],fireworks=[],birds=[];
const intro=document.getElementById('intro'),sky=document.getElementById('sky'),story=document.getElementById('story'),final=document.getElementById('final'),moon=document.getElementById('moon'),song=document.getElementById('song');
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let audioCtx;
function audio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur=.15,type='sine',gain=.04,delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(0,audioCtx.currentTime+delay);g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}
function chime(){tone(784,.25,'sine',.06);tone(988,.3,'sine',.05,.12);tone(1319,.5,'sine',.05,.25)}function boom(){tone(90,.45,'sine',.11);tone(180,.2,'triangle',.06,.03)}
function rand(a,b){return a+Math.random()*(b-a)}
function burst(x,y,count=90,colors=['#fff4a8','#ffd34d','#ff8db3','#7ee7ff','#cda7ff']){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.pow(Math.random(),.45)*rand(2,8);particles.push({x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.045,life:1,size:rand(1,3),color:colors[i%colors.length]})}boom()}
function starBurst(){for(let i=0;i<150;i++){const a=Math.random()*Math.PI*2,s=rand(2,10);particles.push({x:W/2,y:H*.48,px:W/2,py:H*.48,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.018,life:1,size:rand(1,2.8),color:i%5?'#fff':'#ffd86b'})}}
function meteor(delay=0){setTimeout(()=>{meteors.push({x:W*rand(1.05,1.2),y:H*rand(.04,.55),vx:-rand(10,17),vy:rand(5,9),life:1,len:rand(120,230),size:rand(2.5,4.5)});tone(500,.16,'triangle',.025)},delay)}
function firework(delay,x,y){setTimeout(()=>{fireworks.push({x:x*W,y:y*H,t:0,life:1});},delay)}
function makeBird(delay,x,y,scale=1){setTimeout(()=>birds.push({x:x*W,y:y*H,s:scale,t:0}),delay)}
function drawBird(b){ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.s,b.s);ctx.globalAlpha=Math.min(1,b.t/500);ctx.fillStyle='#f7efe1';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,32,18,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(-38,-30,-53,-8);ctx.quadraticCurveTo(-27,-5,-10,12);ctx.fill();ctx.beginPath();ctx.moveTo(8,-2);ctx.quadraticCurveTo(28,-30,43,-8);ctx.quadraticCurveTo(24,-6,8,11);ctx.fill();ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.moveTo(31,0);ctx.lineTo(47,6);ctx.lineTo(31,10);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);for(const p of particles){p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.995;p.life-=.012;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}particles=particles.filter(p=>p.life>0);
for(const m of meteors){m.x+=m.vx;m.y+=m.vy;m.life-=.018;const tx=m.x-m.vx*m.len/10,ty=m.y-m.vy*m.len/10;const g=ctx.createLinearGradient(m.x,m.y,tx,ty);g.addColorStop(0,'#fff');g.addColorStop(.2,'#fff8bd');g.addColorStop(1,'transparent');ctx.globalAlpha=Math.max(0,m.life);ctx.strokeStyle=g;ctx.lineWidth=m.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowBlur=25;ctx.shadowColor='#ffe77a';ctx.beginPath();ctx.arc(m.x,m.y,m.size*1.7,0,Math.PI*2);ctx.fill()}meteors=meteors.filter(m=>m.life>0&&m.x>-300);
for(const f of fireworks){f.t+=1;f.life-=.012;if(f.t===1)burst(f.x,f.y,120);ctx.globalAlpha=Math.max(0,f.life);ctx.strokeStyle='#ffffff';ctx.beginPath();ctx.arc(f.x,f.y,Math.min(180,f.t*5),0,Math.PI*2);ctx.stroke()}fireworks=fireworks.filter(f=>f.life>0);
for(const b of birds){b.t+=16;b.x+=2.4*b.s;b.y+=Math.sin(b.t/250)*.45;b.s+=0;drawBird(b)}birds=birds.filter(b=>b.x<W+150);ctx.globalAlpha=1;ctx.shadowBlur=0;raf=requestAnimationFrame(draw)}
draw();
function setStory(t){story.classList.remove('show');setTimeout(()=>{story.textContent=t;story.classList.add('show')},250)}
function start(){if(running)return;running=true;audio();document.querySelectorAll('.flame').forEach(x=>x.style.opacity='0');document.querySelectorAll('.smoke').forEach(x=>x.classList.add('show'));document.querySelector('.hint').classList.add('hide');chime();try{song.currentTime=0;song.play().catch(()=>{})}catch(e){}
setTimeout(()=>{intro.classList.add('hide');sky.classList.add('show');starBurst();},700);
setTimeout(()=>{setStory('🎂 ဖယောင်းတိုင်လေးကို မှုတ်ပြီး ဆုတောင်းလိုက်တဲ့အချိန်မှာ...');},1800);
setTimeout(()=>{setStory('✨ ဆုတောင်းချက်လေးဟာ ကြယ်မှုန်လေးတစ်စင်းအဖြစ် ကောင်းကင်ပေါ်ကို ပျံတက်သွားတယ်...');for(let i=0;i<4;i++)meteor(i*450);},7500);
setTimeout(()=>{setStory('🐦 ပျော်ရွှင်မှုနဲ့ လက်ဆောင်လေးတွေကို ငှက်ကလေးတွေက Zwe Htet Myat အတွက် သယ်လာပြီ...');makeBird(0,-.1,.48,1);makeBird(900,-.15,.62,.8);makeBird(1700,-.12,.34,.65);},15000);
setTimeout(()=>{setStory('🌠 ဒီနေ့တော့ ကောင်းကင်ပေါ်က ကြယ်လေးတွေအားလုံးက မင်းရဲ့ဆုတောင်းချက်ကို ကြားနေကြပြီ... ✨');for(let i=0;i<8;i++)meteor(i*380);firework(300,.25,.35);firework(900,.72,.3);firework(1500,.5,.55);firework(2200,.82,.52);},26000);
setTimeout(()=>{setStory('🌙 လမင်းနဲ့ ကြယ်တွေက မင်းအတွက်ပဲ လင်းလက်နေကြတာပါ... မင်းရဲ့အိပ်မက်တွေ အမြဲတောက်ပပါစေ။');moon.classList.add('show');for(let i=0;i<4;i++)firework(i*900,.18+i*.2,.3);},39000);
setTimeout(()=>{story.classList.remove('show');final.classList.add('show');for(let i=0;i<7;i++)firework(i*350,.15+i*.11,rand(.25,.55));for(let i=0;i<7;i++)meteor(i*300);chime();tone(1568,.8,'sine',.05,.35)},50000);
setTimeout(()=>{running=false},57000)}
document.querySelectorAll('.candle').forEach(c=>c.addEventListener('click',start,{once:true}));document.getElementById('replay').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
