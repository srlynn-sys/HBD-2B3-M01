<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Zwe Htet Myat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05051a}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}</style></head><body><canvas id="c"></canvas><audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio><script>
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false,desynchronized:true}),song=document.getElementById('song');let W=0,H=0,D=1,started=false,t0=0,last=0,flash=0,shake=0;const TAU=Math.PI*2;const photo=new Image();photo.decoding='async';photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';const stars=[],parts=[],rockets=[],toys=[],balloons=[];const cols=['#ff4fa3','#ffd84d','#4de7ff','#9c72ff','#67ef85','#ff7068','#fff','#ff9a3d'];let AC=null;
function resize(){D=Math.min(devicePixelRatio||1,1.15);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);X.imageSmoothingEnabled=true;stars.length=0;for(let i=0,n=Math.min(90,Math.max(45,Math.floor(W*H/15000)));i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.78,r:.4+Math.random()*1.2,p:Math.random()*TAU})}addEventListener('resize',resize,{passive:true});resize();
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function tone(f,d=.12,g=.018,type='sine'){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function boom(){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(105,n);o.frequency.exponentialRampToValueAtTime(32,n+.5);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.2,n+.025);g.gain.exponentialRampToValueAtTime(.001,n+.58);o.connect(g).connect(AC.destination);o.start();o.stop(n+.6);tone(480,.08,.025,'triangle')}
function add(x,y,vx,vy,c,life=1,size=2){if(parts.length>650)return;parts.push({x,y,px:x,py:y,vx,vy,c,life,size})}
function pop(x,y,c,count=80){for(let i=0;i<count;i++){const a=Math.random()*TAU,v=2+Math.random()*5.5;add(x,y,Math.cos(a)*v,Math.sin(a)*v,c,1,1+Math.random()*1.5)}flash=.18;shake=4}
function drawStars(t){X.fillStyle='#fff';for(const s of stars){X.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.8+s.p));X.fillRect(s.x,s.y,s.r,s.r)}X.globalAlpha=1}
function flame(x,y,s,t){const q=Math.sin(t*9+x)*.18,lean=Math.sin(t*7+x*.03)*2;X.save();X.translate(x+lean,y);X.scale(1+q,.96-q*.3);X.shadowColor='#ffad25';X.shadowBlur=12;X.fillStyle='#ff8b25';X.beginPath();X.moveTo(0,-s*1.8);X.bezierCurveTo(s*.9,-s*.65,s*.7,s*.65,0,s);X.bezierCurveTo(-s*.75,s*.6,-s*.7,-s*.65,0,-s*1.8);X.fill();X.shadowBlur=0;X.fillStyle='#fff8b0';X.beginPath();X.ellipse(0,s*.2,s*.25,s*.55,0,0,TAU);X.fill();X.restore()}
function drawBalloon(b,t){X.save();X.translate(b.x,b.y);X.fillStyle=b.c;X.shadowColor=b.c;X.shadowBlur=12;X.beginPath();X.ellipse(0,0,22*b.s,29*b.s,0,0,TAU);X.fill();X.shadowBlur=0;X.fillStyle='rgba(255,255,255,.55)';X.beginPath();X.ellipse(-7*b.s,-10*b.s,4*b.s,8*b.s,0,0,TAU);X.fill();X.strokeStyle='rgba(255,255,255,.65)';X.beginPath();X.moveTo(0,28*b.s);X.lineTo(0,95*b.s);X.stroke();X.restore()}
function intro(t){X.fillStyle='#fff5fa';X.fillRect(0,0,W,H);const cx=W/2;for(const b of balloons)drawBalloon(b,t);const pw=Math.min(W*.39,400),ph=Math.min(H*.34,350),px=cx-pw/2,py=H*.1;X.fillStyle='#fff';X.shadowColor='rgba(180,70,130,.28)';X.shadowBlur=22;X.beginPath();X.roundRect(px-8,py-8,pw+16,ph+16,28);X.fill();X.shadowBlur=0;if(photo.complete&&photo.naturalWidth){X.save();X.beginPath();X.roundRect(px,py,pw,ph,22);X.clip();X.drawImage(photo,px,py,pw,ph);X.restore()}X.strokeStyle='#f4b4ce';X.lineWidth=4;X.beginPath();X.roundRect(px,py,pw,ph,22);X.stroke();X.textAlign='center';X.fillStyle='#8b315f';X.font='800 '+Math.max(24,Math.min(42,W*.045))+'px Georgia';X.fillText('Happy Birthday!',cx,H*.56);X.fillStyle='#d84d87';X.font='800 '+Math.max(21,Math.min(34,W*.035))+'px Georgia';X.fillText('Zwe Htet Myat',cx,H*.63);const w=Math.min(W*.55,470),y=H*.72;X.fillStyle='#e895b5';X.beginPath();X.roundRect(cx-w/2,y,w,70,18);X.fill();X.fillStyle='#fff8ef';X.beginPath();X.roundRect(cx-w*.43,y-11,w*.86,28,14);X.fill();for(let i=0;i<7;i++){const x=cx-w*.36+i*w*.12;X.fillStyle='#ffd15d';X.fillRect(x-4,y-23,8,13);flame(x,y-34,7,t+i*.2)}X.fillStyle='#71304b';X.font='700 '+Math.max(15,Math.min(22,W*.022))+'px "Noto Sans Myanmar"';X.fillText('နှိပ်ပြီး မွေးနေ့ပွဲ စလိုက်ရအောင် 🎉',cx,H*.9)}
function makeBalloons(){balloons.length=0;for(let i=0;i<8;i++)balloons.push({x:W*(.08+i*.12),y:H*(.55+Math.random()*.22),s:.65+Math.random()*.4,c:cols[i%cols.length],v:.15+Math.random()*.18})}
function firework(){if(rockets.length>5)return;const x=W*(.08+Math.random()*.84),ty=H*(.12+Math.random()*.42),c=cols[(Math.random()*cols.length)|0];rockets.push({x,y:H+20,ty,vy:-8.5-Math.random()*2,c,trail:[]})}
function toy(x,y,type,c){if(toys.length>16)return;toys.push({x,y,type,c,age:0,s:.55+Math.random()*.25,vy:-.5-Math.random()*.35})}
function explode(r){const n=75+((Math.random()*45)|0);for(let i=0;i<n;i++){const a=Math.random()*TAU,v=2.5+Math.random()*5.2;add(r.x,r.ty,Math.cos(a)*v,Math.sin(a)*v,r.c,1.2,1.4+Math.random()*1.3)}const type=['bear','star','heart','cat','balloon'][(Math.random()*5)|0];toy(r.x,r.ty,type,r.c);boom();flash=.5;shake=11}
function drawToy(q,t){const s=52*q.s,appear=Math.min(1,q.age/.35),fade=Math.max(0,1-q.age/2.2);X.save();X.translate(q.x,q.y);X.scale(appear,appear);X.globalAlpha=fade;X.shadowColor=q.c;X.shadowBlur=16;X.fillStyle=q.c;X.strokeStyle='#fff';X.lineWidth=2.5;if(q.type==='star'){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s:s*.42,x=Math.cos(a)*r,y=Math.sin(a)*r;i?X.lineTo(x,y):X.moveTo(x,y)}X.closePath();X.fill();X.stroke()}else if(q.type==='heart'){X.beginPath();X.moveTo(0,s*.8);X.bezierCurveTo(-s*1.3,0,-s*.9,-s*.9,0,-s*.3);X.bezierCurveTo(s*.9,-s*.9,s*1.3,0,0,s*.8);X.fill();X.stroke()}else if(q.type==='bear'){X.beginPath();X.arc(-s*.5,-s*.65,s*.35,0,TAU);X.arc(s*.5,-s*.65,s*.35,0,TAU);X.fill();X.beginPath();X.arc(0,0,s*.78,0,TAU);X.fill();X.fillStyle='#fff1d8';X.beginPath();X.arc(0,s*.18,s*.3,0,TAU);X.fill();X.fillStyle='#3b2540';X.beginPath();X.arc(-s*.27,-s*.08,s*.065,0,TAU);X.arc(s*.27,-s*.08,s*.065,0,TAU);X.arc(0,s*.13,s*.07,0,TAU);X.fill()}else if(q.type==='cat'){X.beginPath();X.moveTo(-s*.8,-s*.1);X.lineTo(-s*.7,-s*.85);X.lineTo(-s*.18,-s*.5);X.lineTo(s*.18,-s*.5);X.lineTo(s*.7,-s*.85);X.lineTo(s*.8,-s*.1);X.quadraticCurveTo(s*.85,s*.75,0,s*.78);X.quadraticCurveTo(-s*.85,s*.75,-s*.8,-s*.1);X.fill();X.fillStyle='#3b2540';X.beginPath();X.arc(-s*.28,0,s*.06,0,TAU);X.arc(s*.28,0,s*.06,0,TAU);X.fill()}else{X.beginPath();X.arc(0,0,s*.68,0,TAU);X.fill();X.stroke();X.strokeStyle='#fff';X.beginPath();X.moveTo(0,-s*.68);X.lineTo(0,-s*1.05);X.stroke()}X.restore();X.globalAlpha=1}
function update(dt,t){const k=dt/16.67;flash*=Math.pow(.78,k);shake*=Math.pow(.76,k);for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>10)r.trail.shift();r.y+=r.vy*k;r.vy+=.1*k;if(r.y<=r.ty){explode(r);rockets.splice(i,1)}}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.px=p.x;p.py=p.y;p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.985,k);p.vy+=.045*k;p.life-=.018*k;if(p.life<=0)parts.splice(i,1)}for(let i=toys.length-1;i>=0;i--){const q=toys[i];q.age+=dt/1000;q.y+=q.vy*k;q.vy+=.012*k;if(q.age>2.5)toys.splice(i,1)}for(const b of balloons){b.y-=b.v*k;if(b.y<-130)b.y=H+50}}
function drawSky(t){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101b57');g.addColorStop(.55,'#182d78');g.addColorStop(1,'#050719');X.fillStyle=g;X.fillRect(0,0,W,H);drawStars(t)}
function drawEffects(){X.save();X.globalCompositeOperation='lighter';for(const r of rockets){X.strokeStyle=r.c;X.lineWidth=3;X.globalAlpha=.45;X.beginPath();r.trail.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke()}for(const p of parts){X.globalAlpha=Math.max(0,p.life);X.strokeStyle=p.c;X.lineWidth=p.size;X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.size,0,TAU);X.fill()}X.restore();for(const q of toys)drawToy(q,performance.now()/1000)}
function title(a,b){X.textAlign='center';X.shadowColor='rgba(0,0,0,.55)';X.shadowBlur=12;X.fillStyle='#fff';X.font='800 '+Math.max(24,Math.min(46,W*.047))+'px "Noto Sans Myanmar"';X.fillText(a,W/2,H*.55);if(b){X.fillStyle='#ffe59a';X.font='600 '+Math.max(15,Math.min(24,W*.024))+'px "Noto Sans Myanmar"';X.fillText(b,W/2,H*.62)}X.shadowBlur=0}
function finale(t){X.textAlign='center';X.shadowColor='#ffd45d';X.shadowBlur=24;X.fillStyle='#fff7d5';X.font='800 '+Math.min(82,W*.09)+'px Georgia';X.fillText('Happy Birthday',W/2,H*.38);X.fillStyle='#ffd66d';X.font='800 '+Math.min(56,W*.06)+'px Georgia';X.fillText('Zwe Htet Myat ❤️',W/2,H*.5);X.shadowBlur=0;X.fillStyle='#fff';X.font='600 '+Math.max(16,Math.min(25,W*.025))+'px "Noto Sans Myanmar"';X.fillText('ပျော်ရွှင်စရာ မွေးနေ့ဖြစ်ပါစေ 🎂',W/2,H*.61)}
function loop(now){const dt=Math.min(32,last?now-last:16.67);last=now;const t=started?(now-t0)/1000:0;if(!started){intro(now/1000);requestAnimationFrame(loop);return}update(dt,t);const phase=t<6?0:t<13?1:t<20?2:t<75?3:4;X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawSky(now/1000);if(phase===0){if(Math.random()<.025)pop(W*.5,H*.45,cols[(Math.random()*cols.length)|0],30);title('🌟 မှော်ဆန်တဲ့ မွေးနေ့ညလေး 🌟','ကြယ်လေးတွေက မွေးနေ့ဆုတောင်းလေး ယူလာပြီ') }else if(phase===1){if(Math.random()<.06)firework();title('🎈 ပူဖောင်းလေးတွေ ပျံတက်လာပြီ','မွေးနေ့ပွဲ စတော့မယ်!')}else if(phase===2){if(Math.random()<.05)firework();for(const b of balloons)drawBalloon(b,now/1000);title('🎁 လက်ဆောင်တွေ ရောက်လာပြီ','မီးရူးမီးပန်းလေးတွေကို စောင့်ကြည့်ပါ!')}else if(phase===3){if(Math.random()<.06)firework();title('🎆 မီးရူးမီးပန်း ပွဲတော်ကြီး','အရောင်စုံအလင်းလေးတွေ ပုံပြင်လေးတစ်ပုဒ်လို ပေါက်ကွဲနေပြီ!')}else finale(t);drawEffects();X.restore();if(flash>.005){X.fillStyle='rgba(255,255,255,'+Math.min(.5,flash*.7)+')';X.fillRect(0,0,W,H)}if(t>84){started=false;parts.length=rockets.length=toys.length=balloons.length=0}requestAnimationFrame(loop)}
C.addEventListener('pointerdown',()=>{if(started)return;audio();started=true;t0=performance.now();last=t0;makeBalloons();parts.length=rockets.length=toys.length=0;song.currentTime=0;song.play().catch(()=>{});pop(W/2,H*.44,'#ffd84d',90)});makeBalloons();requestAnimationFrame(loop);
</script></body></html>
