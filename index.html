<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Zwe Htet Myat</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b}body{font-family:"Noto Sans Myanmar",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 22px;border-radius:999px;color:#fff;background:#ffffff18;border:1px solid #ffffff32;backdrop-filter:blur(12px);font-size:15px;letter-spacing:.2px;z-index:2;pointer-events:none;transition:.8s;text-shadow:0 2px 12px #000}
#hint.hide{opacity:0;transform:translate(-50%,15px)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hint">🕯️ ဖယောင်းတိုင်လေးကို နှိပ်ပြီး ဆုတောင်းလိုက်ပါ ✨</div>
<audio id="song" preload="auto" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),hint=document.getElementById('hint'),song=document.getElementById('song');
let W=0,H=0,D=1,started=false,phase='intro',t0=0,last=0,raf=0;
const photo=new Image();photo.crossOrigin='anonymous';photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';
const meteors=[],sparks=[],rockets=[],birds=[],stars=[];
const TAU=Math.PI*2,colors=['#ff4d9d','#ffcc4d','#63f5ff','#a879ff','#74ff9b','#ffffff','#ff765e'];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);makeStars()}addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function alpha(hex,a){return hex.replace(')',','+a+')').replace('rgb','rgba')}
function rgb(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgba(${r},${g},${b},${a})`}
function makeStars(){stars.length=0;for(let i=0;i<170;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.72,r:rnd(.35,1.6),a:rnd(.2,.85),p:Math.random()*TAU})}
let AC;function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d=.16,g=.035,type='sine',delay=0){if(!AC)return;let o=AC.createOscillator(),v=AC.createGain(),q=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,q);v.gain.setValueAtTime(.0001,q);v.gain.exponentialRampToValueAtTime(g,q+.02);v.gain.exponentialRampToValueAtTime(.0001,q+d);o.connect(v).connect(AC.destination);o.start(q);o.stop(q+d+.03)}
function chord(){tone(523,.45,.045,'sine');tone(659,.5,.04,'sine',.1);tone(784,.6,.04,'sine',.2);tone(1047,.8,.035,'sine',.34)}
function pop(){tone(rnd(500,900),.08,.018,'triangle');tone(rnd(80,130),.22,.05,'sine',.02)}
function clearFx(){meteors.length=0;sparks.length=0;rockets.length=0;birds.length=0}
function skyGradient(){let g=X.createRadialGradient(W*.5,H*.42,0,W*.5,H*.48,Math.max(W,H)*.8);g.addColorStop(0,'#263d91');g.addColorStop(.35,'#101b58');g.addColorStop(.72,'#06091f');g.addColorStop(1,'#01020a');X.fillStyle=g;X.fillRect(0,0,W,H);}
function drawStars(time){for(const s of stars){let a=s.a*(.55+.45*Math.sin(time*.002+s.p));X.beginPath();X.arc(s.x,s.y,s.r,0,TAU);X.fillStyle=`rgba(255,255,235,${a})`;X.fill();if(s.r>1.2){X.strokeStyle=`rgba(130,220,255,${a*.35})`;X.lineWidth=.7;X.beginPath();X.moveTo(s.x-s.r*3,s.y);X.lineTo(s.x+s.r*3,s.y);X.moveTo(s.x,s.y-s.r*3);X.lineTo(s.x,s.y+s.r*3);X.stroke()}}}
function glowDot(x,y,r,col,a=1){let g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb(col,a));g.addColorStop(.18,rgb(col,a*.55));g.addColorStop(1,rgb(col,0));X.fillStyle=g;X.fillRect(x-r,y-r,x+r,y+r)}
function drawPhotoCake(time){
 let cx=W/2, cy=H*.43, size=Math.min(W*.62,H*.46,480);
 X.save();X.globalAlpha=.2;glowDot(cx,cy-size*.12,size*.72,'#ffb5d4',1);X.restore();
 if(photo.complete&&photo.naturalWidth){X.save();X.beginPath();X.arc(cx,cy-size*.16,size*.46,0,TAU);X.clip();X.globalAlpha=.78;X.drawImage(photo,cx-size*.46,cy-size*.62,size*.92,size*.92);X.restore();X.beginPath();X.arc(cx,cy-size*.16,size*.46,0,TAU);X.lineWidth=7;X.strokeStyle='#ffffff55';X.stroke()}
 let cakeW=size*.78, cakeH=size*.38, left=cx-cakeW/2, top=cy+size*.16;
 X.save();X.shadowColor='#ff8eb766';X.shadowBlur=35;
 let gr=X.createLinearGradient(0,top,0,top+cakeH);gr.addColorStop(0,'#fffaf5');gr.addColorStop(.45,'#ffd0dc');gr.addColorStop(1,'#dc7d9b');X.fillStyle=gr;roundRect(left,top+cakeH*.2,cakeW,cakeH*.65,24);X.fill();
 let topG=X.createLinearGradient(0,top,0,top+cakeH*.25);topG.addColorStop(0,'#ffffff');topG.addColorStop(1,'#ffdce5');X.fillStyle=topG;roundRect(left+cakeW*.1,top,cakeW*.8,cakeH*.35,20);X.fill();X.restore();
 for(let i=0;i<5;i++){let bx=left+cakeW*(.18+i*.16),by=top+cakeH*.45+(i%2)*9;X.fillStyle=['#ff5f9e','#ffd45c','#6ff4df','#9c82ff','#ff806b'][i];X.beginPath();X.arc(bx,by,7,0,TAU);X.fill()}
 for(let i=0;i<7;i++){let x=left+cakeW*(.12+i*.126);let flameY=top-55;X.fillStyle='#f6c1d0';roundRect(x-7,top-3,14,52,5);X.fillStyle='#fff4a7';X.beginPath();X.ellipse(x,flameY,9,18,.35,0,TAU);X.fill();X.fillStyle='#ff9b35';X.beginPath();X.ellipse(x+2,flameY+3,4,10,.35,0,TAU);X.fill();}
 X.fillStyle='#fff';X.textAlign='center';X.font=`600 ${Math.max(15,Math.min(22,W*.027))}px system-ui`;X.fillText('Zwe Htet Myat',cx,top+cakeH+35);
}
function roundRect(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function starBurst(){for(let i=0;i<230;i++){let a=Math.random()*TAU,s=rnd(1,8);sparks.push({x:W/2,y:H*.47,px:W/2,py:H*.47,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:rnd(.012,.026),size:rnd(1,3.5),col:colors[(Math.random()*colors.length)|0],grav:.025})}chord()}
function addMeteor(delay=0){setTimeout(()=>{let x=rnd(-W*.08,W*.72),y=rnd(H*.08,H*.55),speed=rnd(10,16),ang=rnd(.55,.78),len=rnd(150,260);meteors.push({x,y,px:x,py:y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,len,life:1,wait:0});tone(250,.2,.012,'sine')},delay)}
function updateMeteors(){for(let i=meteors.length-1;i>=0;i--){let m=meteors[i];m.px=m.x;m.py=m.y;m.x+=m.vx;m.y+=m.vy;m.life-=.012;if(m.life<=0||m.x>W+100||m.y>H+100)meteors.splice(i,1)}}
function drawMeteors(){X.save();X.globalCompositeOperation='lighter';for(const m of meteors){let g=X.createLinearGradient(m.x-m.vx*m.len/10,m.y-m.vy*m.len/10,m.x,m.y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(150,220,255,.16)');g.addColorStop(1,'rgba(255,255,255,.95)');X.strokeStyle=g;X.lineWidth=3.5;X.beginPath();X.moveTo(m.x-m.vx*m.len/10,m.y-m.vy*m.len/10);X.lineTo(m.x,m.y);X.stroke();glowDot(m.x,m.y,30,'#ffffff',.9);X.fillStyle='#fff';X.beginPath();X.arc(m.x,m.y,3.4,0,TAU);X.fill()}X.restore()}
function launchFirework(x,y){rockets.push({x:W*rnd(.18,.82),y:H+15,targetY:y,vy:-rnd(8,11),col:colors[(Math.random()*colors.length)|0],trail:[]})}
function explode(r){let count=Math.floor(rnd(90,130)),shape=Math.random();for(let i=0;i<count;i++){let a=TAU*i/count+rnd(-.025,.025),speed=rnd(2.5,7.5);if(shape>.82)speed*=1+.5*Math.sin(a*4);sparks.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,dec:rnd(.008,.016),size:rnd(1.2,3.2),col:r.col,grav:.055})}for(let i=0;i<24;i++){let a=TAU*i/24;sparks.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,life:.75,dec:.022,size:1.4,col:'#fff',grav:.02})}glowDot(r.x,r.y,110,r.col,1);pop()}
function updateRockets(){for(let i=rockets.length-1;i>=0;i--){let r=rockets[i];r.trail.push({x:r.x,y:r.y});if(r.trail.length>9)r.trail.shift();r.y+=r.vy;r.vy+=.12;if(r.y<=r.targetY){explode(r);rockets.splice(i,1)}}}
function drawRockets(){X.save();X.globalCompositeOperation='lighter';for(const r of rockets){X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;X.beginPath();r.trail.forEach((p,j)=>j?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y));X.stroke();glowDot(r.x,r.y,25,r.col,1);X.fillStyle='#fff';X.arc(r.x,r.y,2,0,TAU);X.fill()}X.restore()}
function updateSparks(){for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.px=p.x;p.py=p.y;p.vx*=.985;p.vy=p.vy*.985+p.grav;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;if(p.life<=0)sparks.splice(i,1)}}
function drawSparks(){X.save();X.globalCompositeOperation='lighter';for(const p of sparks){X.strokeStyle=rgb(p.col,Math.min(1,p.life));X.lineWidth=Math.max(.7,p.size*p.life);X.beginPath();X.moveTo(p.px,p.py);X.lineTo(p.x,p.y);X.stroke();if(p.life>.65)glowDot(p.x,p.y,12,p.col,p.life*.7)}X.restore()}
function makeBird(x,y,s,delay){setTimeout(()=>birds.push({x,y,s,phase:Math.random()*TAU,vx:rnd(2.2,3.6),life:1}),delay)}
function drawBird(b,time){let flap=Math.sin(time*.012+b.phase)*.32, x=b.x,y=b.y,s=b.s;X.save();X.translate(x,y);X.scale(s,s);X.globalAlpha=Math.min(1,b.life);X.fillStyle='#f8fbff';X.shadowColor='#8dd9ff';X.shadowBlur=12;X.beginPath();X.moveTo(-1,2);X.quadraticCurveTo(-24,-13,-34,-4);X.quadraticCurveTo(-20,5,-3,8);X.quadraticCurveTo(-20,2,-31,flap*35-5);X.quadraticCurveTo(-15,flap*30-22,0,0);X.quadraticCurveTo(15,flap*30-22,31,flap*35-5);X.quadraticCurveTo(20,5,3,8);X.quadraticCurveTo(16,3,22,-5);X.quadraticCurveTo(10,-8,1,2);X.fill();X.restore()}
function updateBirds(){for(let i=birds.length-1;i>=0;i--){let b=birds[i];b.x+=b.vx;b.y-=Math.sin(b.x*.008)*.12;if(b.x>W+80){birds.splice(i,1)}}}
function moon(){let x=W*.84,y=H*.18,r=Math.min(W,H)*.075;glowDot(x,y,r*2.2,'#fff1a8',.55);X.fillStyle='#fff8d6';X.beginPath();X.arc(x,y,r,0,TAU);X.fill();X.fillStyle='#0b1236';X.beginPath();X.arc(x+r*.32,y-r*.08,r*.88,0,TAU);X.fill();}
function text(msg,sub='',a=1){X.save();X.textAlign='center';X.textBaseline='middle';X.shadowColor='#000';X.shadowBlur=25;X.fillStyle=`rgba(255,255,250,${a})`;X.font=`600 ${Math.max(22,Math.min(46,W*.045))}px "Noto Sans Myanmar",sans-serif`;X.fillText(msg,W/2,H*.49);if(sub){X.font=`400 ${Math.max(15,Math.min(24,W*.022))}px "Noto Sans Myanmar",sans-serif`;X.fillStyle=`rgba(255,238,194,${a*.9})`;X.fillText(sub,W/2,H*.58)}X.restore()}
function finalScreen(time){let k=Math.min(1,(time-45)/2);let a=ease(k);X.save();X.textAlign='center';X.globalAlpha=a;X.shadowColor='#ffcf67';X.shadowBlur=35;X.fillStyle='#fff6d7';X.font=`700 ${Math.min(92,W*.095)}px Georgia,serif`;X.fillText('Happy Birthday',W/2,H*.40);X.shadowBlur=25;X.fillStyle='#ffd979';X.font=`700 ${Math.min(62,W*.065)}px Georgia,serif`;X.fillText('Zwe Htet Myat ❤️',W/2,H*.51);X.shadowBlur=20;X.fillStyle='#fff';X.font=`400 ${Math.min(25,W*.025)}px "Noto Sans Myanmar",sans-serif`;X.fillText('မင်းရဲ့နေ့ရက်တိုင်း ပျော်ရွှင်မှုတွေနဲ့',W/2,H*.63);X.fillText('အိပ်မက်လေးတွေ တောက်ပနေပါစေ ✨',W/2,H*.69);X.restore();}
function start(){if(started)return;started=true;audio();try{song.currentTime=0;song.play().catch(()=>{})}catch(e){}hint.classList.add('hide');phase='burst';t0=performance.now();last=t0;starBurst();requestAnimationFrame(loop)}
function loop(now){let dt=Math.min(40,now-last);last=now;let sec=(now-t0)/1000;X.clearRect(0,0,W,H);
 if(sec<4){phase='burst';skyGradient();drawStars(now);updateSparks();drawSparks();let a=Math.min(1,sec/1.2);X.fillStyle=`rgba(255,240,255,${1-a})`;X.fillRect(0,0,W,H);text('ကြယ်ရောင်လေးတွေက','Zwe Htet Myat အတွက် ပျံ့နှံ့လာတယ် ✨',Math.min(1,sec*.9))}
 else if(sec<15){phase='meteors';skyGradient();drawStars(now);if(sec<4.4)clearFx();if(Math.random()<.045) addMeteor();updateMeteors();drawMeteors();let a=Math.min(1,(sec-4)/1.2);text('ညကောင်းကင်ပေါ်မှာ ကြယ်ကြွေတွေ ဝှီးခနဲ ဖြတ်သန်းလာတယ်','ဆုတောင်းချက်လေးတစ်ခု ချင်းစီကို ကြယ်တွေက သယ်ဆောင်သွားတယ် 🌠',a)}
 else if(sec<27){phase='fireworks';skyGradient();drawStars(now);if(sec<15.1)clearFx();if(Math.floor((sec-15)/2.2)!==Math.floor((sec-15.05)/2.2)&&sec<25.5){}if(rockets.length<2&&sec<25)launchFirework(rnd(H*.12,H*.45),rnd(H*.15,H*.48));updateRockets();updateSparks();drawRockets();drawSparks();text('ကောင်းကင်ကြီးတစ်ခုလုံး အရောင်စုံလင်းလက်သွားပြီ','🎆 ပျော်ရွှင်မှုတွေ အများကြီး ရောက်လာပါစေ 🎆',Math.min(1,(sec-15)/1.5))}
 else if(sec<37){phase='birds';skyGradient();drawStars(now);if(sec<27.1){clearFx();for(let i=0;i<5;i++)makeBird(-50-rnd(0,180),H*rnd(.28,.58),rnd(.65,1.05),i*520)}updateBirds();for(const b of birds)drawBird(b,now);text('မနက်ဖြန်ဆီကို ပျံသန်းသွားမယ့် ငှက်လေးတွေလို','မင်းရဲ့အိပ်မက်တွေကိုလည်း အမြင့်ဆုံးထိ ပျံသန်းနိုင်ပါစေ 🐦✨',Math.min(1,(sec-27)/1.3))}
 else if(sec<47){phase='moon';skyGradient();drawStars(now);if(sec<37.1){birds.length=0}moon();let a=Math.min(1,(sec-37)/1.6);text('လမင်းလေးနဲ့ ကြယ်လေးတွေက','မင်းရဲ့လမ်းကို အမြဲတမ်း တောက်ပပေးနေပါစေ 🌙',a)}
 else {phase='final';skyGradient();drawStars(now);moon();if(Math.random()<.025)starBurst();updateSparks();drawSparks();finalScreen(sec)}
 raf=requestAnimationFrame(loop)}
C.addEventListener('click',e=>{if(!started)start();else if(phase==='final'){started=false;clearFx();hint.classList.remove('hide');phase='intro';drawIntro();}});
function drawIntro(){X.clearRect(0,0,W,H);let g=X.createRadialGradient(W*.5,H*.35,0,W*.5,H*.5,Math.max(W,H));g.addColorStop(0,'#fff8ef');g.addColorStop(.48,'#f5cad7');g.addColorStop(1,'#b96889');X.fillStyle=g;X.fillRect(0,0,W,H);drawPhotoCake(performance.now());}
drawIntro();
</script>
</body>
</html>
