<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Zwe Htet Myat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;color:#fff;font-family:Georgia,"Times New Roman",serif}body{cursor:default}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#273b87 0,#0b1030 42%,#02030a 84%);transition:opacity 1s ease,transform 1.2s ease}.hide{opacity:0!important;pointer-events:none!important;transform:scale(1.06)}
.intro-art{position:relative;width:min(980px,92vw);height:min(720px,90vh);display:grid;place-items:center}.photo{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 8px #ffffff0b,0 0 70px #ffd45e66;animation:photoFloat 4s ease-in-out infinite}.photo:after{content:""}@keyframes photoFloat{50%{transform:translateX(-50%) translateY(-8px)}}
.cake-wrap{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(680px,78vw);height:350px;filter:drop-shadow(0 30px 45px #0009)}.plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:96%;height:42px;border-radius:50%;background:linear-gradient(#e9f1ff,#a9bad8);box-shadow:0 0 30px #b8d5ff33}.cake{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:78%;height:165px;border-radius:28px 28px 38px 38px;background:linear-gradient(180deg,#ffcadb,#ff8db3 54%,#cf4c7e);border:4px solid #ffe8f0;box-shadow:inset 0 -18px 0 #a93468,inset 0 8px 0 #fff5}.cake:before{content:"";position:absolute;left:-2%;top:-45px;width:104%;height:75px;border-radius:50%;background:linear-gradient(#fffafc,#ffd7e5);border:4px solid #ffeef4}.icing{position:absolute;left:4%;right:4%;top:0;height:75px;border-radius:50%;border-bottom:5px solid #fff}.drip{position:absolute;top:43px;width:28px;height:55px;border-radius:0 0 18px 18px;background:#fff1f7}.d1{left:13%}.d2{left:31%;height:72px}.d3{left:52%;height:48px}.d4{left:73%;height:66px}
.candle{position:absolute;bottom:185px;width:22px;height:82px;border-radius:7px;background:repeating-linear-gradient(135deg,#fff 0 9px,#ff71aa 9px 18px);box-shadow:0 8px 18px #0007;cursor:pointer;transition:.25s;z-index:3}.candle:hover{filter:brightness(1.3);transform:translateY(-4px)}.candle i{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:22px;height:34px;border-radius:55% 45% 50% 50%;background:radial-gradient(circle at 50% 72%,#fff 0 16%,#ffe66d 18% 48%,#ff8a24 51% 72%,transparent 75%);filter:drop-shadow(0 0 13px #ffd45e) drop-shadow(0 0 25px #ff8b25);animation:flame .13s infinite alternate ease-in-out}.candle i:after{content:"";position:absolute;left:8px;top:-8px;width:6px;height:12px;border-radius:50%;background:#fff8;filter:blur(3px)}.candle.off i{opacity:0;transform:translateX(-50%) scale(.1);transition:.45s}.candle.off{cursor:default}.c1{left:13%}.c2{left:27%}.c3{left:39%}.c4{left:50%;transform:translateX(-50%)}.c5{left:61%}.c6{left:73%}.c7{left:87%}@keyframes flame{from{transform:translateX(-50%) scale(.85) rotate(-4deg)}to{transform:translateX(-50%) scale(1.18) rotate(4deg)}}
.cue{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font:700 11px system-ui,sans-serif;letter-spacing:5px;color:#ffffff99;animation:pulse 1.5s infinite}.cue b{color:#ffd45e}@keyframes pulse{50%{opacity:.35}}
#stage{position:fixed;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.2s}.stage-on{opacity:1!important}.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,#0008 100%);pointer-events:none}.caption{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);width:90%;text-align:center;opacity:0;pointer-events:none;text-shadow:0 5px 40px #000}.caption.show{animation:captionIn 1.4s forwards}.caption h2{font-size:clamp(32px,6vw,82px);margin:0;color:#fff}.caption p{font:500 clamp(14px,1.5vw,20px)/1.8 system-ui,sans-serif;color:#dce7ff;margin:18px}.caption.gold h2{color:#ffd45e;text-shadow:0 0 30px #ffd45e88}@keyframes captionIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#final{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;background:#000}.final-on{opacity:1!important}.final-title{font-size:clamp(72px,12vw,190px);line-height:.92;margin:0;padding:0 3vw;color:#fff;background:none;-webkit-background-clip:initial;filter:none;text-shadow:0 0 8px #fff,0 0 28px #ff4f9a88,0 0 65px #ffd45e55;animation:finalFloat 3.5s ease-in-out infinite}.final-heart{color:#ff4f88;font-size:1.05em;display:inline-block;animation:heartBeat 1.15s infinite}.final-sub{display:none}@keyframes finalFloat{50%{transform:translateY(-13px) rotate(.3deg)}}@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<section id="intro"><div class="intro-art"><img class="photo" src="https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ" alt=""><div class="cake-wrap"><div class="plate"></div><div class="cake"><div class="icing"></div><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span></div><div class="candle c1"><i></i></div><div class="candle c2"><i></i></div><div class="candle c3"><i></i></div><div class="candle c4"><i></i></div><div class="candle c5"><i></i></div><div class="candle c6"><i></i></div><div class="candle c7"><i></i></div></div><div class="cue"><b>✦</b> CLICK THE FLAMES <b>✦</b></div></div></section>
<section id="stage"><div class="vignette"></div><div class="caption" id="caption"><h2></h2><p></p></div><div id="final"><div><h1 class="final-title">Happy Birthday<br>Zwe Htet Myat <span class="final-heart">♥</span></h1></div></div></section>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=innerWidth,H=innerHeight,D=1,t=0,started=false,shake=0,flash=0,phase=0,audio=null,quality=.9,frameCount=0,lastPerf=performance.now();const stars=[],parts=[],rockets=[],birds=[],comets=[],rings=[],shooters=[];const colors=['#ffd45e','#ff70b6','#62e8ff','#9b7cff','#68ee9b','#ff8769','#fff'];
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0);stars.length=0;for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.4,p:Math.random()*TAU})}addEventListener('resize',resize);resize();
function tone(freq,dur,type='sine',gain=.04,slide=0){if(!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur+.03)}
function boom(){if(!audio)return;const now=audio.currentTime,b=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter(),len=audio.sampleRate*.45,buf=audio.createBuffer(1,len,audio.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.7);b.buffer=buf;f.type='lowpass';f.frequency.value=1000;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.28,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.45);b.connect(f);f.connect(g);g.connect(audio.destination);b.start(now)}
function initAudio(){try{audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){audio=null}}
function addParticle(p){if(parts.length<1800*quality)parts.push(p)}
function burst(x,y,c,n=145,power=8){n=Math.floor(n*quality);for(let i=0;i<n;i++){const a=Math.random()*TAU,v=.8+Math.random()*power;addParticle({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7+Math.random()*1.3,s:.8+Math.random()*2.5,c,drag:.985})}for(let i=0;i<16*quality;i++){const a=i*TAU/(16*quality);addParticle({x,y,vx:Math.cos(a)*11,vy:Math.sin(a)*11,l:.55,s:2,c:'#fff',drag:.97})}rings.push({x,y,r:8,a:1,c});shake=Math.max(shake,9);flash=Math.max(flash,.2);boom()}
function starBomb(x,y){burst(x,y,'#ffd45e',95,7);tone(180,.3,'triangle',.05,80)}
function rocket(){rockets.push({x:W*(.06+Math.random()*.88),y:H+25,target:H*(.12+Math.random()*.42),v:7+Math.random()*5,c:colors[Math.random()*colors.length|0]});tone(180,.25,'sawtooth',.015,500)}
function comet(){comets.push({x:Math.random()*W,y:-40,v:3.2+Math.random()*3,a:.45+Math.random()*.9,c:colors[Math.random()*colors.length|0]})}
function shootingStar(){shooters.push({x:Math.random()*W*.8,y:Math.random()*H*.35,v:9+Math.random()*6,l:1,c:colors[Math.random()*colors.length|0]})}
function spawnBirds(){for(let i=0;i<16;i++)birds.push({x:-80-i*75,y:H*(.18+Math.random()*.48),v:.8+Math.random()*1.5,s:.55+Math.random()*.8,p:Math.random()*TAU,wing:Math.random()*TAU})}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020516');g.addColorStop(.45,'#091441');g.addColorStop(1,'#02030b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.15+.65*(.5+.5*Math.sin(t*1.5+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function drawRockets(){for(let i=rockets.length-1;i>=0;i--){const q=rockets[i];q.y-=q.v;ctx.strokeStyle=q.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y+38);ctx.lineTo(q.x,q.y);ctx.stroke();addParticle({x:q.x,y:q.y+14,vx:(Math.random()-.5)*.25,vy:1.2,l:.22,s:.9,c:q.c,drag:.99});if(q.y<q.target){burst(q.x,q.y,q.c,150,8);setTimeout(()=>burst(q.x,q.y,q.c,60,5),110);rockets.splice(i,1)}}}
function drawParticles(){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=q.drag;q.vy=q.vy*q.drag+.035;q.l-=.014;if(q.l<=0){parts.splice(i,1);continue}ctx.globalAlpha=Math.min(1,q.l);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function drawRings(){for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=6;r.a*=.94;ctx.globalAlpha=r.a;ctx.strokeStyle=r.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();if(r.a<.03)rings.splice(i,1)}ctx.globalAlpha=1}
function drawComets(){for(let i=comets.length-1;i>=0;i--){const q=comets[i];q.x+=q.a;q.y+=q.v;ctx.strokeStyle=q.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.a*18,q.y-q.v*18);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,3.5,0,TAU);ctx.fill();if(q.y>H+60)comets.splice(i,1)}}
function drawShooters(){for(let i=shooters.length-1;i>=0;i--){const q=shooters[i];q.x+=q.v;q.y+=q.v*.45;q.l-=.025;ctx.globalAlpha=q.l;ctx.strokeStyle=q.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.v*8,q.y-q.v*4);ctx.stroke();if(q.l<=0)shooters.splice(i,1)}ctx.globalAlpha=1}
function birdPath(s){ctx.beginPath();ctx.moveTo(-18*s,2*s);ctx.bezierCurveTo(-12*s,-9*s,-5*s,-11*s,0,0);ctx.bezierCurveTo(5*s,-11*s,12*s,-9*s,18*s,2*s);ctx.bezierCurveTo(10*s,-2*s,6*s,-1*s,0,4*s);ctx.bezierCurveTo(-6*s,-1*s,-10*s,-2*s,-18*s,2*s)}
function drawBirds(){for(const b of birds){b.x+=b.v;b.y+=Math.sin(t*2+b.p)*.28;const flap=Math.sin(t*7+b.wing)*.18;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(t*2+b.p)*.04);ctx.scale(b.s,1+b.s*.05);ctx.strokeStyle='#dcecffcc';ctx.lineWidth=1.8;ctx.rotate(flap);birdPath(1);ctx.stroke();ctx.restore()}for(let i=birds.length-1;i>=0;i--)if(birds[i].x>W+100)birds.splice(i,1)}
function drawSolar(){const cx=W*.5,cy=H*.5;ctx.save();ctx.translate(cx,cy);ctx.globalAlpha=Math.min(1,Math.max(0,(phase-8)/4));for(let r=70;r<260;r+=60){ctx.strokeStyle='#ffffff13';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,r,r*.38,0,0,TAU);ctx.stroke()}const sun=ctx.createRadialGradient(0,0,5,0,0,65);sun.addColorStop(0,'#fff');sun.addColorStop(.3,'#ffd45e');sun.addColorStop(1,'#ff8b2500');ctx.fillStyle=sun;ctx.beginPath();ctx.arc(0,0,65,0,TAU);ctx.fill();const ps=[['#62e8ff',105,.8,0],['#ff8b67',165,.5,2],['#9b7cff',225,.32,4]];for(const [col,r,sp,off] of ps){const a=t*sp+off,px=Math.cos(a)*r,py=Math.sin(a)*r*.38;ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,12+sp*8,0,TAU);ctx.fill()}ctx.restore()}
function drawAstronaut(x,y,s,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);ctx.rotate(Math.sin(t*1.3+x)*.08);ctx.fillStyle='#eef5ff';ctx.strokeStyle='#9db7d6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-20,17,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#17315c';ctx.beginPath();ctx.ellipse(0,-20,11,8,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-18,-2,36,42,10);ctx.fill();ctx.stroke();ctx.fillStyle='#ffcf63';ctx.fillRect(-12,8,24,10);ctx.strokeStyle='#dbe9ff';ctx.beginPath();ctx.moveTo(-18,8);ctx.lineTo(-35,23);ctx.moveTo(18,8);ctx.lineTo(35,-1);ctx.moveTo(-8,40);ctx.lineTo(-18,58);ctx.moveTo(8,40);ctx.lineTo(18,58);ctx.stroke();ctx.restore()}
function caption(text,sub,ms=1500){const el=document.getElementById('caption');el.classList.remove('show');setTimeout(()=>{el.querySelector('h2').textContent=text;el.querySelector('p').textContent=sub;el.classList.add('show')},80);setTimeout(()=>el.classList.remove('show'),ms)}
function begin(){if(started)return;started=true;initAudio();document.getElementById('intro').classList.add('hide');document.getElementById('stage').classList.add('stage-on');phase=0;t=0;setTimeout(()=>{phase=1;caption('A sky full of wishes','Tonight, every little star is celebrating him.',1400);for(let i=0;i<5;i++)setTimeout(()=>starBomb(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4)),i*250)},700);setTimeout(()=>{phase=2;for(let i=0;i<8;i++)setTimeout(shootingStar,i*150);caption('The night is waking up','Every light has a little surprise.',1200)},2100);setTimeout(()=>{phase=3;spawnBirds();caption('Look up…','Something beautiful is flying through the night.',1300);tone(620,.7,'sine',.035,300)},3500);setTimeout(()=>{phase=4;for(let i=0;i<8;i++)setTimeout(()=>starBomb(W*(.1+Math.random()*.8),H*(.12+Math.random()*.55)),i*180);caption('A little more magic','Because one celebration is never enough.',1200)},5200);setTimeout(()=>{phase=5;caption('Make a wish','Let the comets carry it across the sky.',1300);for(let i=0;i<12;i++)setTimeout(comet,i*150)},6800);setTimeout(()=>{phase=7;caption('The whole sky is celebrating','Now… let the night explode with color.',1500);for(let i=0;i<13;i++)setTimeout(rocket,i*190)},8500);setTimeout(()=>{phase=9;caption('Beyond the stars','His own little universe is waiting.',1500);for(let i=0;i<5;i++)setTimeout(()=>starBomb(W*(.2+Math.random()*.6),H*(.15+Math.random()*.5)),i*260)},10800);setTimeout(()=>{phase=10;document.getElementById('caption').classList.remove('show');document.getElementById('final').classList.add('final-on');canvas.style.opacity='0';tone(523,.35,'sine',.05,200);setTimeout(()=>tone(659,.45,'sine',.05,150),180)},12800)}
function candleClick(e){const el=e.currentTarget;if(el.classList.contains('off'))return;el.classList.add('off');const r=el.getBoundingClientRect();starBomb(r.left+r.width/2,r.top+r.height/2-30);tone(880,.16,'sine',.05,-400);if(document.querySelectorAll('.candle:not(.off)').length===0)setTimeout(begin,450)}
document.querySelectorAll('.candle').forEach(c=>c.addEventListener('click',candleClick));
function loop(ts){const dt=Math.min(.04,(ts-(loop.last||ts))/1000);loop.last=ts;t+=dt;if(canvas.style.opacity!=='0'){ctx.save();if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBackground();if(started){if(phase>=2)drawShooters();if(phase>=3)drawBirds();if(phase>=5)drawComets();if(phase>=7)drawRockets();drawRings();drawSolar();if(phase>=9){drawAstronaut(W*.15,H*.5,1.15,1);drawAstronaut(W*.84,H*.57,.9,-1);drawAstronaut(W*.53,H*.16,.62,1)}drawParticles()}ctx.restore();shake*=.88;flash*=.86;if(flash>.02){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H)}}frameCount++;if(ts-lastPerf>1500){const fps=frameCount*1000/(ts-lastPerf);quality=fps<45?.55:fps<52?.72:.9;frameCount=0;lastPerf=ts}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
