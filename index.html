<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Zwe Htet Myat — Birthday Memory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01020a;color:#fff;font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#start{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:radial-gradient(circle at 50% 40%,#202d78 0,#090d32 43%,#01020a 100%);transition:opacity 1.4s ease,visibility 1.4s}.startCard{position:relative;text-align:center;width:min(720px,88vw);padding:48px 50px;border:1px solid rgba(255,255,255,.2);border-radius:32px;background:rgba(7,10,32,.68);backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12);animation:float 4s ease-in-out infinite}.startCard:before{content:"";position:absolute;inset:-2px;border-radius:34px;background:linear-gradient(120deg,transparent,rgba(255,220,235,.3),transparent);opacity:.7;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#ffe0ad}.startCard h1{margin:18px 0 12px;font:800 clamp(42px,7vw,82px)/1.02 Georgia,serif;background:linear-gradient(90deg,#fff,#ffd0e5,#ffe59c,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.startCard p{margin:0 auto 30px;max-width:580px;color:#dfe2f4;font-size:17px}.startBtn{position:relative;z-index:60;border:0;border-radius:999px;padding:17px 38px;font-size:17px;font-weight:900;color:#281323;background:linear-gradient(135deg,#fff,#ffd0e6 50%,#ffe7a8);box-shadow:0 14px 45px rgba(255,150,205,.3);cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none}.startBtn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 20px 65px rgba(255,150,205,.45)}.startBtn:active{transform:scale(.96)}#start.hide{opacity:0;visibility:hidden;pointer-events:none}#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s}#hud.show{opacity:1}.caption{position:absolute;left:50%;bottom:5.5vh;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 3px 25px #000}.caption h2{margin:0;font:800 clamp(34px,5vw,70px) Georgia,serif}.caption h3{margin:8px 0;font:800 clamp(26px,3.7vw,50px) Georgia,serif;color:#ffd7e8}.caption p{margin:0;color:#fff2d5;font-size:clamp(12px,1.4vw,18px)}#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;opacity:0;padding:8px 16px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(4,5,18,.5);backdrop-filter:blur(8px);font-size:12px;transition:opacity .7s;pointer-events:none}@keyframes float{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="startCard"><div class="eyebrow">A little memory, made just for you</div><h1>Zwe Htet Myat</h1><p>ဒီနေ့အတွက် မမေ့နိုင်တဲ့ မွေးနေ့အမှတ်တရလေး စလိုက်ရအောင်။</p><button id="begin" class="startBtn" type="button">Enter the Memory ✦</button></div></div>
<div id="hud"><div class="caption"><h2>Happy Birthday</h2><h3>Zwe Htet Myat</h3><p>ဒီအချိန်လေးကို အမှတ်တရအဖြစ် သိမ်းထားပါ ✦</p></div></div>
<div id="hint">Click anywhere to launch another firework ✦</div>
<audio id="song" preload="auto" crossorigin="anonymous" src="https://lh3.googleusercontent.com/d/1_dO985YcSHPl1nPr3TpodAEYkPb79j_8"></audio>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const start=document.getElementById('start');
const begin=document.getElementById('begin');
const hud=document.getElementById('hud');
const hint=document.getElementById('hint');
const song=document.getElementById('song');
const photo=new Image(); photo.decoding='async'; photo.src='https://lh3.googleusercontent.com/d/1_Q0iJvmFqyZ-uceriN1ap85lg--WK1uQ';
const TAU=Math.PI*2;
const COLORS=['#ff4fa3','#ffd84d','#43e8ff','#a36cff','#68ef85','#ff6b6b','#ff9b42','#ffffff'];
let W=0,H=0,DPR=1,started=false,last=0,time=0,shake=0,flash=0,beat=0,audioCtx=null,analyser=null,mediaSource=null;
const stars=[],dust=[],rockets=[],particles=[],rings=[],confetti=[],birds=[];
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);stars.length=0;dust.length=0;for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.78,r:.3+Math.random()*1.5,a:Math.random()*TAU,s:Math.random()*2});for(let i=0;i<90;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.5,v:.02+Math.random()*.12,a:Math.random()*TAU});birds.length=0;for(let i=0;i<7;i++)birds.push({x:Math.random()*W,y:H*(.18+Math.random()*.28),v:.2+Math.random()*.35,s:5+Math.random()*5,p:Math.random()*TAU})}
addEventListener('resize',resize);resize();
function audioInit(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(!mediaSource){mediaSource=audioCtx.createMediaElementSource(song);analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;mediaSource.connect(analyser);analyser.connect(audioCtx.destination)}}catch(e){}}
function tone(freq=140,duration=.12,gain=.025,type='sine'){if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.0001,n+duration);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+duration+.03)}
function boom(power=1){if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(90,n);o.frequency.exponentialRampToValueAtTime(25,n+.55);f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16*power,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.65);o.connect(f).connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.68)}
function addParticle(x,y,vx,vy,color,life=1,size=2){if(particles.length>1200)return;particles.push({x,y,px:x,py:y,vx,vy,color,life,size,drag:.982+Math.random()*.014})}
function launch(x=W*(.1+Math.random()*.8),targetY=H*(.1+Math.random()*.4),color=COLORS[(Math.random()*COLORS.length)|0],power=1){if(rockets.length>10)return;rockets.push({x,y:H+25,targetY,vy:-10.5-Math.random()*2.5,color,trail:[],power});tone(110+Math.random()*40,.16,.012,'sawtooth')}
function burst(x,y,color,style='peony',power=1){let count=style==='willow'?150:style==='ring'?115:175;for(let i=0;i<count;i++){const a=TAU*i/count+Math.random()*.07;let speed=style==='willow'?1.2+Math.random()*4.8:2.2+Math.random()*6;if(style==='ring')speed=4.3+Math.random()*.9;addParticle(x,y,Math.cos(a)*speed,Math.sin(a)*speed,color,style==='willow'?2.1:1.45,1+Math.random()*2.4)}for(let i=0;i<35;i++){const a=Math.random()*TAU,s=1+Math.random()*3.5;addParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,'#fff',.8,1.2+Math.random()*1.5)}rings.push({x,y,r:5,life:1,color});boom(power);flash=Math.min(1,flash+.25*power);shake=Math.min(22,shake+7*power)}
function explode(r){const styles=['peony','ring','willow'];burst(r.x,r.targetY,r.color,styles[(Math.random()*styles.length)|0],r.power);if(Math.random()<.55)setTimeout(()=>{if(started)burst(r.x+(Math.random()-.5)*140,r.targetY+(Math.random()-.5)*90,COLORS[(Math.random()*COLORS.length)|0],'peony',.7)},120)}
function confettiBurst(x=W/2,y=H*.45,count=220){for(let i=0;i<count;i++){const a=Math.random()*TAU,s=2+Math.random()*8;confetti.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,color:COLORS[i%COLORS.length],life:1,r:2+Math.random()*4,rot:Math.random()*TAU})}}
function updateBeat(){if(analyser){const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];beat=Math.min(1,sum/data.length/70)}else beat=.5+.5*Math.sin(time*5.5)}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020318');g.addColorStop(.5,'#09124b');g.addColorStop(1,'#010207');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.42,Math.max(W,H)*.65);glow.addColorStop(0,'rgba(85,95,255,.14)');glow.addColorStop(.55,'rgba(50,40,160,.05)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.2+.65*(.5+.5*Math.sin(time*1.8+s.a));ctx.fillStyle='#fff8dd';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}for(const p of dust){p.y-=p.v;if(p.y<0)p.y=H*.85;ctx.globalAlpha=.08+.12*Math.sin(time+p.a);ctx.fillStyle='#ffdbea';ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1}
function drawBirds(){ctx.save();ctx.strokeStyle='rgba(8,10,20,.85)';ctx.lineWidth=2;for(const b of birds){b.x+=b.v;if(b.x>W+30)b.x=-30;b.p+=.04;const wing=Math.sin(b.p)*b.s;ctx.beginPath();ctx.moveTo(b.x-b.s*2,b.y);ctx.quadraticCurveTo(b.x-b.s,b.y-wing,b.x,b.y);ctx.quadraticCurveTo(b.x+b.s,b.y-wing,b.x+b.s*2,b.y);ctx.stroke()}ctx.restore()}
function drawPhoto(alpha,scale){if(!photo.complete||!photo.naturalWidth)return;const w=Math.min(W*.31,430)*scale,h=w*.86,x=W/2-w/2,y=H*.14-(scale-1)*h*.35;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='rgba(255,150,220,.45)';ctx.shadowBlur=40;ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x-9,y-9,w+18,h+18,25);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.roundRect(x,y,w,h,20);ctx.clip();ctx.drawImage(photo,x,y,w,h);ctx.restore();ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='rgba(255,220,240,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,w,h,20);ctx.stroke();ctx.restore()}
function drawCake(alpha){const w=Math.min(W*.34,480),x=W/2,y=H*.88;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='rgba(255,100,180,.35)';ctx.shadowBlur=30;ctx.fillStyle='#d879a4';ctx.beginPath();ctx.roundRect(x-w/2,y,w,58,16);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff4f7';ctx.beginPath();ctx.roundRect(x-w*.43,y-14,w*.86,25,12);ctx.fill();for(let i=0;i<7;i++){const cx=x-w*.36+i*w*.12;ctx.fillStyle='#ffd15c';ctx.fillRect(cx-3,y-31,6,18);ctx.shadowColor='#ffae3d';ctx.shadowBlur=15;ctx.fillStyle='#ff9d38';ctx.beginPath();ctx.moveTo(cx,y-33);ctx.bezierCurveTo(cx+6,y-28,cx+5,y-21,cx,y-18);ctx.bezierCurveTo(cx-5,y-21,cx-6,y-28,cx,y-33);ctx.fill();ctx.shadowBlur=0}ctx.restore()}
function updateEffects(dt){for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.trail.push([r.x,r.y]);if(r.trail.length>18)r.trail.shift();r.y+=r.vy;r.vy+=.13;if(r.y<=r.targetY){explode(r);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*.993+.055;p.life-=.018;if(p.life<=0)particles.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=9;q.life-=.027;if(q.life<=0)rings.splice(i,1)}for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.11;p.vx*=.995;p.rot+=.17;p.life-=.012;if(p.life<=0)confetti.splice(i,1)}shake=Math.max(0,shake-dt*24);flash=Math.max(0,flash-dt*1.9)}
function drawEffects(){ctx.save();ctx.globalCompositeOperation='lighter';for(const r of rockets){ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.globalAlpha=.55;ctx.beginPath();r.trail.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*.75,0,TAU);ctx.fill()}for(const q of rings){ctx.globalAlpha=q.life*.65;ctx.strokeStyle=q.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.stroke()}ctx.restore();for(const p of confetti){ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r,p.r,p.r*2.4);ctx.restore()}ctx.globalAlpha=1}
function render(now){const dt=Math.min(.033,(now-(last||now))/1000);last=now;time+=dt;ctx.setTransform(DPR,0,0,DPR,0,0);drawSky();if(started){updateBeat();updateEffects(dt);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);const pulse=1+beat*.025;if(time<4)drawPhoto(Math.min(1,time/1.8),1+(1-Math.min(1,time/4))*.08);else drawPhoto(.98,pulse);if(time>2)drawCake(Math.min(1,(time-2)/2));drawBirds();drawEffects();ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.72)+')';ctx.fillRect(0,0,W,H)}}requestAnimationFrame(render)}
requestAnimationFrame(render);
function startShow(e){if(e){e.preventDefault();e.stopPropagation()}if(started)return;started=true;start.classList.add('hide');hud.classList.add('show');hint.style.opacity='1';audioInit();try{song.currentTime=0;song.volume=.72;const p=song.play();if(p&&p.catch)p.catch(()=>{})}catch(err){}setTimeout(()=>hint.style.opacity='0',8000);setTimeout(()=>{for(let i=0;i<7;i++)setTimeout(()=>launch(W*(.12+i*.13),H*(.14+Math.random()*.28),COLORS[(i+1)%COLORS.length],1),i*260)},2200);setTimeout(()=>{for(let i=0;i<10;i++)setTimeout(()=>launch(W*(.08+Math.random()*.84),H*(.08+Math.random()*.38),COLORS[(Math.random()*COLORS.length)|0],1.1),i*210)},7000);setTimeout(()=>confettiBurst(),14500);setTimeout(()=>{for(let i=0;i<18;i++)setTimeout(()=>launch(W*(.06+Math.random()*.88),H*(.08+Math.random()*.45),COLORS[(Math.random()*COLORS.length)|0],1.25),i*150)},15500)}
begin.addEventListener('click',startShow,{passive:false});begin.addEventListener('pointerup',startShow,{passive:false});begin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='Space')startShow(e)});start.addEventListener('pointerdown',e=>{if(e.target===start||e.target.closest('.startCard')){}},{passive:true});
canvas.addEventListener('click',e=>{if(!started)return;launch(e.clientX,e.clientY*.9,COLORS[(Math.random()*COLORS.length)|0],.85)});window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!started)startShow(e);else if(e.code==='Space'&&started)launch(W*(.15+Math.random()*.7),H*(.1+Math.random()*.4),COLORS[(Math.random()*COLORS.length)|0],1)});
</script>
</body>
</html>
